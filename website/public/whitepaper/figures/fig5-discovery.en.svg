<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 182" role="img" aria-label="The implementation publishes at the canonical origin; the manifest and signed metadata are fetched by an evaluator-side secure module and handed to the engines." font-family="Georgia, 'Times New Roman', serif">
<title>Discovery from the canonical origin</title><desc>The implementation publishes at the canonical origin; the manifest and signed metadata are fetched by an evaluator-side secure module and handed to the engines.</desc>
<rect x="0" y="0" width="760" height="182" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="16" y="58" width="130" height="50" rx="4"/><text x="81" y="78" text-anchor="middle" font-size="11.5">implementation</text><text x="81" y="95" text-anchor="middle" font-size="9" class="m">publishes</text><line class="l" x1="146" y1="83" x2="172" y2="83" marker-end="url(#a)"/><rect class="b" x="174" y="58" width="140" height="50" rx="4"/><text x="244" y="78" text-anchor="middle" font-size="11.5">canonical origin</text><text x="244" y="95" text-anchor="middle" font-size="9" class="m">.well-known</text><line class="l" x1="314" y1="83" x2="340" y2="83" marker-end="url(#a)"/><rect class="b" x="342" y="52" width="150" height="62" rx="4"/><text x="417" y="76" text-anchor="middle" font-size="11.5">manifest and</text><text x="417" y="93" text-anchor="middle" font-size="9" class="m">signed metadata</text><line class="l" x1="492" y1="83" x2="518" y2="83" marker-end="url(#a)"/><rect class="b" x="520" y="58" width="150" height="50" rx="4"/><text x="595" y="78" text-anchor="middle" font-size="11">secure fetch</text><text x="595" y="95" text-anchor="middle" font-size="9" class="m">evaluator side</text><line class="l" x1="595" y1="108" x2="595" y2="132" marker-end="url(#a)"/><rect class="b" x="520" y="132" width="150" height="36" rx="4"/><text x="595" y="155" text-anchor="middle" font-size="11.5">engines</text><text x="377" y="150" text-anchor="middle" font-size="9.5" class="m">never from a caller-supplied URL</text>
</svg>
