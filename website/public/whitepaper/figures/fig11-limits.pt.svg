<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" role="img" aria-label="O BANZA avalia condições técnicas observáveis; autorização regulatória, controlos internos, acordos comerciais, admissão em esquemas e acesso a redes externas ficam fora do âmbito." font-family="Georgia, 'Times New Roman', serif">
<title>Fronteira do que o BANZA avalia</title><desc>O BANZA avalia condições técnicas observáveis; autorização regulatória, controlos internos, acordos comerciais, admissão em esquemas e acesso a redes externas ficam fora do âmbito.</desc>
<rect x="0" y="0" width="760" height="214" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="d" x="30" y="18" width="700" height="178" rx="4"/><text x="54" y="42" text-anchor="start" font-size="11.5" class="n">fora do âmbito observado</text><text x="54" y="70" text-anchor="start" font-size="9.5" class="m">· autorização regulatória</text><text x="54" y="91" text-anchor="start" font-size="9.5" class="m">· controlos internos do operador</text><text x="54" y="112" text-anchor="start" font-size="9.5" class="m">· comportamento fora do protocolo</text><text x="54" y="133" text-anchor="start" font-size="9.5" class="m">· acordos comerciais e admissão em esquemas</text><text x="54" y="154" text-anchor="start" font-size="9.5" class="m">· acesso efectivo a infraestruturas ou redes externas</text><rect class="b" x="398" y="56" width="308" height="118" rx="4"/><text x="552" y="84" text-anchor="middle" font-size="11.5" class="n">o BANZA avalia</text><text x="552" y="110" text-anchor="middle" font-size="9.5" class="m">conformidade face a um perfil público</text><text x="552" y="131" text-anchor="middle" font-size="9.5" class="m">artefactos declarados, no instante observado</text><text x="552" y="158" text-anchor="middle" font-size="9.5" class="m">um resultado técnico não representa autorização</text>
</svg>
