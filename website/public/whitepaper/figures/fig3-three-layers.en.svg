<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Layer 1 protocol, Layer 2 certification, Layer 3 operational schemes; BanzAI is transversal across all three, not a fourth layer." font-family="Georgia, 'Times New Roman', serif">
<title>The three institutional layers</title><desc>Layer 1 protocol, Layer 2 certification, Layer 3 operational schemes; BanzAI is transversal across all three, not a fourth layer.</desc>
<rect x="0" y="0" width="760" height="260" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="40" y="30" width="560" height="60" rx="4"/><text x="320" y="56" text-anchor="middle" font-size="13" class="n">Layer 1 — Open protocol</text><text x="320" y="75" text-anchor="middle" font-size="9.5" class="m">rules, contracts, identity, trust</text><rect class="b" x="40" y="105" width="560" height="60" rx="4"/><text x="320" y="131" text-anchor="middle" font-size="13" class="n">Layer 2 — Conformance and Interoperability Certification</text><text x="320" y="150" text-anchor="middle" font-size="9.5" class="m">evaluates an implementation, from evidence</text><rect class="b" x="40" y="180" width="560" height="60" rx="4"/><text x="320" y="206" text-anchor="middle" font-size="13" class="n">Layer 3 — Operational schemes</text><text x="320" y="225" text-anchor="middle" font-size="9.5" class="m">independent, subject to the applicable framework</text><rect class="d" x="630" y="30" width="100" height="210" rx="4"/><text x="680" y="120" text-anchor="middle" font-size="13">BanzAI</text><text x="680" y="140" text-anchor="middle" font-size="9" class="m">transversal</text><text x="680" y="154" text-anchor="middle" font-size="9" class="m">interface</text><line class="d" x1="600" y1="135" x2="630" y2="135"/><text x="320" y="250" text-anchor="middle" font-size="9.5" class="m">layers separated by responsibility, infrastructure and keys</text>
</svg>
