dth="160" height="32" rx="4"/><text x="610" y="233" text-anchor="middle" font-size="10.5">Network Z</text><line class="d" x1="380" y1="158" x2="380" y2="176" marker-end="url(#a)"/><rect class="d" x="40" y="268" width="680" height="22" rx="4"/><text x="380" y="283" text-anchor="middle" font-size="9.5" class="m">BanzAI — transversal, non-authoritative interface; the protocol works without it</text>
