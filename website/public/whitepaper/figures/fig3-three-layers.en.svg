<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-label="Layer 1, open protocol; distinct implementations; Layer 2, conformance and interoperability certification; Layer 3, independent operational schemes; BanzAI transversal." font-family="Georgia, 'Times New Roman', serif">
