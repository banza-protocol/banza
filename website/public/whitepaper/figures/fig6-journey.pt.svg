<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Oito passos técnicos e um passo de agregação; cada passo falha por omissão e a Prontidão nunca devolve certificação." font-family="Georgia, 'Times New Roman', serif">
<title>A jornada determinística de nove passos</title><desc>Oito passos técnicos e um passo de agregação; cada passo falha por omissão e a Prontidão nunca devolve certificação.</desc>
<rect x="0" y="0" width="760" height="320" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="16" y="30" width="170" height="52" rx="4"/><text x="101.0" y="54" text-anchor="middle" font-size="11.5">1. Descoberta</text><rect class="b" x="202" y="30" width="170" height="52" rx="4"/><text x="287.0" y="54" text-anchor="middle" font-size="11.5">2. Manifesto</text><rect class="b" x="388" y="30" width="170" height="52" rx="4"/><text x="473.0" y="54" text-anchor="middle" font-size="11.5">3. Chaves</text><rect class="b" x="574" y="30" width="170" height="52" rx="4"/><text x="659.0" y="54" text-anchor="middle" font-size="11.5">4. Conformidade</text><line class="l" x1="186" y1="56" x2="202" y2="56" marker-end="url(#a)"/><line class="l" x1="372" y1="56" x2="388" y2="56" marker-end="url(#a)"/><line class="l" x1="558" y1="56" x2="574" y2="56" marker-end="url(#a)"/><rect class="b" x="16" y="110" width="170" height="52" rx="4"/><text x="101.0" y="134" text-anchor="middle" font-size="11.5">5. Interoper.</text><rect class="b" x="202" y="110" width="170" height="52" rx="4"/><text x="287.0" y="134" text-anchor="middle" font-size="11.5">6. Confiança</text><rect class="b" x="388" y="110" width="170" height="52" rx="4"/><text x="473.0" y="134" text-anchor="middle" font-size="11.5">7. Federação</text><rect class="b" x="574" y="110" width="170" height="52" rx="4"/><text x="659.0" y="134" text-anchor="middle" font-size="11.5">8. Pacote de Ev.</text><line class="l" x1="186" y1="136" x2="202" y2="136" marker-end="url(#a)"/><line class="l" x1="372" y1="136" x2="388" y2="136" marker-end="url(#a)"/><line class="l" x1="558" y1="136" x2="574" y2="136" marker-end="url(#a)"/><line class="l" x1="659.0" y1="82" x2="659.0" y2="96"/><line class="l" x1="101.0" y1="96" x2="659.0" y2="96"/><line class="l" x1="101.0" y1="96" x2="101.0" y2="110" marker-end="url(#a)"/><line class="l" x1="101.0" y1="162" x2="101.0" y2="196" marker-end="url(#a)"/><rect class="b" x="16" y="196" width="728" height="52" rx="4"/><text x="380" y="218" text-anchor="middle" font-size="12.5" class="n">9. Prontidão para Certificação</text><text x="380" y="236" text-anchor="middle" font-size="9.5" class="m">agrega os oito passos · nunca devolve CERTIFICADO</text><text x="16" y="278" text-anchor="start" font-size="9.5" class="m">estados: verificado · pendente · falhado · bloqueado</text><text x="16" y="298" text-anchor="start" font-size="9.5" class="m">fecho por omissão: entrada ausente ou inconsistente → não aprovado</text>
</svg>
