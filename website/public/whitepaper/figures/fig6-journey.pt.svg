<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-label="Oito passos técnicos e um passo de agregação; cada passo recebe um estado e falha por omissão; a prontidão para certificação agrega os passos requeridos e não constitui certificação." font-family="Georgia, 'Times New Roman', serif">
