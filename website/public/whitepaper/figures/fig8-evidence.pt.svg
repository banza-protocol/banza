<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="Os motores avaliam artefactos e produzem resultados e recibos; o Pacote de Evidências reúne material verificável; o Registo Técnico é opcional; o BanzAI apenas apresenta e explica." font-family="Georgia, 'Times New Roman', serif">
<title>Dos artefactos ao Pacote de Evidências</title><desc>Os motores avaliam artefactos e produzem resultados e recibos; o Pacote de Evidências reúne material verificável; o Registo Técnico é opcional; o BanzAI apenas apresenta e explica.</desc>
<rect x="0" y="0" width="760" height="220" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="24" y="26" width="168" height="50" rx="4"/><text x="108" y="49" text-anchor="middle" font-size="12">artefactos</text><text x="108" y="67" text-anchor="middle" font-size="9.5" class="m">obtidos da origem</text><line class="l" x1="192" y1="51" x2="210" y2="51" marker-end="url(#a)"/><rect class="b" x="212" y="26" width="176" height="50" rx="4"/><text x="300" y="49" text-anchor="middle" font-size="12">motores determinísticos</text><text x="300" y="67" text-anchor="middle" font-size="9.5" class="m">avaliam</text><line class="l" x1="388" y1="51" x2="406" y2="51" marker-end="url(#a)"/><rect class="b" x="408" y="26" width="150" height="50" rx="4"/><text x="483" y="49" text-anchor="middle" font-size="12">resultados</text><text x="483" y="67" text-anchor="middle" font-size="9.5" class="m">e recibos</text><line class="l" x1="558" y1="51" x2="576" y2="51" marker-end="url(#a)"/><rect class="b" x="578" y="26" width="158" height="50" rx="4"/><text x="657" y="47" text-anchor="middle" font-size="12">Pacote de</text><text x="657" y="65" text-anchor="middle" font-size="12">Evidências</text><line class="d" x1="657" y1="76" x2="657" y2="120" marker-end="url(#a)"/><rect class="d" x="578" y="120" width="158" height="42" rx="4"/><text x="657" y="140" text-anchor="middle" font-size="11">Registo Técnico</text><text x="657" y="156" text-anchor="middle" font-size="9.5" class="m">opcional e separado</text><rect class="d" x="24" y="180" width="712" height="32" rx="4"/><text x="380" y="200" text-anchor="middle" font-size="10.5">BanzAI — apresenta e explica; não determina resultados nem publica evidência por si só</text>
</svg>
