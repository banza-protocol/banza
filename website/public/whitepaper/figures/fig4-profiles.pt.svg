<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" role="img" aria-label="Cinco níveis cumulativos: L0 configuração segura, L1 pagamento, L2 iniciação, L3 interoperabilidade entre operadores e limiar de federação, L4 integração externa." font-family="Georgia, 'Times New Roman', serif">
<title>Perfis de conformidade cumulativos, de L0 a L4</title><desc>Cinco níveis cumulativos: L0 configuração segura, L1 pagamento, L2 iniciação, L3 interoperabilidade entre operadores e limiar de federação, L4 integração externa.</desc>
<rect x="0" y="0" width="760" height="244" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="80" y="20" width="640" height="38" rx="4"/><text x="112" y="44" text-anchor="middle" font-size="12.5" class="n">L4</text><text x="150" y="36" text-anchor="start" font-size="10.5">External Interoperability</text><text x="150" y="51" text-anchor="start" font-size="9" class="m">integração externa · definido por perfil</text><rect class="b" x="80" y="62" width="640" height="38" rx="4"/><text x="112" y="86" text-anchor="middle" font-size="12.5" class="n">L3</text><text x="150" y="78" text-anchor="start" font-size="10.5">Inter-Operator Interoperability</text><text x="150" y="93" text-anchor="start" font-size="9" class="m">evidência entre operadores · limiar de federação</text><rect class="b" x="80" y="104" width="640" height="38" rx="4"/><text x="112" y="128" text-anchor="middle" font-size="12.5" class="n">L2</text><text x="150" y="120" text-anchor="start" font-size="10.5">Payment Initiation Capability</text><text x="150" y="135" text-anchor="start" font-size="9" class="m">pedidos · QR dinâmico</text><rect class="b" x="80" y="146" width="640" height="38" rx="4"/><text x="112" y="170" text-anchor="middle" font-size="12.5" class="n">L1</text><text x="150" y="162" text-anchor="start" font-size="10.5">Core Payment Capability</text><text x="150" y="177" text-anchor="start" font-size="9" class="m">pagamento · transferência · rastreabilidade</text><rect class="b" x="80" y="188" width="640" height="38" rx="4"/><text x="112" y="212" text-anchor="middle" font-size="12.5" class="n">L0</text><text x="150" y="204" text-anchor="start" font-size="10.5">Protocol Sandbox</text><text x="150" y="219" text-anchor="start" font-size="9" class="m">configuração segura · representação monetária correcta</text><line class="l" x1="52" y1="222" x2="52" y2="24" marker-end="url(#a)"/><text x="46" y="125" text-anchor="middle" font-size="9" class="m" transform="rotate(-90 46 125)">inclui os níveis inferiores</text><text x="400" y="238" text-anchor="middle" font-size="9.5" class="m">níveis cumulativos · evidência de conformidade, não certificação nem autorização</text>
</svg>
