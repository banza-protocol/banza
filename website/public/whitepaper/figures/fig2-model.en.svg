<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="An operator publishes an implementation with version, profile, environment and canonical origin; the observed artifacts yield a bounded result." font-family="Georgia, 'Times New Roman', serif">
