<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Um operador publica uma implementação com versão, perfil, ambiente e origem canónica; os artefactos observados produzem um resultado delimitado." font-family="Georgia, 'Times New Roman', serif">
<title>Operador, implementação e resultado delimitado</title><desc>Um operador publica uma implementação com versão, perfil, ambiente e origem canónica; os artefactos observados produzem um resultado delimitado.</desc>
<rect x="0" y="0" width="760" height="200" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="20" y="74" width="120" height="52" rx="4"/><text x="80" y="98" text-anchor="middle" font-size="13">operador</text><text x="80" y="115" text-anchor="middle" font-size="9" class="m">entidade responsável</text><line class="l" x1="140" y1="100" x2="168" y2="100" marker-end="url(#a)"/><rect class="b" x="170" y="54" width="200" height="92" rx="4"/><text x="270" y="80" text-anchor="middle" font-size="13">implementação</text><text x="270" y="103" text-anchor="middle" font-size="9" class="m">versão · perfil</text><text x="270" y="120" text-anchor="middle" font-size="9" class="m">ambiente · origem canónica</text><line class="l" x1="370" y1="100" x2="398" y2="100" marker-end="url(#a)"/><rect class="b" x="400" y="74" width="150" height="52" rx="4"/><text x="475" y="96" text-anchor="middle" font-size="11.5">artefactos</text><text x="475" y="114" text-anchor="middle" font-size="9" class="m">observados no instante t</text><line class="l" x1="550" y1="100" x2="578" y2="100" marker-end="url(#a)"/><rect class="b" x="580" y="66" width="160" height="68" rx="4"/><text x="660" y="92" text-anchor="middle" font-size="13">resultado</text><text x="660" y="110" text-anchor="middle" font-size="9" class="m">delimitado · (R, E, P)</text>
