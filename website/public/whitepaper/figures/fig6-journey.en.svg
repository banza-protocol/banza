<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-label="Eight technical steps and one aggregation step; each step gets a state and fails closed; certification readiness aggregates the required steps and is not a certification." font-family="Georgia, 'Times New Roman', serif">
