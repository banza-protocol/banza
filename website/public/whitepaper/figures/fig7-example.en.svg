<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Operator B publishes the artifacts; Operator A starts the journey; a secure component retrieves them; the engines validate; Operator A verifies and decides." font-family="Georgia, 'Times New Roman', serif">
<title>Example — Operator A evaluates Operator B</title><desc>Operator B publishes the artifacts; Operator A starts the journey; a secure component retrieves them; the engines validate; Operator A verifies and decides.</desc>
<rect x="0" y="0" width="760" height="300" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<text x="20" y="40" text-anchor="start" font-size="11" class="n">Operator B</text><text x="20" y="175" text-anchor="start" font-size="11" class="n">Operator A / evaluator</text><line class="d" x1="16" y1="110" x2="744" y2="110"/><rect class="b" x="30" y="50" width="170" height="46" rx="4"/><text x="115" y="70" text-anchor="middle" font-size="10.5">1 · publishes</text><text x="115" y="86" text-anchor="middle" font-size="9" class="m">Manifest, keys, artifacts</text><rect class="b" x="30" y="185" width="150" height="46" rx="4"/><text x="105" y="205" text-anchor="middle" font-size="10.5">2 · starts</text><text x="105" y="221" text-anchor="middle" font-size="9" class="m">the journey</text><line class="l" x1="180" y1="208" x2="214" y2="208" marker-end="url(#a)"/><rect class="b" x="216" y="185" width="150" height="46" rx="4"/><text x="291" y="205" text-anchor="middle" font-size="10.5">3 · retrieves</text><text x="291" y="221" text-anchor="middle" font-size="9" class="m">secure component</text><line class="l" x1="291" y1="185" x2="291" y2="96" marker-end="url(#a)"/><rect class="b" x="216" y="50" width="150" height="46" rx="4"/><text x="291" y="70" text-anchor="middle" font-size="10.5">canonical origin</text><text x="291" y="86" text-anchor="middle" font-size="9" class="m">signed artifacts</text><line class="l" x1="366" y1="208" x2="400" y2="208" marker-end="url(#a)"/><rect class="b" x="402" y="185" width="150" height="46" rx="4"/><text x="477" y="205" text-anchor="middle" font-size="10.5">4 · validates</text><text x="477" y="221" text-anchor="middle" font-size="9" class="m">engines · nine steps</text><line class="l" x1="552" y1="208" x2="586" y2="208" marker-end="url(#a)"/><rect class="b" x="588" y="185" width="156" height="46" rx="4"/><text x="666" y="205" text-anchor="middle" font-size="10.5">5 · verifies and decides</text><text x="666" y="221" text-anchor="middle" font-size="9" class="m">under its policy</text><text x="380" y="280" text-anchor="middle" font-size="9.5" class="m">BANZA decides no agreements, admission, settlement or authorisation</text>
</svg>
