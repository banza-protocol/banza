<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="Pré-produção: zero operadores de produção, zero certificações activas, dinheiro real desactivado, uma implementação de referência em testes e sem medições de desempenho." font-family="Georgia, 'Times New Roman', serif">
<title>Estado geral do BANZA</title><desc>Pré-produção: zero operadores de produção, zero certificações activas, dinheiro real desactivado, uma implementação de referência em testes e sem medições de desempenho.</desc>
<rect x="0" y="0" width="760" height="220" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<text x="380" y="30" text-anchor="middle" font-size="12.5" class="n">Estado geral — pré-produção</text><rect class="b" x="24" y="50" width="224" height="68" rx="4"/><text x="136" y="80" text-anchor="middle" font-size="11">pré-produção</text><text x="136" y="100" text-anchor="middle" font-size="9.5" class="m">protocolo e referência</text><rect class="b" x="268" y="50" width="224" height="68" rx="4"/><text x="380" y="80" text-anchor="middle" font-size="11">zero operadores</text><text x="380" y="100" text-anchor="middle" font-size="9.5" class="m">de produção</text><rect class="b" x="512" y="50" width="224" height="68" rx="4"/><text x="624" y="80" text-anchor="middle" font-size="11">zero certificações</text><text x="624" y="100" text-anchor="middle" font-size="9.5" class="m">técnicas activas</text><rect class="b" x="24" y="135" width="224" height="68" rx="4"/><text x="136" y="165" text-anchor="middle" font-size="11">dinheiro real</text><text x="136" y="185" text-anchor="middle" font-size="9.5" class="m">desactivado (fecho por omissão)</text><rect class="b" x="268" y="135" width="224" height="68" rx="4"/><text x="380" y="165" text-anchor="middle" font-size="11">implementação de referência</text><text x="380" y="185" text-anchor="middle" font-size="9.5" class="m">ambiente de testes isolado</text><rect class="b" x="512" y="135" width="224" height="68" rx="4"/><text x="624" y="165" text-anchor="middle" font-size="11">sem medições</text><text x="624" y="185" text-anchor="middle" font-size="9.5" class="m">de desempenho publicadas</text>
