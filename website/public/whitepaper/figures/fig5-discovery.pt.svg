<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="Uma implementação publica na origem canónica o Manifesto e as chaves; um módulo de obtenção segura entrega-os aos motores." font-family="Georgia, 'Times New Roman', serif">
<title>Origem canónica e obtenção segura</title><desc>Uma implementação publica na origem canónica o Manifesto e as chaves; um módulo de obtenção segura entrega-os aos motores.</desc>
<rect x="0" y="0" width="760" height="210" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="16" y="78" width="130" height="54" rx="4"/><text x="81" y="100" text-anchor="middle" font-size="12">implementação</text><text x="81" y="117" text-anchor="middle" font-size="9" class="m">publica</text><line class="l" x1="146" y1="105" x2="172" y2="105" marker-end="url(#a)"/><rect class="b" x="174" y="78" width="140" height="54" rx="4"/><text x="244" y="100" text-anchor="middle" font-size="12">origem canónica</text><text x="244" y="117" text-anchor="middle" font-size="9" class="m">.well-known</text><line class="l" x1="314" y1="105" x2="340" y2="105" marker-end="url(#a)"/><rect class="b" x="342" y="70" width="150" height="70" rx="4"/><text x="417" y="94" text-anchor="middle" font-size="12">Manifesto</text><text x="417" y="112" text-anchor="middle" font-size="9" class="m">metadados · chaves</text><line class="l" x1="492" y1="105" x2="518" y2="105" marker-end="url(#a)"/><rect class="b" x="520" y="78" width="150" height="54" rx="4"/><text x="595" y="98" text-anchor="middle" font-size="11.5">obtenção segura</text><text x="595" y="116" text-anchor="middle" font-size="9" class="m">lado do servidor</text><line class="l" x1="595" y1="132" x2="595" y2="158" marker-end="url(#a)"/><rect class="b" x="520" y="158" width="150" height="40" rx="4"/><text x="595" y="183" text-anchor="middle" font-size="12">motores</text><text x="377" y="175" text-anchor="middle" font-size="9.5" class="m">nunca a partir de URL do chamador</text>
