<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 152" role="img" aria-label="Protocol evolution separates proposal and discussion (RFC), recorded decision (ADR) and versioned publication, with coexistence and migration when applicable." font-family="Georgia, 'Times New Roman', serif">
<title>Protocol evolution: proposal, decision and publication</title><desc>Protocol evolution separates proposal and discussion (RFC), recorded decision (ADR) and versioned publication, with coexistence and migration when applicable.</desc>
<rect x="0" y="0" width="760" height="152" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="16" y="40" width="128" height="50" rx="4"/><text x="80.0" y="61" text-anchor="middle" font-size="10.5">version</text><text x="80.0" y="77" text-anchor="middle" font-size="9" class="m">published</text><rect class="b" x="166" y="40" width="128" height="50" rx="4"/><text x="230.0" y="61" text-anchor="middle" font-size="10.5">proposal and</text><text x="230.0" y="77" text-anchor="middle" font-size="9" class="m">discussion (RFC)</text><rect class="b" x="316" y="40" width="128" height="50" rx="4"/><text x="380.0" y="61" text-anchor="middle" font-size="10.5">recorded decision</text><text x="380.0" y="77" text-anchor="middle" font-size="9" class="m">(ADR)</text><rect class="b" x="466" y="40" width="128" height="50" rx="4"/><text x="530.0" y="61" text-anchor="middle" font-size="10.5">new version</text><text x="530.0" y="77" text-anchor="middle" font-size="9" class="m">published</text><rect class="b" x="616" y="40" width="128" height="50" rx="4"/><text x="680.0" y="61" text-anchor="middle" font-size="10.5">coexistence and migration</text><text x="680.0" y="77" text-anchor="middle" font-size="9" class="m">when applicable</text><line class="l" x1="144" y1="65" x2="166" y2="65" marker-end="url(#a)"/><line class="l" x1="294" y1="65" x2="316" y2="65" marker-end="url(#a)"/><line class="l" x1="444" y1="65" x2="466" y2="65" marker-end="url(#a)"/><line class="l" x1="594" y1="65" x2="616" y2="65" marker-end="url(#a)"/><text x="380" y="126" text-anchor="middle" font-size="9.5" class="m">governing the rules ≠ operating transactions ≠ authorising participants</text>
</svg>
