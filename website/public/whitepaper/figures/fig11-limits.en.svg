<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="BANZA evaluates conformance and observes the declared artifacts; regulatory authorisation, internal controls and off-protocol behaviour are out of scope." font-family="Georgia, 'Times New Roman', serif">
<title>Boundary of what BANZA evaluates</title><desc>BANZA evaluates conformance and observes the declared artifacts; regulatory authorisation, internal controls and off-protocol behaviour are out of scope.</desc>
<rect x="0" y="0" width="760" height="300" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="d" x="40" y="30" width="680" height="240" rx="4"/><text x="60" y="52" text-anchor="start" font-size="11" class="n">out of scope</text><text x="60" y="74" text-anchor="start" font-size="9.5" class="m">· regulatory authorisation</text><text x="60" y="92" text-anchor="start" font-size="9.5" class="m">· operator internal controls</text><text x="60" y="110" text-anchor="start" font-size="9.5" class="m">· off-protocol behaviour</text><rect class="b" x="200" y="140" width="360" height="110" rx="4"/><text x="380" y="168" text-anchor="middle" font-size="11.5" class="n">BANZA evaluates and observes</text><text x="380" y="192" text-anchor="middle" font-size="10" class="m">conformance against a public profile</text><text x="380" y="210" text-anchor="middle" font-size="10" class="m">declared artifacts, at the observed instant</text><text x="380" y="234" text-anchor="middle" font-size="9.5" class="m">a technical result does not represent authorisation</text>
</svg>
