<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="O Operador B publica os artefactos; o Operador A inicia a jornada; um módulo seguro obtém-nos; os motores validam; o Operador A verifica e decide." font-family="Georgia, 'Times New Roman', serif">
<title>Exemplo — Operador A avalia o Operador B</title><desc>O Operador B publica os artefactos; o Operador A inicia a jornada; um módulo seguro obtém-nos; os motores validam; o Operador A verifica e decide.</desc>
<rect x="0" y="0" width="760" height="300" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<text x="20" y="40" text-anchor="start" font-size="11" class="n">Operador B</text><text x="20" y="175" text-anchor="start" font-size="11" class="n">Operador A / avaliador</text><line class="d" x1="16" y1="110" x2="744" y2="110"/><rect class="b" x="30" y="50" width="170" height="46" rx="4"/><text x="115" y="70" text-anchor="middle" font-size="10.5">1 · publica</text><text x="115" y="86" text-anchor="middle" font-size="9" class="m">Manifesto, chaves, artefactos</text><rect class="b" x="30" y="185" width="150" height="46" rx="4"/><text x="105" y="205" text-anchor="middle" font-size="10.5">2 · inicia</text><text x="105" y="221" text-anchor="middle" font-size="9" class="m">a jornada</text><line class="l" x1="180" y1="208" x2="214" y2="208" marker-end="url(#a)"/><rect class="b" x="216" y="185" width="150" height="46" rx="4"/><text x="291" y="205" text-anchor="middle" font-size="10.5">3 · obtém</text><text x="291" y="221" text-anchor="middle" font-size="9" class="m">módulo seguro</text><line class="l" x1="291" y1="185" x2="291" y2="96" marker-end="url(#a)"/><rect class="b" x="216" y="50" width="150" height="46" rx="4"/><text x="291" y="70" text-anchor="middle" font-size="10.5">origem canónica</text><text x="291" y="86" text-anchor="middle" font-size="9" class="m">artefactos assinados</text><line class="l" x1="366" y1="208" x2="400" y2="208" marker-end="url(#a)"/><rect class="b" x="402" y="185" width="150" height="46" rx="4"/><text x="477" y="205" text-anchor="middle" font-size="10.5">4 · valida</text><text x="477" y="221" text-anchor="middle" font-size="9" class="m">motores · nove passos</text><line class="l" x1="552" y1="208" x2="586" y2="208" marker-end="url(#a)"/><rect class="b" x="588" y="185" width="156" height="46" rx="4"/><text x="666" y="205" text-anchor="middle" font-size="10.5">5 · verifica e decide</text><text x="666" y="221" text-anchor="middle" font-size="9" class="m">sob a sua política</text><text x="380" y="280" text-anchor="middle" font-size="9.5" class="m">o BANZA não decide acordos, admissão, liquidação nem autorização</text>
</svg>
