<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="Each considered threat maps to a protection mechanism and an expected result; missing or inconsistent inputs lead to fail-closed." font-family="Georgia, 'Times New Roman', serif">
<title>Threats, mechanisms and expected results</title><desc>Each considered threat maps to a protection mechanism and an expected result; missing or inconsistent inputs lead to fail-closed.</desc>
<rect x="0" y="0" width="760" height="268" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<text x="120.0" y="20" text-anchor="middle" font-size="11.5" class="n">threat</text><text x="393.0" y="20" text-anchor="middle" font-size="11.5" class="n">mechanism</text><text x="659.0" y="20" text-anchor="middle" font-size="11.5" class="n">expected result</text><rect class="b" x="16" y="32" width="208" height="34" rx="4"/><text x="120.0" y="53.0" text-anchor="middle" font-size="9.5">artifact tampering</text><line class="l" x1="224" y1="49.0" x2="268" y2="49.0" marker-end="url(#a)"/><rect class="b" x="268" y="32" width="250" height="34" rx="4"/><text x="393.0" y="53.0" text-anchor="middle" font-size="9.5">signatures and digests verified</text><line class="l" x1="518" y1="49.0" x2="574" y2="49.0" marker-end="url(#a)"/><rect class="b" x="574" y="32" width="170" height="34" rx="4"/><text x="659.0" y="53.0" text-anchor="middle" font-size="9.5" class="n">detection</text><rect class="b" x="16" y="72" width="208" height="34" rx="4"/><text x="120.0" y="93.0" text-anchor="middle" font-size="9.5">spoofed origin</text><line class="l" x1="224" y1="89.0" x2="268" y2="89.0" marker-end="url(#a)"/><rect class="b" x="268" y="72" width="250" height="34" rx="4"/><text x="393.0" y="93.0" text-anchor="middle" font-size="9.5">canonical origin resolved</text><line class="l" x1="518" y1="89.0" x2="574" y2="89.0" marker-end="url(#a)"/><rect class="b" x="574" y="72" width="170" height="34" rx="4"/><text x="659.0" y="93.0" text-anchor="middle" font-size="9.5" class="n">rejection</text><rect class="b" x="16" y="112" width="208" height="34" rx="4"/><text x="120.0" y="133.0" text-anchor="middle" font-size="9.5">revoked or expired key</text><line class="l" x1="224" y1="129.0" x2="268" y2="129.0" marker-end="url(#a)"/><rect class="b" x="268" y="112" width="250" height="34" rx="4"/><text x="393.0" y="133.0" text-anchor="middle" font-size="9.5">revocation and validity check</text><line class="l" x1="518" y1="129.0" x2="574" y2="129.0" marker-end="url(#a)"/><rect class="b" x="574" y="112" width="170" height="34" rx="4"/><text x="659.0" y="133.0" text-anchor="middle" font-size="9.5" class="n">not approved</text><rect class="b" x="16" y="152" width="208" height="34" rx="4"/><text x="120.0" y="173.0" text-anchor="middle" font-size="9.5">challenge replay</text><line class="l" x1="224" y1="169.0" x2="268" y2="169.0" marker-end="url(#a)"/><rect class="b" x="268" y="152" width="250" height="34" rx="4"/><text x="393.0" y="173.0" text-anchor="middle" font-size="9.5">single-use challenge</text><line class="l" x1="518" y1="169.0" x2="574" y2="169.0" marker-end="url(#a)"/><rect class="b" x="574" y="152" width="170" height="34" rx="4"/><text x="659.0" y="173.0" text-anchor="middle" font-size="9.5" class="n">refusal</text><rect class="b" x="16" y="192" width="208" height="34" rx="4"/><text x="120.0" y="213.0" text-anchor="middle" font-size="9.5">SSRF and DNS rebinding</text><line class="l" x1="224" y1="209.0" x2="268" y2="209.0" marker-end="url(#a)"/><rect class="b" x="268" y="192" width="250" height="34" rx="4"/><text x="393.0" y="213.0" text-anchor="middle" font-size="9.5">hardened fetch</text><line class="l" x1="518" y1="209.0" x2="574" y2="209.0" marker-end="url(#a)"/><rect class="b" x="574" y="192" width="170" height="34" rx="4"/><text x="659.0" y="213.0" text-anchor="middle" font-size="9.5" class="n">block</text><rect class="d" x="16" y="234" width="728" height="26" rx="4"/><text x="380" y="251" text-anchor="middle" font-size="9.5" class="m">missing or inconsistent evidence → fail-closed</text>
</svg>
