<?xml version="1.0"?>

<svg viewBox="0 0 980 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-P104 desc-P104" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P104">Fluxo Arquitectural do BANZA — da pessoa ou do consumidor automático até à interoperação</title>
  <desc id="desc-P104">Um fluxo de arquitectura, validação e evidência, não de dinheiro. Uma pessoa trabalha através do BanzAI, a interface humana primária e opcional, que orienta e explica mas não decide; um consumidor automático acede às mesmas interfaces públicas sem passar pelo BanzAI. O operador implementa o protocolo na sua infraestrutura local e auto-publica os artefactos públicos (descoberta, manifesto, chaves, endpoints); os motores determinísticos verificam esses artefactos e produzem evidência e recibos reproduzíveis; a Certificação de Conformidade (Camada 2) certifica a partir dessa evidência; os esquemas operacionais independentes (Camada 3) podem adoptar implementações conformes. O BanzAI orienta, os motores verificam, a evidência prova e a autoridade competente decide. O BANZA não movimenta fundos.</desc>

