    <rect x="611.5" y="128" width="166" height="150" rx="12" fill="#1E1810" stroke="#B98A3E" stroke-width="1.5"/>
    <circle cx="633.5" cy="152" r="13" fill="#B98A3E"/><text x="633.5" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#26200F">4</text>
    <text x="627.5" y="192" font-size="12.5" font-weight="800" fill="#E7C67E">Evidência</text>
    <text x="627.5" y="214" font-size="10" fill="#C9C9D0">evidence bundle</text>
    <text x="627.5" y="230" font-size="10" fill="#C9C9D0">reproduzível</text>
    <text x="627.5" y="252" font-size="8.5" fill="#8C8C95">por verificação</text>
  </g>
  <!-- 5 · Receipts (teal) -->
  <g>
    <rect x="806" y="128" width="166" height="150" rx="12" fill="#0F1D1C" stroke="#0F766E" stroke-width="1.5"/>
    <circle cx="828" cy="152" r="13" fill="#0F766E"/><text x="828" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">5</text>
    <text x="822" y="192" font-size="12.5" font-weight="800" fill="#57C6BC">Receipts</text>
    <text x="822" y="214" font-size="10" fill="#C9C9D0">OperationReceipt</text>
    <text x="822" y="230" font-size="10" fill="#C9C9D0">JourneyReceipt</text>
    <text x="822" y="252" font-size="8.5" fill="#8C8C95">liga ao endpoint exacto</text>
  </g>

  <!-- arrows -->
  <line x1="194" y1="203" x2="220.5" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P096)"/>
  <line x1="388.5" y1="203" x2="415" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P096)"/>
  <line x1="583" y1="203" x2="609.5" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P096)"/>
  <line x1="777.5" y1="203" x2="804" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P096)"/>

  <!-- operational-rule band -->
  <rect x="28" y="306" width="944" height="30" rx="9" fill="#141418" stroke="#2B2B33" stroke-width="1"/>
  <text x="44" y="325" font-size="10.5" fill="#B6B6BE">o <tspan font-weight="700" fill="#74C79E">operador publica</tspan> · o <tspan font-weight="700" fill="#8FB0D0">BanzAI obtém</tspan> · o <tspan font-weight="700" fill="#E8909D">Rust verifica</tspan> · o <tspan font-weight="700" fill="#57C6BC">receipt fixa</tspan> · o Registo publica.</text>

  <!-- boundary band -->
  <rect x="28" y="346" width="944" height="86" rx="10" fill="#1B1113" stroke="#5A1A22" stroke-width="1.2"/>
  <text x="44" y="372" font-size="11.5" font-weight="700" fill="#E8909D">Sem conteúdo colado, ficheiro carregado, mock ou URL do utilizador na jornada oficial.</text>
  <text x="44" y="394" font-size="10.5" fill="#B6B6BE">Os motores continuam sem rede: recebem conteúdo já obtido pela camada segura em Rust.</text>
  <text x="44" y="414" font-size="10.5" fill="#B6B6BE">Fetches de protocolo contam como protocol_fetch_count, nunca como external_model_calls (ADR-034).</text>

  <text x="500" y="462" text-anchor="middle" font-size="9" fill="#7C7C85">SVG-P-096 · Fluxo de validação oficial · ADR-034 · v1.0 · 2026-07-30</text>
</svg>
