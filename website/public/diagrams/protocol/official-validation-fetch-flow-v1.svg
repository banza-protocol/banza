<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-096
  diagram:   Fluxo de validação oficial — Endpoints públicos → Obtenção segura (Rust, SSRF-hardened) → Motores Rust → Evidência → Receipts
  source:    ADR-034 · BANZA_REFERENCIA.md §35 (validação originada nos endpoints)
  version:   1.0
  updated:   2026-07-30
  author:    BANZA Protocol
  style:     protocol-dark
-->
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P096 desc-P096"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P096">Fluxo de validação oficial originado nos endpoints</title>
  <desc id="desc-P096">Pipeline oficial de cinco fases em que cada artefacto avaliado vem dos endpoints públicos da implementação. Os Endpoints públicos são obtidos por uma camada de Obtenção segura em Rust, endurecida contra SSRF (resolve o host a partir do registo, força HTTPS, bloqueia redes privadas e metadados de nuvem, proíbe redirecções entre hosts e limita tamanho e tempo). O conteúdo já obtido alimenta os Motores Rust, que avaliam sem rede; produz-se Evidência reproduzível e Receipts que ligam o resultado ao endpoint exacto. Regra operacional: o operador publica, o BanzAI obtém, o Rust verifica, o receipt fixa e o Registo publica. Os fetches de protocolo contam como protocol_fetch_count, nunca como external_model_calls. ADR-034.</desc>
  <defs>
    <linearGradient id="hg-P096" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P096" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8C8C95"/>
    </marker>
  </defs>

  <rect width="1000" height="480" fill="#0E0E11"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#hg-P096)" rx="14"/>
  <rect x="0" y="48" width="1000" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-096 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="#FFFFFF">Fluxo de validação oficial</text>
  <text x="976" y="50" text-anchor="end" font-size="11" fill="#F6D9DD">obtido dos endpoints · verificado em Rust</text>

  <text x="24" y="94" font-size="11.5" fill="#B6B6BE">Todo o artefacto oficial vem dos endpoints públicos da implementação, por obtenção segura em Rust.</text>

  <!-- ======================= flow cards ======================= -->
