  <g>
    <rect x="28" y="128" width="166" height="150" rx="12" fill="#13211A" stroke="#2E6A4E" stroke-width="1.5"/>
    <circle cx="50" cy="152" r="13" fill="#2E6A4E"/><text x="50" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">1</text>
    <text x="44" y="192" font-size="12" font-weight="800" fill="#74C79E">Endpoints públicos</text>
    <text x="44" y="214" font-size="10" fill="#C9C9D0">da implementação</text>
    <text x="44" y="234" font-size="9" font-family="ui-monospace,'Courier New',monospace" fill="#8C8C95">discovery · manifest</text>
    <text x="44" y="250" font-size="9" font-family="ui-monospace,'Courier New',monospace" fill="#8C8C95">keys · capabilities</text>
  </g>
  <!-- 2 · Obtenção segura (wine · highlight) -->
  <g>
    <rect x="222.5" y="128" width="166" height="150" rx="12" fill="#1B1113" stroke="#8E1326" stroke-width="2"/>
    <circle cx="244.5" cy="152" r="13" fill="#8E1326"/><text x="244.5" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">2</text>
    <text x="388.5" y="146" text-anchor="end" font-size="8.5" font-weight="700" fill="#E8909D" letter-spacing="1">SSRF-HARDENED</text>
    <text x="238.5" y="192" font-size="12" font-weight="800" fill="#E8909D">Obtenção segura</text>
    <text x="238.5" y="214" font-size="10" fill="#C9C9D0">Rust · resolve o host</text>
    <text x="238.5" y="230" font-size="10" fill="#C9C9D0">HTTPS · sem rede privada</text>
    <text x="238.5" y="252" font-size="8.5" fill="#8C8C95">tamanho e tempo limitados</text>
  </g>
  <!-- 3 · Motores Rust (wine) -->
  <g>
    <rect x="417" y="128" width="166" height="150" rx="12" fill="#17171B" stroke="#8E1326" stroke-width="1.5"/>
    <circle cx="439" cy="152" r="13" fill="#8E1326"/><text x="439" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">3</text>
