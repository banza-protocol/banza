<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-111
  diagram:   Fronteiras de autoridade da governança do BANZA
  version:   1.0
  source:    BANZA_REFERENCIA.md §11 (Governança — O que permanece fora da sua autoridade)
  updated:   2026-08-10
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P111 desc-P111"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P111">Fronteiras de autoridade da governança do BANZA</title>
  <desc id="desc-P111">A governança do protocolo decide regras — versões, contratos, invariantes, perfis e critérios de conformidade — por processo público. Fora da sua autoridade ficam, cada um com o seu dono: o veredicto de conformidade de uma implementação (motor determinístico da Camada 2), a admissão a um esquema (Camada 3, independente), a autorização regulatória (autoridades competentes, fora do protocolo) e a relação comercial e a participação de um operador (o próprio operador). A Raiz de Confiança não está no topo desta cadeia — é uma âncora criptográfica que assina apenas o Manifesto de Chaves, não um órgão de governo. A governança mantém e evolui as regras; não certifica, não admite, não autoriza e não regula operadores.</desc>
  <defs>
    <linearGradient id="hg-P111" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <filter id="sh-P111" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#F4F1EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="64" fill="url(#hg-P111)" rx="14"/>
  <rect x="0" y="48" width="900" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-111 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="white">Fronteiras de autoridade da governança</text>
  <text x="876" y="50" text-anchor="end" font-size="11" fill="#FECACA">mantém as regras; não administra os operadores</text>

  <!-- LEFT: a governança decide as regras -->
  <rect x="24" y="86" width="392" height="302" rx="10" fill="#8E1326"/>
  <text x="44" y="118" font-size="15" font-weight="800" fill="white">A governança decide as REGRAS</text>
  <text x="44" y="140" font-size="10.5" fill="#FBD7DC">Por processo público — nunca casos individuais.</text>

  <rect x="44" y="158" width="352" height="42" rx="7" fill="#6E0F1A"/>
  <text x="60" y="177" font-size="11.5" font-weight="700" fill="white">Versões do protocolo</text>
  <text x="60" y="193" font-size="9.5" fill="#FBD7DC">maior · menor · correcção (versionamento semântico)</text>

  <rect x="44" y="208" width="352" height="42" rx="7" fill="#6E0F1A"/>
  <text x="60" y="227" font-size="11.5" font-weight="700" fill="white">Contratos, schemas e invariantes</text>
  <text x="60" y="243" font-size="9.5" fill="#FBD7DC">o núcleo normativo, público e versionado</text>

  <rect x="44" y="258" width="352" height="42" rx="7" fill="#6E0F1A"/>
  <text x="60" y="277" font-size="11.5" font-weight="700" fill="white">Perfis e critérios de conformidade</text>
  <text x="60" y="293" font-size="9.5" fill="#FBD7DC">define o alvo — não produz o veredicto</text>

  <rect x="44" y="308" width="352" height="42" rx="7" fill="#6E0F1A"/>
  <text x="60" y="327" font-size="11.5" font-weight="700" fill="white">Vectores de conformidade</text>
  <text x="60" y="343" font-size="9.5" fill="#FBD7DC">as provas reproduzíveis contra o perfil</text>

  <text x="44" y="372" font-size="10" fill="#FECACA">Os humanos governam as regras; os motores aplicam-nas.</text>

  <!-- DIVIDER -->
  <line x1="428" y1="92" x2="428" y2="382" stroke="#C9A9AD" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="428" y="398" text-anchor="middle" font-size="9" font-weight="700" fill="#8E1326" letter-spacing="1">A AUTORIDADE DA GOVERNANÇA TERMINA AQUI</text>

  <!-- RIGHT: fora da sua autoridade -->
  <text x="448" y="106" font-size="12.5" font-weight="800" fill="#3A1014">Fora da sua autoridade — cada um com o seu dono</text>

  <!-- card a -->
  <rect x="448" y="116" width="428" height="60" rx="8" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="466" y="140" font-size="11.5" font-weight="700" fill="#3A1014">Veredicto de conformidade de uma implementação</text>
  <text x="466" y="160" font-size="10" fill="#6B6265">decidido por</text>
  <text x="536" y="160" font-size="10" font-weight="700" fill="#8E1326">motor determinístico · Camada 2 (reproduzível)</text>

  <!-- card b -->
  <rect x="448" y="184" width="428" height="60" rx="8" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="466" y="208" font-size="11.5" font-weight="700" fill="#3A1014">Admissão a um esquema</text>
  <text x="466" y="228" font-size="10" fill="#6B6265">decidido por</text>
  <text x="536" y="228" font-size="10" font-weight="700" fill="#8E1326">o esquema · Camada 3 (institucionalmente independente)</text>

  <!-- card c -->
  <rect x="448" y="252" width="428" height="60" rx="8" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="466" y="276" font-size="11.5" font-weight="700" fill="#3A1014">Autorização regulatória</text>
  <text x="466" y="296" font-size="10" fill="#6B6265">decidido por</text>
  <text x="536" y="296" font-size="10" font-weight="700" fill="#8E1326">autoridades competentes (fora do protocolo)</text>

  <!-- card d -->
  <rect x="448" y="320" width="428" height="60" rx="8" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="466" y="344" font-size="11.5" font-weight="700" fill="#3A1014">Relação comercial e participação</text>
  <text x="466" y="364" font-size="10" fill="#6B6265">decidido por</text>
  <text x="536" y="364" font-size="10" font-weight="700" fill="#8E1326">o próprio operador</text>

  <!-- Trust Root note -->
  <rect x="24" y="404" width="852" height="52" rx="9" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="42" y="426" font-size="11" font-weight="700" fill="#8E1326">A Raiz de Confiança não está no topo desta cadeia.</text>
  <text x="42" y="446" font-size="10" fill="#6B6265">É uma âncora criptográfica que assina apenas o Manifesto de Chaves — não um órgão de governo. Decidir uma regra é diferente de a assinar.</text>

  <!-- Boundary band -->
  <rect x="24" y="470" width="852" height="40" rx="9" fill="#3A1014"/>
  <text x="450" y="495" text-anchor="middle" font-size="11" font-weight="700" fill="#FBD7DC">A governança mantém e evolui as regras; não certifica, não admite, não autoriza e não regula operadores.</text>

  <text x="450" y="540" text-anchor="middle" font-size="9" fill="#9CA3AF">SVG-P-111 · Fronteiras de autoridade da governança · BANZA_REFERENCIA.md §11 · v1.0 · 2026-08-10</text>
</svg>
