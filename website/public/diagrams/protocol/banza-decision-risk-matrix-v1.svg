<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-052
  diagram:   Decisão → risco mitigado — racional técnico do protocolo BANZA
  version:   1.1
  source:    BANZA_REFERENCIA.md §2 (Racional Estratégico — Cada Decisão Responde a um Risco)
  updated:   2026-07-19
  changes:   v1.1 — BanzAI reframed to native protocol agent (ADR-041), no longer "adjacent"
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P052 desc-P052"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P052">Decisão → risco mitigado no Protocolo BANZA</title>
  <desc id="desc-P052">Sete decisões estruturantes do protocolo BANZA e o risco que cada uma mitiga: os contratos primeiro mitigam o desvio entre especificação e implementação; rotas públicas em formato máquina mitigam o estado declarado por marketing; PASS diferente de certificado mitiga claims prematuros de certificação; a separação protocolo/operador mitiga lock-in e captura; a chave raiz offline mitiga o comprometimento da raiz de confiança; a revogação pública assinada (BRL) mitiga o operador comprometido que permanece confiável; o BanzAI, agente nativo e não normativo, mitiga a decisão de conformidade por inferência de IA em vez de testes. As decisões reduzem riscos, não os eliminam.</desc>
  <defs>
    <linearGradient id="hg-P052" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P052" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8E1326"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#F4F1EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="64" fill="url(#hg-P052)" rx="14"/>
  <rect x="0" y="48" width="900" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-052 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="white">Decisão → risco mitigado</text>
  <text x="876" y="50" text-anchor="end" font-size="11" fill="#FECACA">Racional técnico do protocolo</text>

  <!-- column headers -->
  <text x="40" y="86" font-family="ui-monospace,'Courier New',monospace" font-size="10" font-weight="700" fill="#8E1326" letter-spacing="1">DECISÃO</text>
  <text x="486" y="86" font-family="ui-monospace,'Courier New',monospace" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="1">RISCO MITIGADO</text>

  <!-- rows -->
  <!-- 1 -->
  <rect x="24" y="94" width="392" height="54" rx="9" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="40" y="118" font-size="12.5" font-weight="700" fill="#3A1014">Contratos primeiro (§3)</text>
  <text x="40" y="136" font-size="10" fill="#6B6265">nenhuma regra existe só em prosa</text>
  <line x1="418" y1="121" x2="466" y2="121" stroke="#8E1326" stroke-width="1.5" marker-end="url(#arr-P052)"/>
  <rect x="470" y="94" width="406" height="54" rx="9" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="486" y="126" font-size="11" fill="#4B3A3C">Desvio entre especificação e implementação</text>

  <!-- 2 -->
  <rect x="24" y="156" width="392" height="54" rx="9" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="40" y="180" font-size="12.5" font-weight="700" fill="#3A1014">Rotas públicas em formato máquina (§4, §5)</text>
  <text x="40" y="198" font-size="10" fill="#6B6265">estado verificável, não declarado</text>
  <line x1="418" y1="183" x2="466" y2="183" stroke="#8E1326" stroke-width="1.5" marker-end="url(#arr-P052)"/>
  <rect x="470" y="156" width="406" height="54" rx="9" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="486" y="188" font-size="11" fill="#4B3A3C">Estado declarado por marketing em vez de verificado</text>

  <!-- 3 -->
  <rect x="24" y="218" width="392" height="54" rx="9" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="40" y="242" font-size="12.5" font-weight="700" fill="#3A1014">PASS ≠ certificado (§5, §6)</text>
  <text x="40" y="260" font-size="10" fill="#6B6265">evidência técnica ≠ selo institucional</text>
  <line x1="418" y1="245" x2="466" y2="245" stroke="#8E1326" stroke-width="1.5" marker-end="url(#arr-P052)"/>
  <rect x="470" y="218" width="406" height="54" rx="9" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="486" y="250" font-size="11" fill="#4B3A3C">Claims prematuros de estatuto oficial</text>

  <!-- 4 -->
  <rect x="24" y="280" width="392" height="54" rx="9" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="40" y="304" font-size="12.5" font-weight="700" fill="#3A1014">Separação protocolo / operador (§1, §8)</text>
  <text x="40" y="322" font-size="10" fill="#6B6265">regras separadas da operação</text>
  <line x1="418" y1="307" x2="466" y2="307" stroke="#8E1326" stroke-width="1.5" marker-end="url(#arr-P052)"/>
  <rect x="470" y="280" width="406" height="54" rx="9" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="486" y="306" font-size="11" fill="#4B3A3C">Lock-in e captura do protocolo; confusão de</text>
  <text x="486" y="322" font-size="11" fill="#4B3A3C">responsabilidade legal</text>

  <!-- 5 -->
  <rect x="24" y="342" width="392" height="54" rx="9" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="40" y="366" font-size="12.5" font-weight="700" fill="#3A1014">Chave raiz offline (§5)</text>
  <text x="40" y="384" font-size="10" fill="#6B6265">nunca em sistemas ligados à rede</text>
  <line x1="418" y1="369" x2="466" y2="369" stroke="#8E1326" stroke-width="1.5" marker-end="url(#arr-P052)"/>
  <rect x="470" y="342" width="406" height="54" rx="9" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="486" y="374" font-size="11" fill="#4B3A3C">Comprometimento da raiz da cadeia de confiança</text>

  <!-- 6 -->
  <rect x="24" y="404" width="392" height="54" rx="9" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="40" y="428" font-size="12.5" font-weight="700" fill="#3A1014">Revogação pública assinada — BRL (§5)</text>
  <text x="40" y="446" font-size="10" fill="#6B6265">confiança verificável, não par a par</text>
  <line x1="418" y1="431" x2="466" y2="431" stroke="#8E1326" stroke-width="1.5" marker-end="url(#arr-P052)"/>
  <rect x="470" y="404" width="406" height="54" rx="9" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="486" y="436" font-size="11" fill="#4B3A3C">Operador comprometido que permanece confiável</text>

  <!-- 7 -->
  <rect x="24" y="466" width="392" height="54" rx="9" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="40" y="490" font-size="12.5" font-weight="700" fill="#3A1014">BanzAI agente nativo, não normativo (§10)</text>
  <text x="40" y="508" font-size="10" fill="#6B6265">explica, nunca decide conformidade</text>
  <line x1="418" y1="493" x2="466" y2="493" stroke="#8E1326" stroke-width="1.5" marker-end="url(#arr-P052)"/>
  <rect x="470" y="466" width="406" height="54" rx="9" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="486" y="492" font-size="11" fill="#4B3A3C">Conformidade decidida por inferência de IA</text>
  <text x="486" y="508" font-size="11" fill="#4B3A3C">em vez de testes determinísticos</text>

  <text x="450" y="534" text-anchor="middle" font-size="9" fill="#9CA3AF">SVG-P-052 · Decisão → risco mitigado · BANZA_REFERENCIA.md §2 · v1.1 · 2026-07-19</text>
</svg>
