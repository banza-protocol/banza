<?xml version="1.0"?>

<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-P029 desc-P029" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P029">Fluxo de conformidade BANZA — da implementação à evidência publicada</title>
  <desc id="desc-P029">Seis etapas do fluxo de conformidade BANZA: o operador prepara o manifesto, executa o conjunto de testes de conformidade, produz evidência reproduzível, publica-a com metadata de protocolo assinada, e cada par avalia esse material localmente pela Open Trust Evaluation. Nada é submetido a revisão humana e nada é emitido ao operador — a conformidade é medida, não concedida. Os âmbitos L0–L4 são o scope da conformidade, não níveis de certificação.</desc>
  <defs>
    <linearGradient id="hG-P029" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E0F1A"></stop><stop offset="100%" stop-color="#8E1326"></stop>
    </linearGradient>
    <linearGradient id="blueG-P029" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C4654"></stop><stop offset="100%" stop-color="#566273"></stop>
    </linearGradient>
    <linearGradient id="tealG-P029" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#155E63"></stop><stop offset="100%" stop-color="#1C7F86"></stop>
    </linearGradient>
    <linearGradient id="greenG-P029" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532D"></stop><stop offset="100%" stop-color="#15803D"></stop>
    </linearGradient>
    <filter id="sh-P029" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"></feDropShadow>
    </filter>
    <marker id="arr-P029" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"></polygon>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#F4F1EA"></rect>

  <rect x="16" y="12" width="868" height="54" rx="8" fill="url(#hG-P029)" filter="url(#sh-P029)"></rect>
  <text x="34" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.6" fill="#FECACA">SVG-P-029 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="34" y="52" fill="white" font-size="15" font-weight="800">Fluxo de conformidade BANZA</text>
  <text x="866" y="52" text-anchor="end" fill="#F6D9DD" font-size="10">a conformidade é medida, não concedida</text>


  <rect x="22" y="84" width="128" height="196" rx="8" fill="white" stroke="#CDD3DA" stroke-width="1.5" filter="url(#sh-P029)"></rect>
  <rect x="22" y="84" width="128" height="44" rx="8" fill="url(#blueG-P029)"></rect>
  <rect x="22" y="110" width="128" height="18" fill="url(#blueG-P029)"></rect>
  <text x="86" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-weight="600" letter-spacing="0.5">ETAPA 1</text>
  <text x="86" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="700">Operador</text>
  <text x="86" y="148" text-anchor="middle" fill="#6B6265" font-size="9">Uma entidade decide</text>
  <text x="86" y="161" text-anchor="middle" fill="#6B6265" font-size="9">implementar o BANZA</text>
  <text x="86" y="174" text-anchor="middle" fill="#6B6265" font-size="9">e demonstrar um</text>
  <text x="86" y="187" text-anchor="middle" fill="#6B6265" font-size="9">âmbito de conformidade</text>
  <text x="86" y="200" text-anchor="middle" fill="#6B6265" font-size="9">(âmbitos L0–L4)</text>
  <rect x="38" y="252" width="96" height="20" rx="10" fill="#EEF0F2" stroke="#CDD3DA" stroke-width="1"></rect>
  <text x="86" y="266" text-anchor="middle" fill="#566273" font-size="9" font-weight="700">Decide implementar</text>
  <line x1="154" y1="184" x2="166" y2="184" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-P029)"></line>


  <rect x="166" y="84" width="128" height="196" rx="8" fill="white" stroke="#CDD3DA" stroke-width="1.5" filter="url(#sh-P029)"></rect>
  <rect x="166" y="84" width="128" height="44" rx="8" fill="url(#blueG-P029)"></rect>
  <rect x="166" y="110" width="128" height="18" fill="url(#blueG-P029)"></rect>
  <text x="230" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-weight="600" letter-spacing="0.5">ETAPA 2</text>
  <text x="230" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="700">Manifesto</text>
  <text x="230" y="148" text-anchor="middle" fill="#6B6265" font-size="9">Cria o Manifesto de</text>
  <text x="230" y="161" text-anchor="middle" fill="#6B6265" font-size="9">Operador declarando</text>
  <text x="230" y="174" text-anchor="middle" fill="#6B6265" font-size="9">capacidades e âmbito.</text>
  <text x="230" y="187" text-anchor="middle" fill="#6B6265" font-size="9">Publica em</text>
  <text x="230" y="200" text-anchor="middle" fill="#6B6265" font-size="9">/.well-known/banza/</text>
  <rect x="182" y="252" width="96" height="20" rx="10" fill="#EEF0F2" stroke="#CDD3DA" stroke-width="1"></rect>
  <text x="230" y="266" text-anchor="middle" fill="#566273" font-size="9" font-weight="700">Declara capacidades</text>
  <line x1="298" y1="184" x2="310" y2="184" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-P029)"></line>


  <rect x="310" y="84" width="128" height="196" rx="8" fill="white" stroke="#CDD3DA" stroke-width="1.5" filter="url(#sh-P029)"></rect>
  <rect x="310" y="84" width="128" height="44" rx="8" fill="url(#blueG-P029)"></rect>
  <rect x="310" y="110" width="128" height="18" fill="url(#blueG-P029)"></rect>
  <text x="374" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-weight="600" letter-spacing="0.5">ETAPA 3</text>
  <text x="374" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="700">Conformidade</text>
  <text x="374" y="148" text-anchor="middle" fill="#6B6265" font-size="9">Executa o conjunto de</text>
  <text x="374" y="161" text-anchor="middle" fill="#6B6265" font-size="9">testes de conformidade</text>
  <text x="374" y="174" text-anchor="middle" fill="#6B6265" font-size="9">para o âmbito alvo.</text>
  <text x="374" y="187" text-anchor="middle" fill="#6B6265" font-size="9">Todos os testes têm</text>
  <text x="374" y="200" text-anchor="middle" fill="#6B6265" font-size="9">de passar.</text>
  <rect x="326" y="252" width="96" height="20" rx="10" fill="#EEF0F2" stroke="#CDD3DA" stroke-width="1"></rect>
  <text x="374" y="266" text-anchor="middle" fill="#566273" font-size="9" font-weight="700">Executa e passa</text>
  <line x1="442" y1="184" x2="454" y2="184" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-P029)"></line>


  <rect x="454" y="84" width="128" height="196" rx="8" fill="white" stroke="#B8E0E3" stroke-width="1.5" filter="url(#sh-P029)"></rect>
  <rect x="454" y="84" width="128" height="44" rx="8" fill="url(#tealG-P029)"></rect>
  <rect x="454" y="110" width="128" height="18" fill="url(#tealG-P029)"></rect>
  <text x="518" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-weight="600" letter-spacing="0.5">ETAPA 4</text>
  <text x="518" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="700">Evidência</text>
  <text x="518" y="148" text-anchor="middle" fill="#6B6265" font-size="9">Evidência de</text>
  <text x="518" y="161" text-anchor="middle" fill="#6B6265" font-size="9">conformidade</text>
  <text x="518" y="174" text-anchor="middle" fill="#6B6265" font-size="9">reproduzível por</text>
  <text x="518" y="187" text-anchor="middle" fill="#6B6265" font-size="9">qualquer parte.</text>
  <text x="518" y="200" text-anchor="middle" fill="#6B6265" font-size="9">Hashes recalculáveis.</text>
  <rect x="470" y="252" width="96" height="20" rx="10" fill="#E6F5F6" stroke="#B8E0E3" stroke-width="1"></rect>
  <text x="518" y="266" text-anchor="middle" fill="#1C7F86" font-size="9" font-weight="700">Produz evidência</text>
  <line x1="586" y1="184" x2="598" y2="184" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-P029)"></line>


  <rect x="598" y="84" width="128" height="196" rx="8" fill="white" stroke="#B8E0E3" stroke-width="1.5" filter="url(#sh-P029)"></rect>
  <rect x="598" y="84" width="128" height="44" rx="8" fill="url(#tealG-P029)"></rect>
  <rect x="598" y="110" width="128" height="18" fill="url(#tealG-P029)"></rect>
  <text x="662" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-weight="600" letter-spacing="0.5">ETAPA 5</text>
  <text x="662" y="118" text-anchor="middle" fill="white" font-size="12" font-weight="700">Metadata assinada</text>
  <text x="662" y="148" text-anchor="middle" fill="#6B6265" font-size="9">Signed protocol</text>
  <text x="662" y="161" text-anchor="middle" fill="#6B6265" font-size="9">metadata, assinada por</text>
  <text x="662" y="174" text-anchor="middle" fill="#6B6265" font-size="9">chave delegada ancorada</text>
  <text x="662" y="187" text-anchor="middle" fill="#6B6265" font-size="9">no Manifesto de Chaves.</text>
  <text x="662" y="200" text-anchor="middle" fill="#6B6265" font-size="9">Auto-publicada.</text>
  <rect x="614" y="252" width="96" height="20" rx="10" fill="#E6F5F6" stroke="#B8E0E3" stroke-width="1"></rect>
  <text x="662" y="266" text-anchor="middle" fill="#1C7F86" font-size="9" font-weight="700">Publica e assina</text>
  <line x1="730" y1="184" x2="742" y2="184" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-P029)"></line>


  <rect x="742" y="84" width="142" height="196" rx="8" fill="white" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh-P029)"></rect>
  <rect x="742" y="84" width="142" height="44" rx="8" fill="url(#greenG-P029)"></rect>
  <rect x="742" y="110" width="142" height="18" fill="url(#greenG-P029)"></rect>
  <text x="813" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-weight="600" letter-spacing="0.5">AVALIAÇÃO</text>
  <text x="813" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="700">Avaliação local</text>
  <text x="813" y="148" text-anchor="middle" fill="#6B6265" font-size="9">Cada par corre a</text>
  <text x="813" y="161" text-anchor="middle" fill="#6B6265" font-size="9">Open Trust Evaluation</text>
  <text x="813" y="174" text-anchor="middle" fill="#6B6265" font-size="9">sobre o material</text>
  <text x="813" y="187" text-anchor="middle" fill="#6B6265" font-size="9">publicado. Decisão</text>
  <text x="813" y="200" text-anchor="middle" fill="#6B6265" font-size="9">local por interacção.</text>
  <rect x="758" y="252" width="110" height="20" rx="10" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"></rect>
  <text x="813" y="266" text-anchor="middle" fill="#15803D" font-size="8" font-weight="700">ALLOWED / FAIL-CLOSED</text>


  <rect x="16" y="298" width="868" height="52" rx="6" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"></rect>
  <rect x="28" y="310" width="14" height="14" rx="3" fill="url(#blueG-P029)"></rect>
  <text x="48" y="321" fill="#1A1A1A" font-size="10" font-weight="600">Operador</text>
  <text x="110" y="321" fill="#6B6265" font-size="10">— prepara manifesto, implementa capacidades, corre o conjunto de testes e auto-publica a evidência</text>
  <rect x="28" y="330" width="14" height="14" rx="3" fill="url(#greenG-P029)"></rect>
  <text x="48" y="341" fill="#1A1A1A" font-size="10" font-weight="600">Par</text>
  <text x="78" y="341" fill="#6B6265" font-size="10">— corre a Open Trust Evaluation localmente; a chave delegada assina a metadata, mas nenhuma autoridade concede participação</text>
  <rect x="16" y="360" width="868" height="30" rx="6" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"></rect>
  <text x="28" y="379" fill="#7E1320" font-size="10" font-weight="700">PRÉ-PRODUÇÃO</text>
  <text x="150" y="379" fill="#6B6265" font-size="10">A auto-publicação de produção e a federação dependem da cerimónia da raiz. Hoje /operators = [] e production_certificates = false.</text>
  <text x="450" y="432" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-029 · v2.0 · BANZA_REFERENCIA.md §7 · ADR-039/ADR-040 · 2026-07-17</text>
</svg>
