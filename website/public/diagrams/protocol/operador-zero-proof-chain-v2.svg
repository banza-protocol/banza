<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-091
  diagram:   Cadeia de prova do Operador Zero — manifest hash → metadata hash → relatórios → evidence hash → certification record → registry verification
  version:   2.0
  source:    BANZA_REFERENCIA.md §9 (Operador Zero — cadeia de prova verificável, F)
  updated:   2026-07-29
  author:    BANZA Protocol
  style:     protocol-dark
-->
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P091 desc-P091"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P091">Cadeia de prova verificável do Operador Zero</title>
  <desc id="desc-P091">Uma cadeia de seis elos em que cada elo encadeia o anterior por hash de conteúdo. Manifest Hash sobre o manifesto, Metadata Hash sobre a metadata de protocolo assinada, Relatórios com o resultado por verificação, Evidence Hash sobre o evidence bundle, Certification Record como registo assinado que não é um certificado emitido, e Registry Verification em que qualquer par re-verifica sozinho. O encadeamento por hash torna a prova reproduzível e verificável por qualquer pessoa. Nenhuma autoridade central emite certificado; o Registo apenas indexa e publica.</desc>
  <defs>
    <linearGradient id="hg-P091" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P091" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8C8C95"/>
    </marker>
  </defs>

  <rect width="1000" height="480" fill="#0E0E11"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#hg-P091)" rx="14"/>
  <rect x="0" y="48" width="1000" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-091 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="#FFFFFF">Cadeia de prova verificável</text>
  <text x="976" y="50" text-anchor="end" font-size="11" fill="#F6D9DD">cada elo encadeia o anterior por hash</text>

  <text x="24" y="94" font-size="11.5" fill="#B6B6BE">A prova é reproduzível: qualquer pessoa re-verifica a cadeia sozinha, sem autoridade central.</text>

  <!-- ======================= proof-chain nodes ======================= -->
  <!-- 1 · Manifest Hash (teal) -->
  <g>
    <rect x="28" y="128" width="132" height="150" rx="12" fill="#0F1D1C" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="42" y="144" width="26" height="20" rx="6" fill="#0F766E"/><text x="55" y="159" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">#</text>
    <text x="44" y="196" font-size="12" font-weight="800" fill="#57C6BC">Manifest Hash</text>
    <text x="44" y="222" font-size="9.5" font-family="ui-monospace,'Courier New',monospace" fill="#B6B6BE">sha-256</text>
    <text x="44" y="240" font-size="9.5" font-family="ui-monospace,'Courier New',monospace" fill="#8C8C95">(operator.json)</text>
  </g>
  <!-- 2 · Metadata Hash (teal) -->
  <g>
    <rect x="190.4" y="128" width="132" height="150" rx="12" fill="#0F1D1C" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="204.4" y="144" width="26" height="20" rx="6" fill="#0F766E"/><text x="217.4" y="159" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">#</text>
    <text x="206.4" y="196" font-size="12" font-weight="800" fill="#57C6BC">Metadata Hash</text>
    <text x="206.4" y="222" font-size="9.5" font-family="ui-monospace,'Courier New',monospace" fill="#B6B6BE">sha-256</text>
    <text x="206.4" y="240" font-size="9.5" font-family="ui-monospace,'Courier New',monospace" fill="#8C8C95">(signed metadata)</text>
  </g>
  <!-- 3 · Relatórios (steel) -->
  <g>
    <rect x="352.8" y="128" width="132" height="150" rx="12" fill="#17171B" stroke="#4C5563" stroke-width="1.5"/>
    <rect x="366.8" y="144" width="26" height="20" rx="6" fill="#4C5563"/><text x="379.8" y="159" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">≡</text>
    <text x="368.8" y="196" font-size="12" font-weight="800" fill="#A2ABB8">Relatórios</text>
    <text x="368.8" y="222" font-size="10" fill="#B6B6BE">resultado por</text>
    <text x="368.8" y="240" font-size="10" fill="#B6B6BE">verificação</text>
  </g>
  <!-- 4 · Evidence Hash (gold) -->
  <g>
    <rect x="515.2" y="128" width="132" height="150" rx="12" fill="#1E1810" stroke="#B98A3E" stroke-width="1.5"/>
    <rect x="529.2" y="144" width="26" height="20" rx="6" fill="#B98A3E"/><text x="542.2" y="159" text-anchor="middle" font-size="13" font-weight="800" fill="#26200F">#</text>
    <text x="531.2" y="196" font-size="12" font-weight="800" fill="#E7C67E">Evidence Hash</text>
    <text x="531.2" y="222" font-size="9.5" font-family="ui-monospace,'Courier New',monospace" fill="#B6B6BE">sha-256</text>
    <text x="531.2" y="240" font-size="9.5" font-family="ui-monospace,'Courier New',monospace" fill="#8C8C95">(evidence bundle)</text>
  </g>
  <!-- 5 · Certification Record (wine) -->
  <g>
    <rect x="677.6" y="128" width="132" height="150" rx="12" fill="#1B1113" stroke="#8E1326" stroke-width="1.5"/>
    <rect x="691.6" y="144" width="26" height="20" rx="6" fill="#8E1326"/><text x="704.6" y="159" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">✎</text>
    <text x="693.6" y="192" font-size="12" font-weight="800" fill="#E8909D">Certification</text>
    <text x="693.6" y="208" font-size="12" font-weight="800" fill="#E8909D">Record</text>
    <text x="693.6" y="232" font-size="10" fill="#B6B6BE">registo assinado</text>
    <text x="693.6" y="250" font-size="9.5" fill="#8C8C95">não é um certificado</text>
  </g>
  <!-- 6 · Registry Verification (teal) -->
  <g>
    <rect x="840" y="128" width="132" height="150" rx="12" fill="#0F1D1C" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="854" y="144" width="26" height="20" rx="6" fill="#0F766E"/><text x="867" y="159" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">✓</text>
    <text x="856" y="192" font-size="12" font-weight="800" fill="#57C6BC">Registry</text>
    <text x="856" y="208" font-size="12" font-weight="800" fill="#57C6BC">Verification</text>
    <text x="856" y="232" font-size="10" fill="#B6B6BE">qualquer par</text>
    <text x="856" y="250" font-size="10" fill="#B6B6BE">re-verifica sozinho</text>
  </g>

  <!-- chain arrows -->
  <line x1="160" y1="203" x2="188" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P091)"/>
  <line x1="322.4" y1="203" x2="350.4" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P091)"/>
  <line x1="484.8" y1="203" x2="512.8" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P091)"/>
  <line x1="647.2" y1="203" x2="675.2" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P091)"/>
  <line x1="809.6" y1="203" x2="837.6" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P091)"/>

  <!-- chain principle band -->
  <rect x="28" y="306" width="944" height="30" rx="9" fill="#141418" stroke="#2B2B33" stroke-width="1"/>
  <text x="44" y="325" font-size="10.5" fill="#B6B6BE"><tspan font-weight="700" fill="#57C6BC">hash</tspan> encadeia <tspan font-weight="700" fill="#57C6BC">hash</tspan> — a integridade de cada elo depende do anterior; alterar um elo quebra a cadeia.</text>

  <!-- boundary band -->
  <rect x="28" y="346" width="944" height="86" rx="10" fill="#1B1113" stroke="#5A1A22" stroke-width="1.2"/>
  <text x="44" y="372" font-size="11.5" font-weight="700" fill="#E8909D">O encadeamento por hash torna a prova reproduzível.</text>
  <text x="44" y="394" font-size="10.5" fill="#B6B6BE">Nenhuma autoridade central emite certificado; o Registo apenas indexa e publica.</text>
  <text x="44" y="414" font-size="10.5" fill="#B6B6BE">Sem autoridade central · sem credencial concedida · qualquer pessoa re-verifica a cadeia de forma independente.</text>

  <text x="500" y="462" text-anchor="middle" font-size="9" fill="#7C7C85">SVG-P-091 · Cadeia de prova do Operador Zero · BANZA_REFERENCIA.md §9 · v2.0 · 2026-07-29</text>
</svg>
