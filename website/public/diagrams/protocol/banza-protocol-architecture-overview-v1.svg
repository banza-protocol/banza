  diagram:   Arquitectura institucional do BANZA — três camadas (Camada 1 Protocolo aberto · Camada 2 Certificação de Conformidade e Interoperabilidade · Camada 3 Esquemas operacionais) com o BanzAI transversal
  version:   2.2
  source:    BANZA_REFERENCIA.md §4 (As três camadas) · ADR-004
  updated:   2026-08-08
  changes:   v2.2 — Ch04 naming normalization: institutional layers L1/L2/L3 → Camada 1/2/3 (the letter L is
             reserved for the L0–L4 conformance profiles); Camada 1 titled "Protocolo aberto"
             v2.1 — Ch04 final revision: timeless (removed operational state — v1.0/Modelo activo/pagamentos-desligados
             chips and the /operators=[] line); "interface humana única" → "primária"; engine wording generalised to
             "motores determinísticos" (no Rust/Qwen); canonical authority band; added the layers≠profiles note
             v2.0 — three-layer institutional model (ADR-004)
  author:    BANZA Protocol
  style:     protocol
