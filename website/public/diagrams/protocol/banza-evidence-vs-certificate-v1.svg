<?xml version="1.0"?>

<svg viewBox="0 0 900 414" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-P032 desc-P032" font-family="system-ui,-apple-system,sans-serif">
  <title id="title-P032">Evidência de conformidade vs autorização legal</title>
  <desc id="desc-P032">Dois planos distintos. A evidência de conformidade é gerada pela ferramenta banza-conformance, é reproduzível a partir da URL pública e verificável por qualquer parte — demonstra comportamento técnico. A autorização para prestar serviços financeiros vem do regulador competente, fora do protocolo, e pertence integralmente ao operador. Conformidade técnica não é autorização.</desc>
  <defs>
    <linearGradient id="hg-P032" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"></stop><stop offset="100%" stop-color="#8E1326"></stop>
    </linearGradient>
  </defs>

  <rect width="900" height="388" fill="#F4F1EA" rx="16"></rect>


  <rect x="0" y="0" width="900" height="64" fill="url(#hg-P032)" rx="16"></rect>
  <rect x="0" y="48" width="900" height="16" fill="#8E1326"></rect>
  <text x="36" y="28" font-family="ui-monospace,&#39;Courier New&#39;,monospace" font-size="9.5" fill="#EAD2D6" letter-spacing="2">SVG-P-032 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="36" y="50" font-size="17" font-weight="800" fill="white">Evidência de conformidade não é autorização</text>
  <text x="864" y="50" text-anchor="end" font-size="10.5" fill="#EAD2D6">Dois planos distintos</text>


  <rect x="44" y="92" width="372" height="226" fill="white" rx="12" stroke="#BBF7D0" stroke-width="1.5"></rect>
  <rect x="44" y="92" width="372" height="40" fill="#15803D" rx="12"></rect>
  <rect x="44" y="116" width="372" height="16" fill="#15803D"></rect>
  <text x="230" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="white">Evidência de conformidade</text>
  <g font-size="11" fill="#374151">
    <text x="68" y="158">• Gerada pela ferramenta banza-conformance</text>
    <text x="68" y="184">• Reproduzível por qualquer parte a partir da URL pública</text>
    <text x="68" y="210">• Mostra o âmbito atingido e os casos PASS/FAIL</text>
    <text x="68" y="236">• Auto-publicada pelo operador; ninguém a concede</text>
    <text x="68" y="262">• <tspan font-weight="700" fill="#15803D">Demonstra</tspan> comportamento técnico verificável</text>
  </g>
  <text x="230" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">Medida, não concedida</text>


  <rect x="484" y="92" width="372" height="226" fill="white" rx="12" stroke="#FCA5A5" stroke-width="1.5"></rect>
  <rect x="484" y="92" width="372" height="40" fill="#7E1320" rx="12"></rect>
  <rect x="484" y="116" width="372" height="16" fill="#7E1320"></rect>
  <text x="670" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="white">Autorização legal</text>
  <g font-size="11" fill="#374151">
    <text x="508" y="158">• Vem do regulador competente</text>
    <text x="508" y="184">• Fora do protocolo BANZA</text>
    <text x="508" y="210">• Pertence integralmente ao operador</text>
    <text x="508" y="236">• <tspan font-weight="700" fill="#8E1326">A BANZA não autoriza ninguém</tspan></text>
    <text x="508" y="262">• Enquadramento legal, regulatório e financeiro do operador</text>
  </g>
  <text x="670" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#8E1326">Autorização = decisão do regulador</text>

  <text x="450" y="356" text-anchor="middle" font-size="10.5" fill="#6B7280">A conformidade técnica não substitui obrigações legais, regulatórias, bancárias ou de KYC/KYB/AML-CFT.</text>
  <text x="450" y="405" text-anchor="middle" font-size="9" fill="#9CA3AF" font-family="ui-monospace,'Courier New',monospace">SVG-P-032 · Evidência de conformidade vs autorização legal · BANZA_REFERENCIA.md §7 · v1.1 · 2026-07-19</text>
</svg>
