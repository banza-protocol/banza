<!--
  id:        SVG-P-092
  diagram:   Emissão e ciclo de vida da certificação técnica (Camada 2) — Prontidão → Certification Engine → Certification Record → Registo Técnico, e a máquina de estados fechada (ADR-064/065/066)
  version:   1.1
  source:    BANZA_REFERENCIA.md §7 (Conformidade e Interoperabilidade — Camada 2) · ADR-064/065/066
  updated:   2026-08-08
  author:    BANZA Protocol
  style:     protocol-dark
-->
<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P092 desc-P092"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P092">Emissão e ciclo de vida da certificação técnica (Camada 2)</title>
  <desc id="desc-P092">Duas partes. Em cima, a emissão: a Prontidão (evidência de conformidade e interoperabilidade reproduzível) entra no motor de certificação determinístico (banza-conformance), que decide o veredicto e produz um Certification Record com âmbito, janela de validade e record_hash; o registo é publicado no Registo Técnico, o índice público verificável em /operators. Em baixo, a máquina de estados fechada de ADR-066: NOT_CERTIFIED é o estado base e a falha por omissão; a emissão leva a CERTIFIED; a partir de CERTIFIED o registo pode transitar para EXPIRED, SUSPENDED, SUPERSEDED ou REVOKED. Só CERTIFIED, no âmbito e na janela e com evidência reproduzível, lê como válido; todos os outros lêem como não certificado, com fecho por omissão. REVOKED é terminal e nunca reactiva. A certificação é decidida só pelos motores determinísticos e nenhuma autoridade a emite; nenhuma transição da Camada 2 propaga para admissão a esquema (Camada 3) nem para o regulador (ADR-061).</desc>
  <defs>
    <linearGradient id="hg-P092" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P092" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8C8C95"/>
    </marker>
  </defs>

  <rect width="1000" height="580" fill="#0E0E11"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#hg-P092)" rx="14"/>
  <rect x="0" y="48" width="1000" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-092 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="#FFFFFF">Emissão e ciclo de vida da certificação técnica (Camada 2)</text>
  <text x="976" y="50" text-anchor="end" font-size="11" fill="#F6D9DD">decidido em Rust · nenhuma emissão por autoridade</text>

  <text x="24" y="92" font-size="11.5" fill="#B6B6BE">Os motores determinísticos decidem o veredicto a partir da evidência; o Registo apenas indexa e publica; nenhuma autoridade a emite.</text>

  <!-- ===================== emission flow ===================== -->
  <text x="24" y="120" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#8C8C95" letter-spacing="1">EMISSÃO</text>
  <!-- 1 · Prontidão (slate) -->
  <g>
    <rect x="28" y="128" width="200" height="96" rx="12" fill="#141922" stroke="#33465B" stroke-width="1.5"/>
    <text x="48" y="158" font-size="12.5" font-weight="800" fill="#8FB0D0">Prontidão</text>
    <text x="48" y="180" font-size="10" fill="#B6B6BE">evidência de conformidade</text>
    <text x="48" y="196" font-size="10" fill="#B6B6BE">e interoperabilidade</text>
    <text x="48" y="212" font-size="9.5" fill="#8C8C95">reproduzível</text>
  </g>
  <!-- 2 · Certification Engine (wine) -->
  <g>
    <rect x="268" y="128" width="200" height="96" rx="12" fill="#1B1113" stroke="#8E1326" stroke-width="1.5"/>
    <text x="288" y="158" font-size="12.5" font-weight="800" fill="#E8909D">Certification Engine</text>
    <text x="288" y="180" font-size="10" font-family="ui-monospace,'Courier New',monospace" fill="#B6B6BE">banza-conformance (Rust)</text>
    <text x="288" y="196" font-size="10" fill="#B6B6BE">decide o veredicto</text>
    <text x="288" y="212" font-size="9.5" fill="#8C8C95">determinístico · reason_code</text>
  </g>
  <!-- 3 · Certification Record (gold) -->
  <g>
    <rect x="508" y="128" width="200" height="96" rx="12" fill="#1E1810" stroke="#B98A3E" stroke-width="1.5"/>
    <text x="528" y="158" font-size="12.5" font-weight="800" fill="#E7C67E">Certification Record</text>
    <text x="528" y="180" font-size="10" fill="#B6B6BE">veredicto · âmbito · validade</text>
    <text x="528" y="196" font-size="10" font-family="ui-monospace,'Courier New',monospace" fill="#B6B6BE">record_hash</text>
    <text x="528" y="212" font-size="9.5" fill="#8C8C95">facto técnico, não credencial</text>
  </g>
  <!-- 4 · Registo Técnico (teal) -->
  <g>
    <rect x="748" y="128" width="224" height="96" rx="12" fill="#0F1D1C" stroke="#0F766E" stroke-width="1.5"/>
    <text x="768" y="158" font-size="12.5" font-weight="800" fill="#57C6BC">Registo Técnico</text>
    <text x="768" y="180" font-size="10" fill="#B6B6BE">índice público verificável</text>
    <text x="768" y="196" font-size="10" font-family="ui-monospace,'Courier New',monospace" fill="#B6B6BE">/operators</text>
    <text x="768" y="212" font-size="9.5" fill="#8C8C95">re-verificável por pares</text>
  </g>
  <!-- emission arrows -->
  <line x1="228" y1="176" x2="266" y2="176" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P092)"/>
  <line x1="468" y1="176" x2="506" y2="176" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P092)"/>
  <line x1="708" y1="176" x2="746" y2="176" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P092)"/>

  <!-- ===================== state machine ===================== -->
  <text x="24" y="270" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#8C8C95" letter-spacing="1">MÁQUINA DE ESTADOS FECHADA · ADR-066</text>

  <!-- NOT_CERTIFIED -->
  <rect x="28" y="284" width="200" height="44" rx="10" fill="#17171B" stroke="#4C5563" stroke-width="1.5"/>
  <text x="128" y="311" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" font-weight="800" fill="#A2ABB8">NOT_CERTIFIED</text>
  <text x="128" y="344" text-anchor="middle" font-size="8.5" fill="#8C8C95">base · fecho por omissão</text>
  <!-- CERTIFIED -->
  <rect x="300" y="284" width="200" height="44" rx="10" fill="#13211A" stroke="#2E6A4E" stroke-width="2"/>
  <text x="400" y="311" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" font-weight="800" fill="#74C79E">CERTIFIED</text>
  <text x="400" y="344" text-anchor="middle" font-size="8.5" fill="#8C8C95">único estado que lê como válido</text>
  <!-- emissão arrow -->
  <line x1="228" y1="306" x2="298" y2="306" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P092)"/>
  <text x="263" y="299" text-anchor="middle" font-size="8.5" fill="#B6B6BE">emissão</text>

  <!-- outcome states -->
  <rect x="28"  y="404" width="216" height="44" rx="10" fill="#17171B" stroke="#4C5563" stroke-width="1.5"/>
  <text x="136" y="431" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" font-weight="800" fill="#A2ABB8">EXPIRED</text>
  <rect x="260" y="404" width="216" height="44" rx="10" fill="#1E1810" stroke="#B98A3E" stroke-width="1.5"/>
  <text x="368" y="431" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" font-weight="800" fill="#E7C67E">SUSPENDED</text>
  <rect x="492" y="404" width="216" height="44" rx="10" fill="#141922" stroke="#33465B" stroke-width="1.5"/>
  <text x="600" y="431" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" font-weight="800" fill="#8FB0D0">SUPERSEDED</text>
  <rect x="724" y="404" width="248" height="44" rx="10" fill="#1B1113" stroke="#8E1326" stroke-width="2"/>
  <text x="838" y="428" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" font-weight="800" fill="#E8909D">REVOKED</text>
  <text x="838" y="441" text-anchor="middle" font-size="8" fill="#C79AA0">terminal · nunca reactiva</text>

  <!-- transition arrows from CERTIFIED to outcomes -->
  <line x1="380" y1="328" x2="150" y2="402" stroke="#8C8C95" stroke-width="1.4" marker-end="url(#arr-P092)"/>
  <line x1="392" y1="328" x2="368" y2="402" stroke="#8C8C95" stroke-width="1.4" marker-end="url(#arr-P092)"/>
  <line x1="412" y1="328" x2="590" y2="402" stroke="#8C8C95" stroke-width="1.4" marker-end="url(#arr-P092)"/>
  <line x1="424" y1="328" x2="820" y2="402" stroke="#8C8C95" stroke-width="1.4" marker-end="url(#arr-P092)"/>

  <!-- boundary band -->
  <rect x="28" y="470" width="944" height="86" rx="10" fill="#1B1113" stroke="#5A1A22" stroke-width="1.2"/>
  <text x="44" y="494" font-size="10.5" fill="#B6B6BE">Só CERTIFIED, no âmbito e na janela e com evidência reproduzível, lê como válido — todos os outros lêem como não certificado (fecho por omissão).</text>
  <text x="44" y="514" font-size="10.5" fill="#B6B6BE">Decidido só pelo Rust; nenhum humano, modelo ou configuração efectua, alarga ou reverte uma transição. REVOKED é terminal e nunca reactiva.</text>
  <text x="44" y="534" font-size="10.5" font-weight="700" fill="#E8909D">Nenhuma transição da Camada 2 propaga para admissão a esquema (Camada 3) nem para o regulador (ADR-061). Nenhuma autoridade a emite.</text>

  <text x="500" y="572" text-anchor="middle" font-size="9" fill="#7C7C85">SVG-P-092 · Emissão e ciclo de vida da certificação técnica (Camada 2) · BANZA_REFERENCIA.md §7 · v1.1 · 2026-08-08</text>
</svg>
