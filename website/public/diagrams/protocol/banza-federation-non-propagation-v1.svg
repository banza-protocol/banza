<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-110
  diagram:   Relações de federação independentes — não simétricas, não transitivas, e sem propagação de autoridade
  version:   1.0
  source:    BANZA_REFERENCIA.md §10 (Federação — Relações independentes; O que a federação não cria) · ADR-061 · ADR-079
  updated:   2026-08-09
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P110 desc-P110"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P110">Relações de federação independentes e a não-propagação de autoridade</title>
  <desc id="desc-P110">Cada relação de federação é avaliada por si, par a par. Entre o Operador A e o Operador B, e entre o Operador B e o Operador C (exemplos), existem duas relações independentes: de A com B e de B com C não decorre uma relação entre A e C — a federação não é transitiva. Cada lado avalia e decide por si; o Operador A considerar o Operador B encaminhável não implica que o Operador B considere o Operador A encaminhável — a federação não é simétrica. E uma determinação técnica de federação não se propaga automaticamente: não cria admissão a um esquema operacional, não executa liquidação de fundos e não constitui autorização regulatória. Cada uma dessas é uma determinação de outro dono, no seu próprio âmbito.</desc>
  <defs>
    <linearGradient id="hg-P110" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P110" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#566273"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#F4F1EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="64" fill="url(#hg-P110)" rx="14"/>
  <rect x="0" y="48" width="900" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-110 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="white">Relações independentes</text>
  <text x="876" y="50" text-anchor="end" font-size="11" fill="#FECACA">par a par · não simétrica · não transitiva</text>

  <text x="24" y="88" font-size="11" fill="#6B6265">Cada relação de federação é avaliada por si. Nenhum resultado se propaga por um terceiro nem se torna, por si, autoridade.</text>

  <!-- non-transitive arc A .. C -->
  <path d="M135,160 C 300,104 600,104 765,160" fill="none" stroke="#B0392C" stroke-width="1.6" stroke-dasharray="6 5"/>
  <g>
    <circle cx="450" cy="118" r="12" fill="#FBEFF0" stroke="#B0392C" stroke-width="1.4"/>
    <path d="M444 112 l12 12 M456 112 l-12 12" stroke="#B0392C" stroke-width="1.6"/>
  </g>
  <text x="450" y="146" text-anchor="middle" font-size="10" fill="#B0392C">de A↔B e B↔C <tspan font-weight="700">não decorre</tspan> A↔C — não transitiva</text>

  <!-- Operador A -->
  <rect x="70" y="160" width="130" height="72" rx="12" fill="white" stroke="#33465B" stroke-width="1.5"/>
  <text x="135" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Operador A</text>
  <text x="135" y="212" text-anchor="middle" font-size="9" fill="#9CA3AF">exemplo</text>

  <!-- Operador B -->
  <rect x="385" y="160" width="130" height="72" rx="12" fill="white" stroke="#33465B" stroke-width="1.5"/>
  <text x="450" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Operador B</text>
  <text x="450" y="212" text-anchor="middle" font-size="9" fill="#9CA3AF">exemplo</text>

  <!-- Operador C -->
  <rect x="700" y="160" width="130" height="72" rx="12" fill="white" stroke="#33465B" stroke-width="1.5"/>
  <text x="765" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Operador C</text>
  <text x="765" y="212" text-anchor="middle" font-size="9" fill="#9CA3AF">exemplo</text>

  <!-- pairwise A-B (bidirectional, independent) -->
  <line x1="200" y1="190" x2="383" y2="190" stroke="#2E6A4E" stroke-width="1.6" marker-end="url(#arr-P110)"/>
  <line x1="385" y1="204" x2="202" y2="204" stroke="#2E6A4E" stroke-width="1.6" marker-end="url(#arr-P110)"/>
  <text x="292" y="248" text-anchor="middle" font-size="9.5" fill="#3E6E56">relação A–B</text>

  <!-- pairwise B-C -->
  <line x1="515" y1="190" x2="698" y2="190" stroke="#2E6A4E" stroke-width="1.6" marker-end="url(#arr-P110)"/>
  <line x1="700" y1="204" x2="517" y2="204" stroke="#2E6A4E" stroke-width="1.6" marker-end="url(#arr-P110)"/>
  <text x="607" y="248" text-anchor="middle" font-size="9.5" fill="#3E6E56">relação B–C</text>

  <!-- non-symmetry note -->
  <text x="450" y="272" text-anchor="middle" font-size="10" fill="#6B6265">Cada lado avalia e decide por si: A considerar B encaminhável <tspan font-weight="700">não implica</tspan> que B considere A encaminhável — não simétrica.</text>

  <!-- non-propagation band -->
  <rect x="24" y="300" width="852" height="150" rx="10" fill="#1B1113"/>
  <text x="44" y="330" font-size="12" font-weight="800" fill="#F6D9DD">Uma determinação técnica de federação não se propaga automaticamente</text>
  <text x="44" y="350" font-size="10.5" fill="#C9B6B9">Cada uma destas é uma determinação de outro dono, avaliada no seu próprio âmbito (ADR-061).</text>

  <!-- three "does not create" chips -->
  <g>
    <rect x="44" y="366" width="256" height="66" rx="10" fill="#241417" stroke="#5A1A22" stroke-width="1.2"/>
    <path d="M62 392 a10 10 0 1 0 0.01 0 M56 386 l12 12" stroke="#E8909D" stroke-width="1.6" fill="none"/>
    <text x="82" y="390" font-size="11" font-weight="700" fill="#ECECF0">Admissão a esquema</text>
    <text x="82" y="406" font-size="9.5" fill="#B6B6BE">Camada 3 — decisão do esquema,</text>
    <text x="82" y="420" font-size="9.5" fill="#B6B6BE">não uma consequência da avaliação</text>
  </g>
  <g>
    <rect x="322" y="366" width="256" height="66" rx="10" fill="#241417" stroke="#5A1A22" stroke-width="1.2"/>
    <path d="M340 392 a10 10 0 1 0 0.01 0 M334 386 l12 12" stroke="#E8909D" stroke-width="1.6" fill="none"/>
    <text x="360" y="390" font-size="11" font-weight="700" fill="#ECECF0">Liquidação de fundos</text>
    <text x="360" y="406" font-size="9.5" fill="#B6B6BE">executada pelos operadores,</text>
    <text x="360" y="420" font-size="9.5" fill="#B6B6BE">fora do protocolo — nunca pelo BANZA</text>
  </g>
  <g>
    <rect x="600" y="366" width="256" height="66" rx="10" fill="#241417" stroke="#5A1A22" stroke-width="1.2"/>
    <path d="M618 392 a10 10 0 1 0 0.01 0 M612 386 l12 12" stroke="#E8909D" stroke-width="1.6" fill="none"/>
    <text x="638" y="390" font-size="11" font-weight="700" fill="#ECECF0">Autorização regulatória</text>
    <text x="638" y="406" font-size="9.5" fill="#B6B6BE">pertence às autoridades competentes</text>
    <text x="638" y="420" font-size="9.5" fill="#B6B6BE">e ao operador, não ao protocolo</text>
  </g>

  <text x="450" y="476" text-anchor="middle" font-size="9" fill="#9CA3AF">SVG-P-110 · Relações de federação independentes · BANZA_REFERENCIA.md §10 · ADR-061 · ADR-079 · v1.0 · 2026-08-09</text>
</svg>
