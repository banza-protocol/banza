<?xml version="1.0"?>

<svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-P106 desc-P106" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P106">Ciclo temporal do estado protocolar do BANZA — estado observado, mudança das fontes e reavaliação</title>
  <desc id="desc-P106">Um resultado é estado observado no instante em que as fontes foram verificadas. Quando os artefactos mudam — novo hash, nova metadata, expiração de chave ou revogação — uma nova observação e uma reavaliação produzem um novo resultado, observado num instante posterior, enquanto o resultado anterior é preservado e nunca apagado. Estado observado não é o mesmo que estado actual: a validade de um estado persistido depende da frescura das fontes canónicas.</desc>

  <defs>
    <linearGradient id="hG-P106" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E0F1A"></stop><stop offset="100%" stop-color="#8E1326"></stop>
    </linearGradient>
    <linearGradient id="evG-P106" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532D"></stop><stop offset="100%" stop-color="#1B6B3A"></stop>
    </linearGradient>
    <linearGradient id="engG-P106" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"></stop><stop offset="100%" stop-color="#2C4E77"></stop>
    </linearGradient>
    <filter id="sh-P106" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"></feDropShadow>
    </filter>
    <marker id="arr-P106" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7E1320"></polygon>
    </marker>
    <marker id="arrH-P106" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9A8F86"></polygon>
    </marker>
  </defs>

  <rect width="980" height="420" fill="#F4F1EA"></rect>


  <rect x="16" y="12" width="948" height="54" rx="8" fill="url(#hG-P106)" filter="url(#sh-P106)"></rect>
  <text x="34" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.6" fill="#FECACA">SVG-P-106 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="34" y="52" fill="white" font-size="15" font-weight="800">Estado Observado e Estado Actual</text>
  <text x="946" y="52" text-anchor="end" fill="#F6D9DD" font-size="10">a validade depende da frescura</text>


  <rect x="16" y="76" width="948" height="30" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"></rect>
  <text x="490" y="95" text-anchor="middle" fill="#374151" font-size="10.5">Um resultado descreve o que foi verificado num <tspan font-weight="700" fill="#1A1A1A">instante</tspan> — não é, por si só, o estado actual.</text>


  <text x="265" y="158" text-anchor="middle" fill="#5A534E" font-size="8">com o tempo</text>
  <text x="489" y="158" text-anchor="middle" fill="#5A534E" font-size="8">exige</text>
  <text x="713" y="158" text-anchor="middle" fill="#5A534E" font-size="8">produz</text>

  <rect x="54" y="166" width="200" height="78" rx="8" fill="url(#evG-P106)" filter="url(#sh-P106)"></rect>
  <text x="154" y="198" text-anchor="middle" fill="white" font-size="11" font-weight="700">Resultado</text>
  <text x="154" y="216" text-anchor="middle" fill="#C7E8D2" font-size="9">estado observado em t</text>

  <rect x="278" y="166" width="200" height="78" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.4"></rect>
  <text x="378" y="192" text-anchor="middle" fill="#7A5212" font-size="10.5" font-weight="700">Os artefactos mudam</text>
