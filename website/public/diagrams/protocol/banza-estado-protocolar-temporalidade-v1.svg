  <rect x="54" y="284" width="200" height="44" rx="8" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"></rect>
  <text x="154" y="303" text-anchor="middle" fill="#1A1A1A" font-size="9.5" font-weight="700">Resultado anterior</text>
  <text x="154" y="318" text-anchor="middle" fill="#6B6265" font-size="8.5">histórico preservado, não apagado</text>


  <rect x="286" y="284" width="640" height="44" rx="8" fill="url(#hG-P106)" filter="url(#sh-P106)"></rect>
  <text x="606" y="303" text-anchor="middle" fill="white" font-size="11" font-weight="700">Estado observado ≠ estado actual</text>
  <text x="606" y="319" text-anchor="middle" fill="#F6D9DD" font-size="9.5">a validade de um estado persistido depende da frescura das fontes canónicas</text>


  <text x="490" y="360" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-106 · v1.0 · BANZA_REFERENCIA.md §5 Estado Protocolar · 2026-08-09</text>
