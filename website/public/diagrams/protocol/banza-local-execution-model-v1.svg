<?xml version="1.0"?>

<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-P043 desc-P043" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P043">Modelo de Execução Local BANZA — dois operadores independentes que implementam o protocolo localmente</title>
  <desc id="desc-P043">O BANZA não é um servidor central. As regras do protocolo são públicas e comuns; cada operador implementa-as na sua própria infraestrutura local. Dois operadores independentes — Operador A e Operador B — interoperam por respeitarem as mesmas regras e por publicarem evidência de conformidade verificável, não por se ligarem a uma infraestrutura partilhada do BANZA.</desc>

  <defs>
    <linearGradient id="hG-P043" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E0F1A"></stop><stop offset="100%" stop-color="#8E1326"></stop>
    </linearGradient>
    <linearGradient id="opG-P043" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C4654"></stop><stop offset="100%" stop-color="#566273"></stop>
    </linearGradient>
    <linearGradient id="protoG-P043" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E0C18"></stop><stop offset="100%" stop-color="#7E1320"></stop>
    </linearGradient>
    <filter id="sh-P043" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"></feDropShadow>
    </filter>
    <marker id="arrStart-P043" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
