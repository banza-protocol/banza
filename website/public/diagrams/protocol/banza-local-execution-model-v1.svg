  <line x1="372" y1="291" x2="528" y2="291" stroke="#3C4654" stroke-width="1.8" marker-start="url(#arrStart-P043)" marker-end="url(#arrEnd-P043)"></line>
  <text x="450" y="281" text-anchor="middle" fill="#1A1A1A" font-size="9" font-weight="700">interoperam</text>
  <text x="450" y="307" text-anchor="middle" fill="#6B6265" font-size="8">pelas mesmas regras,</text>
  <text x="450" y="318" text-anchor="middle" fill="#6B6265" font-size="8">não por infraestrutura partilhada</text>


  <rect x="16" y="382" width="868" height="52" rx="6" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"></rect>
  <text x="450" y="401" text-anchor="middle" fill="#1A1A1A" font-size="11" font-weight="700">O protocolo não reside num servidor central. Reside nas implementações locais de cada operador.</text>
  <text x="450" y="417" text-anchor="middle" fill="#6B6265" font-size="10">O BANZA define as regras; não executa pagamentos por si próprio.</text>
  <text x="450" y="429" text-anchor="middle" fill="#6B6265" font-size="10">A conformidade verificável é o que torna os operadores interoperáveis.</text>


  <text x="450" y="458" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-043 · v2.0 · BANZA_REFERENCIA.md §4 Arquitectura do Protocolo · 2026-08-08</text>
