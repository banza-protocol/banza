  <text x="210" y="205" text-anchor="middle" fill="#6B6265" font-size="8" font-style="italic">implementa e conforma-se</text>
  <text x="690" y="205" text-anchor="middle" fill="#6B6265" font-size="8" font-style="italic">implementa e conforma-se</text>


