  <text x="690" y="251" text-anchor="middle" fill="white" font-size="12" font-weight="700">Infraestrutura local</text>
  <rect x="546" y="272" width="288" height="38" rx="6" fill="#EEF0F2" stroke="#CDD3DA" stroke-width="1"></rect>
