    </marker>
    <marker id="arrUp-P043" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9A8F86"></polygon>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#F4F1EA"></rect>


  <rect x="16" y="12" width="868" height="54" rx="8" fill="url(#hG-P043)" filter="url(#sh-P043)"></rect>
  <text x="34" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.6" fill="#FECACA">SVG-P-043 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="34" y="52" fill="white" font-size="15" font-weight="800">Modelo de Execução Local BANZA</text>
  <text x="866" y="52" text-anchor="end" fill="#F6D9DD" font-size="10">regras comuns · infraestrutura local</text>


  <rect x="16" y="78" width="868" height="30" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"></rect>
  <text x="450" y="97" text-anchor="middle" fill="#374151" font-size="10.5">As regras são <tspan font-weight="700" fill="#1A1A1A">comuns e públicas</tspan>; a infraestrutura é <tspan font-weight="700" fill="#1A1A1A">local de cada operador</tspan>.</text>


  <rect x="120" y="122" width="660" height="60" rx="8" fill="url(#protoG-P043)" filter="url(#sh-P043)"></rect>
  <text x="450" y="141" text-anchor="middle" fill="#F6D9DD" font-size="8" font-weight="700" letter-spacing="1">REGRAS PÚBLICAS COMUNS DO PROTOCOLO</text>
  <text x="450" y="157" text-anchor="middle" fill="white" font-size="12" font-weight="800">Protocolo BANZA</text>
  <text x="450" y="173" text-anchor="middle" fill="#F1C7CC" font-size="9">especificação · invariantes · contratos · conformidade — não é um servidor central, não movimenta fundos</text>


