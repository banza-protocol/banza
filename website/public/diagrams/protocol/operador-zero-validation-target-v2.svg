  <line x1="160" y1="203" x2="188" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P088)"/>
  <line x1="322.4" y1="203" x2="350.4" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P088)"/>
  <line x1="484.8" y1="203" x2="512.8" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P088)"/>
  <line x1="647.2" y1="203" x2="675.2" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P088)"/>
  <line x1="809.6" y1="203" x2="837.6" y2="203" stroke="#8C8C95" stroke-width="1.8" marker-end="url(#arr-P088)"/>

  <!-- authority direction band -->
  <rect x="28" y="306" width="944" height="30" rx="9" fill="#141418" stroke="#2B2B33" stroke-width="1"/>
  <text x="44" y="325" font-size="10.5" fill="#B6B6BE"><tspan font-weight="700" fill="#8FB0D0">BanzAI</tspan> inicia  →  <tspan font-weight="700" fill="#E8909D">Rust</tspan> avalia  →  o <tspan font-weight="700" fill="#74C79E">Operador Zero</tspan> apenas expõe  →  o resultado flui para o <tspan font-weight="700" fill="#57C6BC">Registo</tspan>.</text>

  <!-- boundary band -->
  <rect x="28" y="346" width="944" height="86" rx="10" fill="#1B1113" stroke="#5A1A22" stroke-width="1.2"/>
  <text x="44" y="372" font-size="11.5" font-weight="700" fill="#E8909D">O Operador Zero é o alvo da validação, nunca o juiz.</text>
  <text x="44" y="394" font-size="10.5" fill="#B6B6BE">Não se valida a si próprio · não movimenta dinheiro real · não emite certificado.</text>
  <text x="44" y="414" font-size="10.5" fill="#B6B6BE">Sem simulador autónomo · sem ledger mutável · a avaliação é sempre externa, em Rust.</text>

  <text x="500" y="462" text-anchor="middle" font-size="9" fill="#7C7C85">SVG-P-088 · Operador Zero — alvo de validação · BANZA_REFERENCIA.md §9 · v2.0 · 2026-07-29</text>
