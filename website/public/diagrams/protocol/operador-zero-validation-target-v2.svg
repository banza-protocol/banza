    <text x="531.2" y="192" font-size="12.5" font-weight="800" fill="#A2ABB8">Relatórios</text>
    <text x="531.2" y="214" font-size="10" fill="#B6B6BE">resultado por</text>
    <text x="531.2" y="230" font-size="10" fill="#B6B6BE">verificação</text>
    <text x="531.2" y="252" font-size="8.5" fill="#8C8C95">por área de conformidade</text>
  </g>
  <!-- 5 · Evidence Bundle (gold) -->
  <g>
    <rect x="677.6" y="128" width="132" height="150" rx="12" fill="#17171B" stroke="#B98A3E" stroke-width="1.5"/>
    <circle cx="699.6" cy="152" r="13" fill="#B98A3E"/><text x="699.6" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">5</text>
    <text x="693.6" y="192" font-size="12.5" font-weight="800" fill="#E7C67E">Evidence Bundle</text>
    <text x="693.6" y="214" font-size="10" fill="#B6B6BE">pacote de</text>
    <text x="693.6" y="230" font-size="10" fill="#B6B6BE">evidência</text>
    <text x="693.6" y="252" font-size="8.5" fill="#8C8C95">reproduzível</text>
  </g>
  <!-- 6 · Registo Técnico (teal) -->
  <g>
    <rect x="840" y="128" width="132" height="150" rx="12" fill="#17171B" stroke="#0F766E" stroke-width="1.5"/>
    <circle cx="862" cy="152" r="13" fill="#0F766E"/><text x="862" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">6</text>
    <text x="856" y="192" font-size="12.5" font-weight="800" fill="#57C6BC">Registo Técnico</text>
    <text x="856" y="214" font-size="10" fill="#B6B6BE">publica o</text>
    <text x="856" y="230" font-size="10" fill="#B6B6BE">resultado</text>
    <text x="856" y="252" font-size="8.5" fill="#8C8C95">verificável por pares</text>
  </g>

