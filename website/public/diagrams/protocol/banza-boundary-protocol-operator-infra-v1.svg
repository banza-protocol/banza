<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-051
  diagram:   Fronteira do Protocolo BANZA — humanos/operadores → BanzAI (interface primária) → BANZA; e o que fica fora
  version:   1.3
  source:    BANZA_REFERENCIA.md §1 (O Que É) e §4 (Arquitectura)
  updated:   2026-08-08
  changes:   v1.3 — external infra generalized (no named external entity); header tagline aligned to the canonical authority phrasing ("a autoridade competente decide")
             v1.2 — BanzAI reframed as the primary human-operator interface (ADR-054); humans/operators → BanzAI → BANZA flow inside the boundary
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 900 624" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P051 desc-P051"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P051">Fronteira do Protocolo BANZA</title>
  <desc id="desc-P051">Humanos e operadores usam o BanzAI, a interface primária humano-operador (ADR-054), para interagir com o protocolo BANZA; dentro da fronteira ficam a especificação, os contratos, os invariantes, a conformidade, os motores verificáveis e a evidência. Fora da fronteira ficam os operadores independentes (app, operação, utilizadores, KYC/KYB, AML/CFT, incidentes), a infraestrutura financeira externa (contas, liquidação, vias financeiras) e as autoridades competentes (licenciamento, supervisão, regulação). O BanzAI orienta, mas não é normativo e não autoriza actividade regulada: não decide, não certifica, não aprova, não licencia nem movimenta fundos. Não há fluxo de fundos pelo BANZA — o protocolo não detém nem movimenta fundos. Integrações máquina-máquina continuam possíveis por APIs, manifests, schemas e endpoints, sem depender obrigatoriamente do BanzAI.</desc>
  <defs>
    <linearGradient id="hg-P051" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P051" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6B7280"/>
    </marker>
    <marker id="arrG-P051" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#B98A3E"/>
    </marker>
  </defs>

  <rect width="900" height="624" fill="#F4F1EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="64" fill="url(#hg-P051)" rx="14"/>
  <rect x="0" y="48" width="900" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-051 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="white">Fronteira do Protocolo</text>
  <text x="876" y="50" text-anchor="end" font-size="11" fill="#FECACA">BanzAI orienta · motores verificam · evidência prova · autoridade competente decide</text>

  <!-- Humanos / Operadores (actor, outside) -->
  <rect x="24" y="86" width="150" height="86" rx="12" fill="#6B7280"/>
  <text x="40" y="106" font-family="ui-monospace,'Courier New',monospace" font-size="8.5" font-weight="700" fill="#F3F4F6" letter-spacing="1">USAM O PROTOCOLO</text>
  <text x="40" y="128" font-size="13" font-weight="700" fill="white">Humanos /</text>
  <text x="40" y="145" font-size="13" font-weight="700" fill="white">Operadores</text>
  <text x="40" y="163" font-size="9" fill="#E5E7EB">compreendem · adoptam</text>

  <!-- flow arrow → BanzAI -->
  <line x1="176" y1="129" x2="204" y2="129" stroke="#B98A3E" stroke-width="2" marker-end="url(#arrG-P051)"/>

  <!-- INSIDE the boundary container -->
  <rect x="206" y="78" width="654" height="104" rx="14" fill="#FBEFF0" stroke="#8E1326" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="224" y="98" font-family="ui-monospace,'Courier New',monospace" font-size="9" font-weight="700" fill="#8E1326" letter-spacing="1">DENTRO DA FRONTEIRA BANZA</text>

  <!-- BanzAI · interface primária humano-operador -->
  <rect x="222" y="104" width="290" height="66" rx="10" fill="white" stroke="#8E1326" stroke-width="1.5"/>
  <text x="238" y="124" font-size="13" font-weight="800" fill="#3A1014">BanzAI · interface primária</text>
  <text x="238" y="140" font-size="10.5" fill="#4B5563">humano-operador — orienta · encaminha · explica</text>
  <text x="238" y="158" font-size="9.5" fill="#8E1326">não normativo · não certifica · não autoriza</text>

  <!-- flow arrow BanzAI → BANZA -->
  <line x1="514" y1="137" x2="540" y2="137" stroke="#B98A3E" stroke-width="2" marker-end="url(#arrG-P051)"/>

  <!-- BANZA · regras · motores · evidência -->
  <rect x="544" y="104" width="300" height="66" rx="10" fill="#8E1326"/>
  <text x="560" y="124" font-size="13" font-weight="800" fill="white">BANZA · protocolo aberto</text>
  <text x="560" y="140" font-size="10" fill="#F6D9DD">regras públicas · motores verificáveis · evidência</text>
  <text x="560" y="158" font-size="9.5" fill="#F6D9DD">especificação · contratos · invariantes · conformidade</text>

  <!-- Arrow BANZA -> Operadores -->
  <line x1="450" y1="182" x2="450" y2="224" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr-P051)"/>
  <text x="462" y="208" font-size="10" fill="#6B6265">contratos · evidência</text>

  <!-- Operadores independentes (fora) -->
  <rect x="270" y="226" width="360" height="112" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="286" y="248" font-family="ui-monospace,'Courier New',monospace" font-size="9" font-weight="700" fill="#6B7280" letter-spacing="1">FORA DA FRONTEIRA · OPERADORES</text>
  <text x="286" y="270" font-size="14" font-weight="700" fill="#1F2937">Operadores independentes</text>
  <text x="286" y="291" font-size="10" fill="#6B6265">aplicação / carteira · operação · utilizadores</text>
  <text x="286" y="308" font-size="10" fill="#6B6265">KYC/KYB · AML/CFT · suporte e incidentes</text>
  <text x="286" y="329" font-size="9.5" fill="#8E1326">Respondem pela operação perante clientes, bancos e autoridades.</text>

  <!-- Arrows Operadores -> Infra financeira and -> Autoridades -->
  <line x1="330" y1="338" x2="250" y2="392" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr-P051)"/>
  <text x="188" y="374" font-size="10" fill="#6B6265">operação · liquidação</text>
  <line x1="570" y1="338" x2="650" y2="392" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr-P051)"/>
  <text x="620" y="374" font-size="10" fill="#6B6265">supervisão · licença</text>

  <!-- Banco / infraestrutura financeira -->
  <rect x="40" y="394" width="390" height="100" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="56" y="416" font-family="ui-monospace,'Courier New',monospace" font-size="9" font-weight="700" fill="#6B7280" letter-spacing="1">FORA DA FRONTEIRA · INFRA FINANCEIRA</text>
  <text x="56" y="438" font-size="13.5" font-weight="700" fill="#1F2937">Banco / infraestrutura financeira</text>
  <text x="56" y="458" font-size="10" fill="#6B6265">contas · liquidação · vias financeiras · relação operacional</text>
  <text x="56" y="478" font-size="9" fill="#6B6265">Infra externa possível do operador — não integrada pelo protocolo.</text>

  <!-- Autoridades -->
  <rect x="470" y="394" width="390" height="100" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="486" y="416" font-family="ui-monospace,'Courier New',monospace" font-size="9" font-weight="700" fill="#6B7280" letter-spacing="1">FORA DA FRONTEIRA · REGULAÇÃO</text>
  <text x="486" y="438" font-size="13.5" font-weight="700" fill="#1F2937">Autoridades competentes</text>
  <text x="486" y="458" font-size="10" fill="#6B6265">licenciamento · supervisão · enquadramento regulatório</text>
  <text x="486" y="478" font-size="9.5" fill="#6B6265">O BANZA não licencia nem autoriza actividade regulada.</text>

  <!-- Bottom notes -->
  <rect x="40" y="506" width="820" height="52" rx="8" fill="#FBEFF0" stroke="#EAD2D6" stroke-width="1"/>
  <text x="450" y="526" text-anchor="middle" font-size="11" font-weight="700" fill="#8E1326">Sem fluxo de fundos pelo BANZA — o protocolo não detém nem movimenta fundos.</text>
  <text x="450" y="546" text-anchor="middle" font-size="10" fill="#6B6265">O BanzAI orienta a implementação, mas não autoriza actividade regulada. Máquina-a-máquina não depende obrigatoriamente do BanzAI.</text>

  <text x="450" y="586" text-anchor="middle" font-size="9" fill="#9CA3AF">SVG-P-051 · Fronteira do Protocolo · BANZA_REFERENCIA.md §1 · v1.3 · 2026-08-08</text>
</svg>
