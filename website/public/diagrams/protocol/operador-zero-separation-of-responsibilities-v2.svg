<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P089 desc-P089"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P089">Separação de responsabilidades na validação do Operador Zero</title>
  <desc id="desc-P089">Cinco papéis distintos e não substituíveis. O Operador Zero expõe endpoints só de leitura e não se valida a si próprio. O BanzAI orquestra a sessão de validação, chama os motores e cita fontes, mas não decide nem aprova. Os motores Rust avaliam a conformidade, a confiança e a federação de forma determinística e fecham por omissão. O Qwen explica o resultado em linguagem natural e nunca valida nem decide. O Registo publica um índice verificável de hashes e assinaturas e não é uma lista de admitidos. O Operador Zero é o alvo, nunca o juiz: não se auto-valida, não emite credencial e não movimenta dinheiro real.</desc>
  <defs>
    <linearGradient id="hg-P089" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="540" fill="#0E0E11"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#hg-P089)" rx="14"/>
  <rect x="0" y="48" width="1000" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-089 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="#FFFFFF">Separação de responsabilidades</text>
  <text x="976" y="50" text-anchor="end" font-size="11" fill="#F6D9DD">cinco papéis distintos · nenhum substitui outro</text>

  <text x="24" y="94" font-size="11.5" fill="#B6B6BE">Cada papel tem uma função única na validação do Operador Zero. Cada cartão indica o que faz e a sua fronteira.</text>

