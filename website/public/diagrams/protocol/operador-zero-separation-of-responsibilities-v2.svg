    <text x="44" y="230" font-size="10" fill="#C9C9D0">• endpoints só de leitura</text>
    <text x="44" y="248" font-size="10" fill="#C9C9D0">• manifest · metadata</text>
    <text x="44" y="266" font-size="10" fill="#C9C9D0">• relatórios servidos</text>
