<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P073 desc-P073"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P073">Jornada do operador guiada pelo BanzAI</title>
  <desc id="desc-P073">A jornada canónica de nove passos, conduzida pelo BanzAI e avaliada em cada passo pelos motores Rust: 1 Descoberta dos endpoints, 2 Manifesto em /.well-known/banza/operator.json, 3 Chaves e metadata de protocolo assinada, 4 Conformidade sobre os vectores, 5 Interoperabilidade e contrato de endpoint entre pares, 6 Confiança pela Open Trust Evaluation com fecho por omissão, 7 Federação avaliada entre pares, 8 Evidência empacotada de forma reproduzível, e 9 Prontidão para certificação, em que a implementação não recebe qualquer credencial concedida — a prontidão é evidência técnica. O BanzAI guia cada passo; os motores Rust/WASM verificam; a evidência prova. A participação é demonstrada por evidência verificável, não aprovada por uma entidade central.</desc>
  <defs>
    <linearGradient id="hg-P073" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P073" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#B98A3E"/>
    </marker>
  </defs>

  <rect width="1040" height="480" fill="#F8F4EC"/>

  <rect x="0" y="0" width="1040" height="66" fill="url(#hg-P073)" rx="14"/>
  <rect x="0" y="50" width="1040" height="16" fill="#8E1326"/>
  <text x="28" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#FECACA" letter-spacing="2">SVG-P-073 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="28" y="51" font-size="19" font-weight="800" fill="white">Jornada do operador guiada pelo BanzAI</text>

  <!-- Row 1: steps 1-5 -->
  <g font-size="11">
