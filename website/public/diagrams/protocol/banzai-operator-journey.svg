  <g font-size="11">
    <g>
      <rect x="24" y="248" width="228" height="92" rx="11" fill="#EAEFF4" stroke="#2E4054" stroke-width="1.5"/>
      <circle cx="46" cy="270" r="11" fill="#2E4054"/><text x="46" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>
      <text x="68" y="274" font-size="12.5" font-weight="700" fill="#2E4054">Confiança</text>
      <text x="40" y="298" font-size="10" fill="#54595F">Open Trust Evaluation · fail-closed.</text>
    </g>
    <line x1="252" y1="294" x2="276" y2="294" stroke="#B98A3E" stroke-width="2" marker-end="url(#arr-P073)"/>
    <g>
