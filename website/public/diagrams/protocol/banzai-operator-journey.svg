    </g>
    <line x1="518" y1="294" x2="542" y2="294" stroke="#B98A3E" stroke-width="2" marker-end="url(#arr-P073)"/>
    <g>
      <rect x="544" y="248" width="228" height="92" rx="11" fill="#EAF3EC" stroke="#2E6A4E" stroke-width="1.5"/>
      <circle cx="566" cy="270" r="11" fill="#2E6A4E"/><text x="566" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4A34">8</text>
      <text x="588" y="274" font-size="12.5" font-weight="700" fill="#1D4A34">Evidência</text>
      <text x="560" y="298" font-size="10" fill="#2E6A4E">Evidence bundle reproduzível.</text>
    </g>
    <line x1="772" y1="294" x2="796" y2="294" stroke="#B98A3E" stroke-width="2" marker-end="url(#arr-P073)"/>
    <g>
      <rect x="798" y="248" width="218" height="92" rx="11" fill="#FBEFF0" stroke="#8E1326" stroke-width="1.5"/>
      <circle cx="820" cy="270" r="11" fill="#8E1326"/><text x="820" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">9</text>
      <text x="842" y="274" font-size="12.5" font-weight="700" fill="#8E1326">Prontidão</text>
      <text x="812" y="298" font-size="10" fill="#6B6265">Para certificação — não é credencial.</text>
    </g>
  </g>

  <!-- principle band -->
  <rect x="24" y="372" width="992" height="40" rx="10" fill="#EAEFF4" stroke="#CBD5E0" stroke-width="1"/>
  <text x="520" y="397" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2E4054">BanzAI guia; os motores Rust verificam; a evidência prova. A participação é demonstrada, não aprovada.</text>

  <text x="520" y="450" text-anchor="middle" font-size="9" fill="#9CA3AF">SVG-P-073 · Jornada do operador guiada pelo BanzAI · BANZA_REFERENCIA.md §9 · ADR-036 · v2.0 · 2026-07-29</text>
