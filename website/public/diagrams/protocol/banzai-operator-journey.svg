      <rect x="24" y="96" width="180" height="92" rx="11" fill="#FBEFF0" stroke="#8E1326" stroke-width="1.5"/>
      <circle cx="46" cy="118" r="11" fill="#8E1326"/><text x="46" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
      <text x="68" y="122" font-size="12.5" font-weight="700" fill="#8E1326">Descoberta</text>
      <text x="40" y="146" font-size="10" fill="#6B6265">BanzAI localiza os</text>
      <text x="40" y="160" font-size="10" fill="#6B6265">endpoints do operador.</text>
    </g>
    <line x1="204" y1="142" x2="228" y2="142" stroke="#B98A3E" stroke-width="2" marker-end="url(#arr-P073)"/>
    <g>
      <rect x="230" y="96" width="180" height="92" rx="11" fill="#FBEFF0" stroke="#8E1326" stroke-width="1.5"/>
      <circle cx="252" cy="118" r="11" fill="#8E1326"/><text x="252" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
      <text x="274" y="122" font-size="12.5" font-weight="700" fill="#8E1326">Manifesto</text>
      <text x="246" y="146" font-size="10" fill="#6B6265">GET /.well-known/</text>
      <text x="246" y="160" font-size="10" fill="#6B6265">banza/operator.json</text>
    </g>
    <line x1="410" y1="142" x2="434" y2="142" stroke="#B98A3E" stroke-width="2" marker-end="url(#arr-P073)"/>
    <g>
      <rect x="436" y="96" width="180" height="92" rx="11" fill="#E6F1F0" stroke="#0F766E" stroke-width="1.5"/>
      <circle cx="458" cy="118" r="11" fill="#0F766E"/><text x="458" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
      <text x="480" y="122" font-size="12.5" font-weight="700" fill="#115E59">Chaves</text>
      <text x="452" y="146" font-size="10" fill="#0F766E">Metadata assinada e</text>
      <text x="452" y="160" font-size="10" fill="#0F766E">chaves delegadas.</text>
    </g>
    <line x1="616" y1="142" x2="640" y2="142" stroke="#B98A3E" stroke-width="2" marker-end="url(#arr-P073)"/>
    <g>
      <rect x="642" y="96" width="180" height="92" rx="11" fill="#EAF3EC" stroke="#2E6A4E" stroke-width="1.5"/>
      <circle cx="664" cy="118" r="11" fill="#2E6A4E"/><text x="664" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
      <text x="686" y="122" font-size="12.5" font-weight="700" fill="#1D4A34">Conformidade</text>
      <text x="658" y="146" font-size="10" fill="#2E6A4E">Motores Rust avaliam</text>
      <text x="658" y="160" font-size="10" fill="#2E6A4E">os vectores.</text>
    </g>
    <line x1="822" y1="142" x2="846" y2="142" stroke="#B98A3E" stroke-width="2" marker-end="url(#arr-P073)"/>
    <g>
      <rect x="848" y="96" width="168" height="92" rx="11" fill="#EAEFF4" stroke="#2E4054" stroke-width="1.5"/>
      <circle cx="870" cy="118" r="11" fill="#2E4054"/><text x="870" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>
      <text x="892" y="122" font-size="10.5" font-weight="700" fill="#2E4054">Interoperabilidade</text>
      <text x="864" y="146" font-size="10" fill="#54595F">Troca entre pares e</text>
      <text x="864" y="160" font-size="10" fill="#54595F">contrato de endpoint.</text>
    </g>
  </g>

  <!-- wrap connector -->
