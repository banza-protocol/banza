    <rect x="90" y="662" width="820" height="44" rx="12" fill="#FFFFFF" stroke="#CBD2DA" stroke-dasharray="5 4"/>
    <text x="112" y="682" font-size="9.5" letter-spacing="1" fill="#6B7280" font-family="ui-monospace, monospace">TRILHO MÁQUINA-A-MÁQUINA</text>
    <text x="112" y="698" font-size="11" fill="#54595F">Integrações máquina-máquina continuam possíveis por APIs, manifests, schemas, endpoints e motores verificáveis, sem depender obrigatoriamente do BanzAI.</text>
  </g>

  <!-- ── Invariants band ──────────────────────────────────────────────────── -->
  <g>
    <rect x="90" y="722" width="820" height="90" rx="14" fill="#FFFFFF" stroke="#EADFCE"/>
    <text x="110" y="746" font-size="12" font-weight="700" fill="#16191E" font-family="ui-monospace, monospace" letter-spacing="1">INVARIANTES ARQUITECTÓNICOS</text>
    <g font-size="11" fill="#54595F">
      <circle cx="114" cy="768" r="3" fill="#8E1326"/><text x="124" y="771.5">BANZA define regras; não opera pagamentos.</text>
      <circle cx="114" cy="790" r="3" fill="#33465B"/><text x="124" y="793.5">BanzAI guia e explica; não certifica nem aprova operadores.</text>
      <circle cx="524" cy="768" r="3" fill="#2E6A4E"/><text x="534" y="771.5">Operadores publicam a sua própria evidência.</text>
      <circle cx="524" cy="790" r="3" fill="#0F766E"/><text x="534" y="793.5">A confiança é verificável por máquina. Na dúvida, o trust falha fechado.</text>
    </g>
  </g>

  <!-- ── Authority rule + three-layer note ── -->
  <g>
    <rect x="90" y="822" width="820" height="60" rx="12" fill="#F4ECDF" stroke="#E3D9C6"/>
    <text x="110" y="844" font-size="10.5" font-weight="700" fill="#8B651C">O Rust compreende, encaminha, executa, valida e decide; o Qwen explica uma vez e nunca decide (ADR-037).</text>
    <text x="110" y="864" font-size="10" fill="#54595F">O ecossistema tem três camadas — Camada 1 Protocolo aberto · Camada 2 Certificação de Conformidade e Interoperabilidade · Camada 3 Esquemas operacionais independentes — e o BanzAI é transversal, não uma quarta camada (ADR-059).</text>
  </g>

  <!-- metadata footer -->
