<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-P071 desc-P071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title-P071">Arquitectura do Protocolo BANZA</title>
  <desc id="desc-P071">Arquitectura do protocolo financeiro aberto BANZA como um fluxo primário humano-operador (ADR-054): Humanos e operadores começam pela interface primária BanzAI, que interpreta pedidos, consulta a referência, orienta, encaminha para os motores verificáveis e explica os resultados; os motores determinísticos Rust/WASM verificam e a evidência prova, produzindo um resultado técnico verificável. Na base, a governança, os ADR/RFC e a referência definem as regras que o BanzAI consulta e os motores verificam, e decidem a evolução do protocolo. O BanzAI não é fonte normativa: não decide, não certifica, não aprova, não licencia, não publica operadores e não movimenta fundos, e não substitui os motores. As integrações máquina-máquina continuam possíveis por APIs, manifests, schemas, endpoints e motores verificáveis, sem depender obrigatoriamente do BanzAI. Não há autoridade central nem credenciais emitidas pela BANZA. O ecossistema organiza-se em três camadas — Camada 1 Protocolo aberto, Camada 2 Certificação de Conformidade e Interoperabilidade, Camada 3 Esquemas operacionais independentes — e o BanzAI é transversal, não uma quarta camada (ADR-059); o Rust compreende, encaminha, executa, valida e decide, e o Qwen explica uma vez e nunca decide (ADR-037).</desc>

