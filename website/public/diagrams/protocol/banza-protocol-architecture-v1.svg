    <linearGradient id="goldG-P071" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B0863A"/><stop offset="1" stop-color="#8B651C"/></linearGradient>
    <linearGradient id="redG-P071" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E1326"/><stop offset="1" stop-color="#5E0C18"/></linearGradient>
    <linearGradient id="slateG-P071" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33465B"/><stop offset="1" stop-color="#1C2836"/></linearGradient>
    <linearGradient id="burgG-P071" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E0F1A"/><stop offset="1" stop-color="#45080F"/></linearGradient>
