  <rect x="0" y="48" width="900" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-103 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="white">Princípios → consequência estrutural</text>
  <text x="876" y="50" text-anchor="end" font-size="11" fill="#FECACA">propriedades de desenho, não de implementação</text>

  <!-- column headers -->
