<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P103 desc-P103"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P103">Princípios fundamentais e a sua consequência estrutural</title>
  <desc id="desc-P103">Cada princípio fundamental do protocolo BANZA produz uma consequência de desenho verificável: correcção financeira dá operações auditáveis e reproduzíveis; neutralidade dá as mesmas regras para todas as implementações; regras públicas e versionadas dão avaliação com âncora testável; decisão determinística dá resultado reproduzível com razão legível por máquina; evidência e reprodutibilidade dão resultado verificável por terceiros; âmbito explícito e ausência de autoridade implícita fazem com que o resultado não propague estatuto institucional; fecho por omissão faz com que a interoperabilidade seja concedida por verificação; separação de responsabilidades faz com que nenhuma autoridade seja única. Em conjunto, estes princípios condicionam a arquitectura, a validação e a evolução do protocolo (§4). São propriedades de desenho independentes da tecnologia usada para implementar o protocolo.</desc>
  <defs>
    <linearGradient id="hg-P103" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P103" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#B98A3E"/>
    </marker>
    <marker id="arrD-P103" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8E1326"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#F4F1EA"/>

  <!-- Header -->
