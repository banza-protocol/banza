  <!-- convergence: the set conditions the architecture -->
  <line x1="450" y1="520" x2="450" y2="540" stroke="#8E1326" stroke-width="2" marker-end="url(#arrD-P103)"/>
  <rect x="24" y="548" width="852" height="46" rx="10" fill="#FBEFF0" stroke="#8E1326" stroke-width="1.5"/>
  <text x="450" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#8E1326">Em conjunto, condicionam a arquitectura, a validação e a evolução do protocolo</text>
  <text x="450" y="586" text-anchor="middle" font-size="10" fill="#6B6265">materialização concreta em §4 Arquitectura do Protocolo</text>

  <text x="450" y="612" text-anchor="middle" font-size="9" fill="#9CA3AF">SVG-P-103 · Princípios → consequência estrutural · BANZA_REFERENCIA.md §3 · v1.1 · 2026-08-08</text>
</svg>
