  <rect x="356" y="148" width="520" height="44" rx="9" fill="white" stroke="#EAD2D6" stroke-width="1.5"/>
  <text x="372" y="175" font-size="11" fill="#4B3A3C">as mesmas regras para todas as implementações</text>

