<?xml version="1.0"?>

<svg viewBox="0 0 900 524" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-P040 desc-P040" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P040">Âmbitos de Conformidade de Implementações BANZA — L0 a L4</title>
  <desc id="desc-P040">Cinco âmbitos de conformidade de uma implementação BANZA, cumulativos e definidos por capacidades técnicas: L0 Sandbox, L1 Pagamento, L2 Iniciação, L3 Interoperabilidade, L4 Externa. São o scope da conformidade, não níveis nem uma hierarquia pública de certificação — um certificado L2 cobre os âmbitos que a sua evidência sustenta (ADR-021/064).</desc>
  <defs>
    <linearGradient id="hG-P040" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E0F1A"></stop><stop offset="100%" stop-color="#8E1326"></stop>
    </linearGradient>
    <linearGradient id="l0G-P040" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"></stop><stop offset="100%" stop-color="#6B7280"></stop>
    </linearGradient>
    <linearGradient id="l1G-P040" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44505F"></stop><stop offset="100%" stop-color="#566273"></stop>
    </linearGradient>
    <linearGradient id="l2G-P040" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C4654"></stop><stop offset="100%" stop-color="#566273"></stop>
    </linearGradient>
    <linearGradient id="l3G-P040" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81"></stop><stop offset="100%" stop-color="#4338CA"></stop>
    </linearGradient>
    <linearGradient id="l4G-P040" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E0C18"></stop><stop offset="100%" stop-color="#7E1320"></stop>
    </linearGradient>
    <filter id="sh-P040" x="-2%" y="-10%" width="108%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"></feDropShadow>
    </filter>
    <marker id="darr-P040" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0 0, 8 0, 4 7" fill="#CBD5E1"></polygon>
    </marker>
  </defs>
  <rect width="900" height="524" fill="#F4F1EA"></rect>
  
  <rect x="16" y="12" width="868" height="54" rx="8" fill="url(#hG-P040)" filter="url(#sh-P040)"></rect>
  <text x="34" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.6" fill="#FECACA">SVG-P-040 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="34" y="52" fill="white" font-size="15" font-weight="800">Âmbitos de Conformidade de Implementações</text>
  <text x="866" y="52" text-anchor="end" fill="#F6D9DD" font-size="10">capacidades técnicas cumulativas</text>

  
  <rect x="16" y="80" width="868" height="60" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#sh-P040)"></rect>
  <rect x="16" y="80" width="100" height="60" rx="6" fill="url(#l0G-P040)"></rect>
  <rect x="86" y="80" width="30" height="60" fill="url(#l0G-P040)"></rect>
  <text x="66" y="106" text-anchor="middle" fill="white" font-size="18" font-weight="800">L0</text>
  <text x="66" y="122" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9" font-weight="600">Sandbox</text>
  <text x="130" y="103" fill="#374151" font-size="10.5" font-weight="700">Sandbox de Protocolo</text>
  <text x="130" y="119" fill="#6B7280" font-size="9.5">Ambiente de testes operacional · endpoint de saúde · operações básicas de carteira · integração contract-first</text>
  <text x="130" y="132" fill="#6B7280" font-size="9.5">Ponto de entrada no ecossistema · sem produção · sem dados reais</text>

  
  <line x1="450" y1="142" x2="450" y2="152" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#darr-P040)"></line>

  
  <rect x="16" y="154" width="868" height="60" rx="6" fill="white" stroke="#CDD3DA" stroke-width="1.5" filter="url(#sh-P040)"></rect>
  <rect x="16" y="154" width="100" height="60" rx="6" fill="url(#l1G-P040)"></rect>
  <rect x="86" y="154" width="30" height="60" fill="url(#l1G-P040)"></rect>
  <text x="66" y="180" text-anchor="middle" fill="white" font-size="18" font-weight="800">L1</text>
  <text x="66" y="196" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9" font-weight="600">Pagamento</text>
  <text x="130" y="177" fill="#44505F" font-size="10.5" font-weight="700">Capacidade de Pagamento Central  <tspan fill="#6B7280" font-weight="400" font-size="9">+ tudo de L0</tspan></text>
  <text x="130" y="193" fill="#6B7280" font-size="9.5">Carteiras de consumidor e de comerciante · QR estático · transferências P2P entre carteiras</text>
  <text x="130" y="206" fill="#6B7280" font-size="9.5">Identidade @handle · ciclo de vida de carteira completo</text>

  
  <line x1="450" y1="216" x2="450" y2="226" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#darr-P040)"></line>

  
  <rect x="16" y="228" width="868" height="60" rx="6" fill="white" stroke="#9AA6B3" stroke-width="1.5" filter="url(#sh-P040)"></rect>
  <rect x="16" y="228" width="100" height="60" rx="6" fill="url(#l2G-P040)"></rect>
  <rect x="86" y="228" width="30" height="60" fill="url(#l2G-P040)"></rect>
  <text x="66" y="254" text-anchor="middle" fill="white" font-size="18" font-weight="800">L2</text>
  <text x="66" y="270" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9" font-weight="600">Iniciação</text>
  <text x="130" y="251" fill="#3C4654" font-size="10.5" font-weight="700">Capacidade de Iniciação de Pagamento  <tspan fill="#6B7280" font-weight="400" font-size="9">+ tudo de L1</tspan></text>
  <text x="130" y="267" fill="#6B7280" font-size="9.5">QR dinâmico · pedidos/links de pagamento · execução instantânea T+0 · webhooks · INV-QR</text>
  <text x="130" y="280" fill="#6B7280" font-size="9.5">Nível base para a maioria dos operadores de produção</text>

  
  <line x1="450" y1="290" x2="450" y2="300" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#darr-P040)"></line>

  
  <rect x="16" y="302" width="868" height="60" rx="6" fill="white" stroke="#C4B5FD" stroke-width="1.5" filter="url(#sh-P040)"></rect>
  <rect x="16" y="302" width="100" height="60" rx="6" fill="url(#l3G-P040)"></rect>
  <rect x="86" y="302" width="30" height="60" fill="url(#l3G-P040)"></rect>
  <text x="66" y="328" text-anchor="middle" fill="white" font-size="18" font-weight="800">L3</text>
  <text x="66" y="344" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9" font-weight="600">Inter-Op.</text>
  <text x="130" y="325" fill="#312E81" font-size="10.5" font-weight="700">Interoperabilidade entre Operadores  <tspan fill="#6B7280" font-weight="400" font-size="9">+ tudo de L2</tspan></text>
  <text x="130" y="341" fill="#6B7280" font-size="9.5">Encaminhamento inter-operadores · obrigações assinadas · reconciliação · pagamentos via bancária</text>
  <text x="130" y="354" fill="#6B7280" font-size="9.5">Evidência de conformidade válida e fresca · não revogado na BRL · requer evidência multi-operador</text>

  
  <line x1="450" y1="364" x2="450" y2="374" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#darr-P040)"></line>

  
  <rect x="16" y="376" width="868" height="60" rx="6" fill="white" stroke="#EAD2D6" stroke-width="1.5" filter="url(#sh-P040)"></rect>
  <rect x="16" y="376" width="100" height="60" rx="6" fill="url(#l4G-P040)"></rect>
  <rect x="86" y="376" width="30" height="60" fill="url(#l4G-P040)"></rect>
  <text x="66" y="402" text-anchor="middle" fill="white" font-size="18" font-weight="800">L4</text>
  <text x="66" y="418" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9" font-weight="600">Externa</text>
  <text x="130" y="399" fill="#5E0C18" font-size="10.5" font-weight="700">Interoperabilidade Externa  <tspan fill="#6B7280" font-weight="400" font-size="9">+ tudo de L3</tspan></text>
  <text x="130" y="415" fill="#6B7280" font-size="9.5">Aquisição via vias externas (acquiring.external) — ex.: redes nacionais como o EMIS (definido por perfil)</text>
  <text x="130" y="428" fill="#6B7280" font-size="9.5">Conjunto de testes L4 (vias externas) — definido por perfil, requer evidência de integração externa</text>

  
  <rect x="16" y="450" width="868" height="52" rx="6" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"></rect>
  <text x="28" y="466" fill="#1A1A1A" font-size="10" font-weight="600">Âmbitos, não níveis de certificação.</text>
  <text x="248" y="466" fill="#6B6265" font-size="10">L0–L4 são capacidades cumulativas; um certificado L2 cobre os âmbitos que a sua evidência sustenta (ADR-021/064).</text>
  <text x="28" y="484" fill="#1A1A1A" font-size="10" font-weight="600">Acesso aberto.</text>
  <text x="116" y="484" fill="#6B6265" font-size="10">Qualquer entidade demonstra conformidade apresentando evidência verificável para o âmbito alvo.</text>
  <text x="450" y="514" text-anchor="middle" fill="#6B6265" font-size="10">SVG-P-040 · v1.0 · BANZA_REFERENCIA.md §8 · ADR-021 · 2026-06-07</text>
</svg>