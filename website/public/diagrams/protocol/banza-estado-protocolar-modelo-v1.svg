  <text x="288" y="308" fill="#374151" font-size="9"><tspan font-weight="700">Derivado</tspan> — recalculável das fontes</text>
  <rect x="540" y="298" width="12" height="12" rx="2" fill="url(#opG-P105)"></rect>
  <text x="558" y="308" fill="#374151" font-size="9"><tspan font-weight="700">Persistido</tspan> — materialização, sem autoridade</text>
  <rect x="812" y="298" width="12" height="12" rx="2" fill="white" stroke="#CDD3DA" stroke-width="1.5"></rect>
  <text x="830" y="308" fill="#374151" font-size="9"><tspan font-weight="700">Publicado</tspan> — superfície</text>


  <rect x="16" y="338" width="948" height="44" rx="8" fill="#EAE0DF" stroke="#D4C9C7" stroke-width="1"></rect>
  <text x="490" y="357" text-anchor="middle" fill="#1A1A1A" font-size="10.5" font-weight="700">A persistência não cria autoridade — a verdade vem das fontes, da evidência e do processo aplicável.</text>
  <text x="490" y="373" text-anchor="middle" fill="#6B6265" font-size="10">O estado é verificável recalculando hashes e conferindo assinaturas; nunca guarda valor financeiro.</text>


