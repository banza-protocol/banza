      <stop offset="0%" stop-color="#6E0F1A"></stop><stop offset="100%" stop-color="#8E1326"></stop>
    </linearGradient>
    <linearGradient id="protoG-P105" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E0C18"></stop><stop offset="100%" stop-color="#7E1320"></stop>
    </linearGradient>
    <linearGradient id="engG-P105" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"></stop><stop offset="100%" stop-color="#2C4E77"></stop>
    </linearGradient>
    <linearGradient id="evG-P105" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532D"></stop><stop offset="100%" stop-color="#1B6B3A"></stop>
    </linearGradient>
    <linearGradient id="opG-P105" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C4654"></stop><stop offset="100%" stop-color="#566273"></stop>
    </linearGradient>
