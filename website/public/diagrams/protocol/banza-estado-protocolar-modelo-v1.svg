<?xml version="1.0"?>

<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-P105 desc-P105" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P105">Modelo do estado protocolar do BANZA — fonte, observação, avaliação, resultado, persistência e publicação</title>
  <desc id="desc-P105">O estado protocolar move-se de uma fonte canónica (artefactos públicos assinados e contratos) por observação e avaliação determinística até um resultado com evidência reproduzível, que é depois materializado (persistência) e publicado numa superfície pública. A legenda distingue três naturezas de estado — fonte (a autoridade), estado derivado (recalculável a partir das fontes) e estado persistido (materialização durável, sem autoridade) — e a superfície pública onde o estado é publicado. A persistência não cria autoridade — a verdade vem das fontes, da evidência e do processo aplicável; o estado é verificável recalculando hashes e conferindo assinaturas, e nunca guarda valor financeiro.</desc>

  <defs>
