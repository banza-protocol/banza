# BANZA reverse proxy — Cloudflare proxied, SSL Full (strict) + Origin Certificate.
# Machine routes on the apex; the public BanzAI chat is the apex /banzai UI, which calls the
# internal banzai-api same-origin via /banzai/ask (M2.8E — no BanzAI subdomain backend).

# Rate-limit zone for the public BanzAI chat, keyed on the real client IP (behind Cloudflare).
# Defence-in-depth on top of banzai-api's own per-user limit + concurrency(1)/queue(1) gate.
limit_req_zone $http_cf_connecting_ip zone=banzai_ask:10m rate=20r/m;

# ── HTTP → HTTPS (Cloudflare also does this at the edge) ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name banza.network www.banza.network docs.banza.network banzai.banza.network zero.banza.network;
    location / { return 301 https://$host$request_uri; }
}

# ── www → apex ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.banza.network;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://banza.network$request_uri;
}

# ── apex: institutional site + canonical MACHINE routes ──────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name banza.network;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 8m;

    # Real client IP behind Cloudflare
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # Canonical machine routes → verification-api (JSON; never redirect to HTML).
    location = /.well-known/banza/root.json          { proxy_pass http://verification-api:8090; }
    location = /.well-known/banza/key-manifest.json  { proxy_pass http://verification-api:8090; }
    location = /operators                            { proxy_pass http://verification-api:8090; }
    location ^~ /operators/                          { proxy_pass http://verification-api:8090; }
    location = /federation/revocation-list.json      { proxy_pass http://verification-api:8090; }
    location ^~ /conformance/evidence                { proxy_pass http://verification-api:8090; }

    # Public BanzAI chat → internal banzai-api (local_qwen). Same-origin; ONLY this one path
    # is proxied to the service (no subdomain, no raw host port; llama.cpp/PostgreSQL stay
    # internal). Real client IP for the backend's per-user rate limit; timeout above the 60s
    # local-inference budget; small body cap (a question, not an upload).
    location = /banzai/ask {
        limit_req            zone=banzai_ask burst=5 nodelay;
        proxy_pass           http://banzai-api:8091/ask;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   65s;
        client_max_body_size 16k;
    }

    # SPR-2 — the Safe Progressive Response SSE endpoint. Same-origin; the ONLY streaming path exposed.
    # SSE needs buffering + caching OFF end-to-end so each `event:`/`data:` frame reaches the browser
    # immediately; chunked transfer keeps the connection open; a longer read timeout covers the local
    # inference budget; and passing the client abort upstream lets banzai-api cancel an in-flight inference
    # and free its M2.14E queue slot the instant the browser disconnects. Small body cap (a question).
    location = /banzai/ask/stream {
        limit_req                  zone=banzai_ask burst=5 nodelay;
        proxy_pass                 http://banzai-api:8091/ask/stream;
        proxy_http_version         1.1;
        proxy_set_header           Host              $host;
        proxy_set_header           X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header           X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header           X-Forwarded-Proto $scheme;
        proxy_set_header           Connection        "";
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         120s;
        chunked_transfer_encoding  on;
        proxy_ignore_client_abort  off;   # propagate the client disconnect upstream → cancel the inference
        client_max_body_size       16k;
    }

    # M2.19G.1 (ADR-038): endpoint-originated operator validation. banzai-api resolves the target from
    # the closed registry and fetches the operator's public artifacts via banza-fetcher (Rust); these
    # routes carry only closed {operator_id, implementation_id, step} — no URLs.
    location = /banzai/validate/step {
        limit_req            zone=banzai_ask burst=5 nodelay;
        proxy_pass           http://banzai-api:8091/validate/step;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   65s;
        client_max_body_size 16k;
    }
    location = /banzai/validate/journey {
        limit_req            zone=banzai_ask burst=5 nodelay;
        proxy_pass           http://banzai-api:8091/validate/journey;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   120s;   # runs ~9 sequential endpoint fetches server-side
        client_max_body_size 16k;
    }
    # M2.19G.3B: canonical read endpoints — the closed Technical Registry catalogue + the supported
    # protocol option sets, sourced from the Rust registry (banza-target-registry). Read-only GETs, cached
    # (ETag + max-age=300); the Validar operador + Onboarding surfaces read the operator/implementation
    # list and the version/profile/environment options from here (Rust decides; TypeScript displays).
    location = /banzai/validate/registry {
        proxy_pass           http://banzai-api:8091/validate/registry;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   30s;
        client_max_body_size 1k;
    }
    location = /banzai/validate/options {
        proxy_pass           http://banzai-api:8091/validate/options;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   30s;
        client_max_body_size 1k;
    }
    # M2.19H (ADR-042): durable validation-receipt store — the consultable/comparable/reproducible surface.
    # Reads (executions/execution/compare) are workspace-scoped, digest-verified GETs; reproduce/cancel are
    # POSTs (reproduce re-runs the full secure pipeline server-side, so it gets the journey timeout). All
    # 404/503 safely when the store is disabled. Same closed-payload rule as the other validate routes.
    location = /banzai/validate/executions {
        proxy_pass           http://banzai-api:8091/validate/executions;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   30s;
        client_max_body_size 1k;
    }
    location = /banzai/validate/execution {
        proxy_pass           http://banzai-api:8091/validate/execution;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   30s;
        client_max_body_size 1k;
    }
    location = /banzai/validate/compare {
        proxy_pass           http://banzai-api:8091/validate/compare;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   30s;
        client_max_body_size 1k;
    }
    location = /banzai/validate/reproduce {
        limit_req            zone=banzai_ask burst=5 nodelay;
        proxy_pass           http://banzai-api:8091/validate/reproduce;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   120s;   # re-runs the full secure pipeline server-side
        client_max_body_size 16k;
    }
    location = /banzai/validate/cancel {
        limit_req            zone=banzai_ask burst=5 nodelay;
        proxy_pass           http://banzai-api:8091/validate/cancel;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   30s;
        client_max_body_size 4k;
    }
    # M2.19G.5C (ADR-042): public runtime SSOT — a secret-free, versioned projection of the runtime
    # state every human page consumes (where a page's prose and this route differ, the route wins).
    # Read-only GET, OUTSIDE the banzai_ask rate-limit zone; short public cache + weak content-hash
    # ETag (runtime state is volatile). The internal /health stays unproxied (404 publicly); this is
    # the one public runtime-state surface.
    location = /banzai/runtime {
        proxy_pass           http://banzai-api:8091/runtime;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   15s;
        client_max_body_size 1k;
    }

    # Increment 8 (§23): the public, read-only BanzAI SLO/metrics surface. GET only; secret-free numbers
    # only (p50/p95/p99 request latency, availability, error/fallback rate, %deterministic/%model, per-tool
    # availability + mean cost). Like /banzai/runtime it is OUTSIDE the banzai_ask rate-limit zone with a
    # short public cache + weak content-hash ETag (state is volatile). The internal /health stays unproxied.
    location = /banzai/slo {
        proxy_pass           http://banzai-api:8091/slo;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   15s;
        client_max_body_size 1k;
    }

    # M2.19G.3 (ADR-040): BanzAI-hosted operator onboarding — passwordless email-OTP login, a private
    # Candidate Registry, and .well-known origin proof. Same-origin prefix; the __Host- SameSite=Strict
    # session cookie and the Origin header pass through unchanged for the backend's session + CSRF
    # checks (banzai-api owns all rate limits and every security decision runs in Rust). No secrets on
    # this surface; the OTP is delivered only by email. The backend 404s the whole surface until
    # onboarding is enabled, so nothing is advertised prematurely.
    location /banzai/onboarding/ {
        limit_req            zone=banzai_ask burst=5 nodelay;
        proxy_pass           http://banzai-api:8091/onboarding/;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   65s;
        client_max_body_size 16k;
    }

    # Everything else → institutional website (includes /referencia and the /banzai UI).
    location / {
        proxy_pass         http://website:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── docs.banza.network → documentation (served by website /referencia or a docs build) ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.banza.network;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass         http://website:3005/referencia;   # or a dedicated docs service
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── banzai.banza.network → RETIRED (M2.8E) ───────────────────────────────────
# BanzAI is now a single public interface on the apex at banza.network/banzai (which calls
# banzai-api same-origin via /banzai/ask). The old subdomain no longer proxies to the backend;
# it 301-redirects to the unified interface so any stale link lands in the right place. The
# backend is never publicly reachable except through the apex /banzai/ask path above.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name banzai.banza.network;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://banza.network/banzai;
}

# ── zero.banza.network → Operador Zero interactive lab (M2.12E prepared, M2.12F active) ──
# ACTIVE — the subdomain serves the single-page Operador Zero lab (HTTP 200, no redirect to the apex).
# Activation (2026-07-22): a proxied DNS record for `zero` reaches this origin; the origin certificate
# (CloudFlare Origin CA, SAN *.banza.network) covers the host for Cloudflare Full; this server_name
# block is present in the runtime conf.d and the reverse proxy was reloaded. Before this block existed,
# an unknown SNI fell through to the first :443 server (www → apex), which is why zero previously 301'd
# to the apex — that was our own default server, not a Cloudflare rule. See
# docs/guides/OPERADOR_ZERO_SUBDOMAIN_ACTIVATION.md.
#
# There is NO routing logic here: nginx only proxies with Host preserved, and the website middleware
# (website/middleware.ts → resolveZeroRoute) does the host-aware rewrite — `/` → /operador-zero,
# `/<artifact>.json` → /operador-zero/<artifact>.json, /banzai → apex — so the apex and the subdomain
# reuse the same handlers and can never diverge. BanzAI is never proxied here: its backend stays
# reachable only through the apex /banzai/ask path above.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zero.banza.network;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # M2.19G.3A (ADR-040) — Operator Zero ORIGIN publishes its own .well-known ownership challenge from a
    # static file, INDEPENDENT of the verifier (banzai-api) and of the onboarding DB. An exact-match
    # `location =` outranks the website proxy, so this one URL is served by nginx (the OZ origin web
    # server) from a read-only mounted file: 200 + application/json when the operator has published a
    # challenge, 404 when absent, 405 for non-GET/HEAD. The nonce lives only in this published file; the
    # backend generates it and the secure Rust fetcher retrieves it over the public edge to verify.
    location = /.well-known/banza/ownership-challenge.json {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /etc/nginx/oz-well-known/ownership-challenge.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location / {
        proxy_pass         http://website:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
