# BANZA public security headers (Phase 7C — addresses the Phase 7A P2 finding).
#
# Loaded at the http{} level (nginx includes conf.d/*.conf inside http), so these
# headers are inherited by every server/location in banza.conf — apex, www, docs
# and banzai — because none of those blocks defines its own add_header. The
# `always` flag ensures they are also sent on redirects and error responses.
#
# Scope: security response headers only. No routing, upstream, TLS, cache, or
# content change. JSON machine routes receive the same headers (harmless).
#
# Content-Security-Policy is applied in REPORT-ONLY mode only (Phase 7K). Report-Only
# observes and reports violations without blocking, so it cannot break the Next.js
# runtime (inline styles/scripts, hydration) or the BanzAI chat's same-origin call
# (POST to the relative /banzai/ask; already covered by connect-src 'self' — the extra
# `https:` in connect-src is not required by the chat, M2.8E).
# ENFORCING Content-Security-Policy remains deferred until the report-only policy has
# been observed in production. No external report endpoint is configured (violations
# surface in the browser console) and no fake endpoint is added. X-Frame-Options: DENY
# below also blocks framing (equivalent to CSP frame-ancestors 'none').

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# Report-Only (observation) — NOT enforcing. Permissive enough for the current
# Next.js + BanzAI setup; tighten before ever switching to an enforcing
# Content-Security-Policy. Single line: nginx add_header does not span lines.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https:; upgrade-insecure-requests" always;
