# BANZA dedicated stack — protocol + BanzAI only. No operator logic.
# Deploy at /srv/banza-protocol/compose.yml. Secrets via .env (600, NOT in git).
# Images use FIXED tags (no :latest). PostgreSQL is NEVER published to the host.
name: banza-protocol

networks:
  banza-edge:      # reverse-proxy <-> apps
    driver: bridge
  banza-data:      # apps <-> postgres (isolated; no external routes)
    driver: bridge
    internal: true
  banza-inference: # banzai-api <-> llama-local ONLY (ADR-044; isolated; no postgres, no external routes)
    driver: bridge
    internal: true
  banza-fetch:     # banzai-api <-> banza-fetcher ONLY (ADR-068 §4.7); egress-enabled (NOT internal) so
    driver: bridge #                the fetcher can reach operator public HTTPS endpoints; never on banza-edge,
    #                               so the reverse-proxy cannot route to it and /fetch is never public.

volumes:
  pgdata:
  banzai-receipts-outbox:   # M2.19H/ADR-076 durable receipt outbox (survives banzai-api restarts)

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
      # M2.19G.3A (ADR-069): the Operador Zero ORIGIN publishes its own .well-known ownership challenge
      # from this read-only dir, served by nginx at zero.banza.network — INDEPENDENT of the verifier
      # (banzai-api) and of the onboarding DB. The dir holds only a published challenge file (a nonce the
      # backend generated and the operator chose to publish); it is created empty at deploy and is never
      # committed to Git. Absent file → 404 (no active challenge), which is the correct default.
      - ./nginx/oz-well-known:/etc/nginx/oz-well-known:ro
    networks: [banza-edge]
    depends_on: [website, verification-api, banzai-api]

  website:               # banza-protocol/banza — institutional site + /docs + /referencia
    # Prod: pull the fixed GHCR tag, or build locally with `docker compose build website`.
    # build.context uses ${BANZA_REPO} (default /srv/banza-protocol/repo) so the build
    # works from the runtime dir on the VM, not only from the repo tree. Local dev: set
    # BANZA_REPO to the repo root (e.g. `export BANZA_REPO=$(git rev-parse --show-toplevel)`).
    image: ghcr.io/banza-protocol/banza-website:${WEBSITE_TAG}
    build:
      context: ${BANZA_REPO:-/srv/banza-protocol/repo}/website
    restart: unless-stopped
    environment:
      PORT: "3005"                        # matches the image's server + healthcheck
    networks: [banza-edge]
    # no ports published; reverse-proxy reaches it by name on banza-edge

  verification-api:      # serves /.well-known/banza/*, /operators, BRL, /conformance/evidence
    image: ghcr.io/banza-protocol/banza-verification-api:${VERIFICATION_TAG}
    build:
      context: ${BANZA_REPO:-/srv/banza-protocol/repo}/services/verification-api
    restart: unless-stopped
    environment:
      PORT: "8090"
      DATABASE_URL: "postgres://banza_ro:${PG_RO_PASSWORD}@postgres:5432/banza_protocol?sslmode=disable"
      PROTOCOL_PHASE: "pre-production"   # drives honest JSON status on machine routes
    networks: [banza-edge, banza-data]
    depends_on: [postgres]

  banzai-api:            # RAG knowledge system (subordinate; cites sources; no prod keys)
    image: ghcr.io/banza-protocol/banzai-api:${BANZAI_TAG}
    build:
      context: ${BANZA_REPO:-/srv/banza-protocol/repo}/services/banzai-api
    restart: unless-stopped
    environment:
      PORT: "8091"
      DATABASE_URL: "postgres://banzai_rw:${PG_BANZAI_PASSWORD}@postgres:5432/banza_protocol?sslmode=disable"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"     # allowlist: mock | deepseek | qwen (hosted) | local_qwen (internal llama.cpp; ADR-044, benchmark-gated)
      LLM_API_BASE: "${LLM_API_BASE:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      # ADR-045: leave these UNSET by default so provider.js applies the per-destination
      # default (local_qwen → 256 tokens / 60s margin; hosted → 800 / 30s). Hardcoding a
      # value here would defeat the local default (the empty string is treated as unset).
      # An explicit LLM_TIMEOUT_MS / LLM_MAX_TOKENS in .env still flows through and wins.
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.2}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      BANZAI_MODE: "demo"                        # non-authoritative; explains, never certifies
      # SPR-4 §5: structured generation (model authors only the linguistic core; cited_source_ids derived
      # deterministically, ⊆ allowed). Activation-gated — set BANZAI_STRUCTURED_SYNTHESIS=1 in .env only
      # after the A/B harness passes (unset ⇒ byte-identical baseline). Activated on prod 2026-08-07.
      BANZAI_STRUCTURED_SYNTHESIS: "${BANZAI_STRUCTURED_SYNTHESIS:-}"
      # ADR-072: surfaced (non-secret) by GET /banzai/runtime → release/commit. Set BANZA_RELEASE in .env
      # (e.g. "v1.0") so the runtime SSOT reports the deployed protocol release instead of null.
      BANZA_RELEASE: "${BANZA_RELEASE:-}"
      BANZA_COMMIT: "${BANZA_COMMIT:-}"
      # cost control: deterministic → caches → budget gate → limited RAG → LLM
      BANZAI_ANSWER_MODE: "${BANZAI_ANSWER_MODE:-fast}"
      LLM_MAX_CHUNKS: "${LLM_MAX_CHUNKS:-3}"
      LLM_MAX_CONTEXT_CHARS: "${LLM_MAX_CONTEXT_CHARS:-6000}"
      LLM_DAILY_BUDGET_USD: "${LLM_DAILY_BUDGET_USD:-1.00}"
      LLM_MONTHLY_BUDGET_USD: "${LLM_MONTHLY_BUDGET_USD:-15.00}"
      LLM_COST_PER_1K_TOKENS_USD: "${LLM_COST_PER_1K_TOKENS_USD:-0.0005}"
      BANZAI_CACHE_MAX_ENTRIES: "${BANZAI_CACHE_MAX_ENTRIES:-500}"
      BANZAI_CACHE_TTL_MS: "${BANZAI_CACHE_TTL_MS:-86400000}"
      BANZAI_SEMANTIC_THRESHOLD: "${BANZAI_SEMANTIC_THRESHOLD:-0.92}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-60}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-60000}"
      BANZAI_TRUST_PROXY: "1"                    # rate-limit by X-Forwarded-For (behind nginx)
      # ADR-044 local inference (llama.cpp). Reaches llama-local by service name on the
      # internal net when the "llama-local" profile is active; benchmark-gated default.
      LLM_TOP_P: "${LLM_TOP_P:-}"                # conservative sampling for local_qwen (e.g. 0.8)
      BANZAI_MAX_CONCURRENCY: "${BANZAI_MAX_CONCURRENCY:-1}"  # local CPU inference: one at a time
      BANZAI_QUEUE_SIZE: "${BANZAI_QUEUE_SIZE:-1}"
      BANZAI_LOCAL_INFERENCE_ENABLED: "${BANZAI_LOCAL_INFERENCE_ENABLED:-false}"
      BANZAI_BENCHMARK_APPROVED: "${BANZAI_BENCHMARK_APPROVED:-false}"  # local_qwen default only after VPS XL+ benchmark
      # M2.18B.6 grounded synthesis — the single model call per explanation (Qwen2.5-7B). Rust resolves
      # intent, entity and retrieval deterministically; the model explains ONCE from the FactualPackage;
      # Rust validates before publishing. Allowlisted so the runtime config reaches the container; the
      # emergency grounding is the automatic fallback if the model is unavailable or the breaker trips.
      # (Any retired flag left in a stale .env is simply ignored by the service and never fails boot.)
      BANZAI_SYNTHESIS_MODEL: "${BANZAI_SYNTHESIS_MODEL:-}"
      BANZAI_SYNTHESIS_TIMEOUT_MS: "${BANZAI_SYNTHESIS_TIMEOUT_MS:-45000}"
      BANZAI_SYNTHESIS_AUTO_ROLLBACK: "${BANZAI_SYNTHESIS_AUTO_ROLLBACK:-0}"
      BANZAI_SYNTHESIS_ROLLBACK_WINDOW: "${BANZAI_SYNTHESIS_ROLLBACK_WINDOW:-30}"
      BANZAI_SYNTHESIS_ROLLBACK_MAX_ERROR_RATE: "${BANZAI_SYNTHESIS_ROLLBACK_MAX_ERROR_RATE:-0.2}"
      # M2.19G.1 / ADR-068 §4.7: the official validation journey fetches operator artifacts ONLY through
      # the secure Rust fetcher (banza-fetcher), reached by service name on the isolated banza-fetch net.
      FETCHER_URL: "${FETCHER_URL:-http://banza-fetcher:8092}"
      # M2.19G.3 / ADR-069 — BanzAI-hosted operator onboarding (email-OTP login, private Candidate
      # Registry, .well-known origin proof). OFF by default; enable only after the migration + secrets
      # are installed. Secrets (pepper, Resend key) follow the LLM_API_KEY pattern: empty default here,
      # injected from .env at deploy — NEVER committed, NEVER in the image, NEVER logged. Persistence
      # uses the banzai_rw DATABASE_URL above; onboarding writes only its own six tables (ADR-042).
      BANZAI_ONBOARDING_ENABLED: "${BANZAI_ONBOARDING_ENABLED:-0}"
      BANZAI_OTP_PEPPER: "${BANZAI_OTP_PEPPER:-}"                    # server-side HMAC pepper; secret
      ONBOARDING_EMAIL_PROVIDER: "${ONBOARDING_EMAIL_PROVIDER:-mock}"  # mock (offline) | resend
      RESEND_API_KEY: "${RESEND_API_KEY:-}"                         # Resend API key; secret, header-only
      ONBOARDING_EMAIL_FROM: "${ONBOARDING_EMAIL_FROM:-BanzAI <acesso@auth.banza.network>}"
      ONBOARDING_EMAIL_REPLY_TO: "${ONBOARDING_EMAIL_REPLY_TO:-contact@banza.network}"
      ONBOARDING_ALLOWED_ORIGINS: "${ONBOARDING_ALLOWED_ORIGINS:-https://banza.network,https://www.banza.network,https://zero.banza.network}"
      # M2.19H / ADR-076 — durable validation-journey receipt store (BanzAI Workbench). OFF by default;
      # enable only AFTER the M2_19H migration is applied (see docs/guides/M2_19H_VALIDATION_RECEIPTS_RUNBOOK.md).
      # Persistence is a fail-safe side-effect: a DB outage never breaks a validation — the receipt is
      # queued to the durable outbox volume below and retried. Uses the banzai_rw DATABASE_URL above;
      # writes only its six append-only receipt tables (ADR-042). No secrets, no funds, no model text.
      BANZAI_RECEIPTS_ENABLED: "${BANZAI_RECEIPTS_ENABLED:-0}"
      BANZAI_RECEIPTS_OUTBOX_DIR: "${BANZAI_RECEIPTS_OUTBOX_DIR:-/var/lib/banzai/receipts-outbox}"
    volumes:
      # Durable outbox for the receipt store: survives restarts so a receipt queued during a DB outage is
      # retried after recovery (never lost, never faked). Local-only; holds queued canonical payloads.
      - banzai-receipts-outbox:/var/lib/banzai/receipts-outbox
    networks: [banza-edge, banza-data, banza-inference, banza-fetch]
    depends_on: [postgres]

  banza-fetcher:         # M2.19G.1 (ADR-068 §4.7) — SSRF-hardened Rust artifact fetcher. The ONLY BANZA
    # component that reaches operator public endpoints; banzai-api calls it by service name. NO published
    # ports (never routed by the reverse-proxy); egress-enabled via banza-fetch so it can reach operator
    # HTTPS. The no-network protocol engines stay no-network and receive already-fetched content.
    image: ghcr.io/banza-protocol/banza-fetcher:${FETCHER_TAG:-v0.1.0}
    build:
      context: ${BANZA_REPO:-/srv/banza-protocol/repo}/engines/banza-artifact-fetcher
    restart: unless-stopped
    environment:
      FETCHER_PORT: "8092"
    networks: [banza-fetch]
    healthcheck:
      test: ["CMD", "/usr/local/bin/banza-fetcher", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5

  # ADR-044 — OPT-IN local inference (llama.cpp, CPU). OFF by default (compose profile);
  # internal-only (no published ports), no GPU, no keys, model mounted read-only from a
  # gitignored volume that is NEVER downloaded during build. banzai-api reaches it by
  # service name at http://llama-local:8080/v1 only when LLM_PROVIDER=local_qwen. It is
  # NOT in banzai-api's depends_on (that would auto-enable the profile and defeat the gate).
  llama-local:
    # Pinned by digest (ADR-045 FIX-6) — the exact image the VPS XL+ benchmark validated,
    # honouring the stack's "fixed tags, no :latest" rule (line 3). The rolling `:server`
    # tag could silently swap the runtime base (e.g. drop curl, breaking the healthcheck).
    # Override LLAMA_LOCAL_IMAGE only with another digest-pinned reference.
    image: ${LLAMA_LOCAL_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:b832a7b7252a90a79a1e8d23d9be3ac5261a33224f60682dff0cade412fa55d3}
    restart: unless-stopped
    profiles: ["llama-local"]                    # off by default → stack stays hosted/mock
    command: >
      --host 0.0.0.0 --port 8080
      -m ${LLAMA_MODEL_PATH:-/models/model.gguf}
      -c ${LLAMA_CTX_SIZE:-4096} -t ${LLAMA_THREADS:-4}
      -fa ${LLAMA_FLASH_ATTN:-on}
      --no-webui
    volumes:
      - ./models:/models:ro                      # gitignored; .gguf lives outside Git, installed manually
    networks: [banza-inference]                  # isolated: banzai-api reaches it; postgres/host/internet cannot
    # NO ports: — never exposed to host or internet (same rule as postgres)
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "${LLAMA_CPU_LIMIT:-4.0}"
          memory: ${LLAMA_MEM_LIMIT:-7g}         # bounded so the model can never OOM the host
    healthcheck:
      # curl is present in the llama.cpp image — ADR-045 fix (the prior check used a binary
      # absent from the image). /health returns 503 while the model loads and 200 once ready,
      # so this reflects real model readiness.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s                          # generous: CPU model load + first-token warm-up
      retries: 5

  postgres:              # dedicated, internal-only
    # pgvector/pgvector:pg16 = PostgreSQL 16 WITH the `vector` extension the schema
    # requires (banzai_chunk.embedding + hnsw index). Plain postgres:16-alpine lacks it
    # and would fail on first init.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: banza_protocol
      POSTGRES_USER: banza_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # schema + roles on first init
    networks: [banza-data]
    # NO ports: — never exposed to host or internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banza_admin -d banza_protocol"]
      interval: 15s
      timeout: 5s
      retries: 5
