name: Rust Engines

# Builds and tests the official Rust engines under engines/ (ADR-043). Each crate must pass
# cargo fmt, clippy (-D warnings) and cargo test. No network, no provider.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: rust-engines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banzai-evidence:
    name: banzai-evidence (R2 engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: cargo fmt
        working-directory: engines/banzai-evidence
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: engines/banzai-evidence
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: engines/banzai-evidence
        run: cargo test
      - name: engine CLI check (corpus URLs + no forbidden claim + no rogue link)
        working-directory: engines/banzai-evidence
        run: cargo run --quiet -- check

  banzai-query-core:
    name: banzai-query-core
