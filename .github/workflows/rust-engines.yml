        run: cargo fmt --check
      - name: cargo clippy (default + wasm feature)
        working-directory: engines/banzai-onboarding
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features wasm -- -D warnings
      - name: cargo test
        working-directory: engines/banzai-onboarding
        run: cargo test

