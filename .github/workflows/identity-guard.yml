    name: BanzAI architecture manifest (parity with §12 + terminology invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The canonical architecture manifest (website/content/banzai/architecture-manifest.json) is the
      # structured consistency contract behind §12: it must agree with the chapter (canonical phrase, the
      # two diagrams, the 9-row authority matrix, the 3 provenance levels) and it enforces the four §3
      # terminology invariants — primary+transversal interface present, zero mandatory-interface claims,
      # protocol works without the BanzAI, direct public interfaces present. Uses node (no jq).
      # Same as `make banzai-architecture-manifest-check`.
      - name: BanzAI architecture manifest guard
        run: bash tools/check-banzai-architecture-manifest.sh

      # M2.19G.6 (ADR-042) — BanzAI consolidated into this monorepo as the SOLE active source; the
      # separate banza-protocol/banzai repo is being permanently removed. Proves no legacy/ snapshot or second BanzAI
      # workspace/API in HEAD; engines/banzai-trace + in-monorepo trace WASM; repo-indexer has no
      # sibling remote and the manifest declares banzai_in_monorepo with zero embedded banzai chunks;
      # ADR-042 present. Pure node+bash (reads the committed manifest + files; no WASM build needed).
      # Same as `make banzai-monorepo-consolidation-check`.
      - name: BanzAI monorepo consolidation guard
        run: bash tools/check-banzai-monorepo-consolidation.sh

  git-authorship-identity:
    name: Git authorship identity guard (no Claude attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # M2.19G.6B — blocks any NEW commit authored/committed as Claude/Anthropic, or carrying a
      # `Co-authored-by:`/`Signed-off-by:` Claude trailer, from entering BANZA. Inspects commit METADATA
      # and authorship TRAILERS only (base..HEAD) — never file content, so CLAUDE.md and docs mentioning
      # Claude are not flagged. Fail-closed if the PR range is indeterminate. `make git-authorship-identity-check`.
      - name: Git authorship identity guard — self-test
        run: bash tools/check-git-authorship-identity.sh --self-test
      - name: Git authorship identity guard — new commits
        run: |
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --quiet origin "$base" || true
          GIT_AUTHORSHIP_BASE="origin/$base" bash tools/check-git-authorship-identity.sh

