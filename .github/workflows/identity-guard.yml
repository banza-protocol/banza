  # (ADR-042); the post-synthesis authority validator is a mandatory publish gate (ADR-042); SimB is
  # retired from active surfaces (ADR-042). Each guard is the SAME script as its `make …` target.

  banzai-post-synthesis-validation:
    name: mandatory post-synthesis authority validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ADR-042 — postValidate gates the grounded publish path (after synthesis, before groundedAnswer /
      # cache writes / return), emits a stable post_validation_ fallback reason, and drives the honest
      # three-state validation_status. Self-tests every run. Same as `make banzai-post-synthesis-validation-check`.
      - name: Post-synthesis validation gate guard
        run: bash tools/check-banzai-post-synthesis-validation.sh

  banzai-runtime-ssot:
    name: runtime SSOT /banzai/runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ADR-042 — one secret-free public /banzai/runtime route in every apex nginx conf; the projection
      # carries schema_version + authoritative:false and leaks no secrets; /estado consumes the route and
      # never hardcodes the live engine. Self-tests every run. Same as `make banzai-runtime-ssot-check`.
      - name: Runtime SSOT guard
        run: bash tools/check-banzai-runtime-ssot.sh

