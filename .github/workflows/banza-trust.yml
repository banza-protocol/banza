name: banza-trust

# Builds and tests the Rust trust verifier (ADR-043, R5): cargo fmt/clippy/test + golden ed25519
# parity (Rust verifies real signatures produced by the Python trust root's ADR-027 scheme).
# Verification only — no signing, no key generation, no production keys, no secrets, no network.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: banza-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banza-trust:
    name: banza-trust (R5 verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: cargo fmt
        working-directory: engines/banza-trust
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: engines/banza-trust
        run: cargo clippy --all-targets -- -D warnings
      - name: normative surface integrity (ADR-009/082)
        working-directory: .
        run: bash tools/check-normative-surface-integrity.sh
      - name: execution semantics — reason codes + idempotency (ADR-023/084)
        working-directory: .
        run: bash tools/check-execution-semantics.sh
      - name: normative surface is navigable from outside (Phase D)
        working-directory: .
        run: bash tools/check-normative-discoverability.sh
      - name: clean-room export is safe to hand out (Phase E)
        working-directory: .
        run: bash tools/check-clean-room-package.sh
      - name: related work stays informative and bounded
        working-directory: .
        run: bash tools/check-related-work-boundary.sh
      - name: root authorization model is 2-of-3, one model everywhere
        working-directory: .
        run: bash tools/check-root-threshold-model.sh
      - name: cargo test (root ceremony — threshold accept/reject matrix)
        working-directory: engines/banza-root-ceremony
        run: cargo test
      - name: cargo test (golden ed25519 parity + TEST-ONLY signing/ceremony)
        working-directory: engines/banza-trust
        run: cargo test
      - name: ceremony-simulate + ceremony-check (TEST ONLY, no production state)
        working-directory: engines/banza-trust
        run: |
          cargo run --quiet -- ceremony-simulate > /dev/null
          cargo run --quiet -- ceremony-check > /dev/null
