  <!-- Fontes e ferramentas -->
  <rect x="90" y="356" width="200" height="128" rx="10" fill="#EAF3EC" stroke="#2E6A4E" stroke-width="1.6"/>
  <text x="190" y="382" text-anchor="middle" font-size="11" font-weight="800" fill="#1D4A34">Fontes e ferramentas</text>
  <text x="190" y="408" text-anchor="middle" font-size="8.5" fill="#2E6A4E">fontes → factos e citações</text>
  <text x="190" y="430" text-anchor="middle" font-size="8.5" fill="#2E6A4E">motores → resultados técnicos</text>
  <text x="190" y="452" text-anchor="middle" font-size="8" fill="#6B6265">obtenção segura → snapshot</text>
  <text x="190" y="468" text-anchor="middle" font-size="8" fill="#6B6265">por contrato tipado</text>

  <!-- FactualPackage -->
  <rect x="336" y="356" width="200" height="128" rx="10" fill="#EAF3EC" stroke="#2E6A4E" stroke-width="2"/>
  <text x="436" y="382" text-anchor="middle" font-size="11" font-weight="800" fill="#1D4A34">FactualPackage</text>
  <text x="436" y="404" text-anchor="middle" font-size="8.5" fill="#2E6A4E">a evidência fechada</text>
  <text x="436" y="424" text-anchor="middle" font-size="8.5" fill="#2E6A4E">factos · citações · resultados</text>
  <text x="436" y="440" text-anchor="middle" font-size="8.5" fill="#2E6A4E">reason codes · âmbito</text>
  <text x="436" y="456" text-anchor="middle" font-size="8.5" fill="#2E6A4E">fronteiras · proveniência</text>
  <text x="436" y="474" text-anchor="middle" font-size="8" fill="#6B6265">só factos autorizados</text>

  <!-- Modo de resposta (bifurcation) -->
