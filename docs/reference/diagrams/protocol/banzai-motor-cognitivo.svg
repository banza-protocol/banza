<svg viewBox="0 0 1320 748" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P101 desc-P101"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P101">Processamento cognitivo de uma solicitação</title>
  <desc id="desc-P101">Perspectiva interna do motor cognitivo do BanzAI. Uma solicitação percorre um caminho determinístico em Rust: pedido, normalização, contexto, âmbito, guardas, planeamento, fontes e ferramentas, FactualPackage, modo de resposta, verificação final e resposta citada. As fontes devolvem factos e citações; as ferramentas e motores do protocolo devolvem resultados técnicos. O FactualPackage é a evidência fechada. No modo de resposta, um template determinístico ou, opcionalmente, o modelo de linguagem local produz um rascunho explicativo — nunca a resposta final. A verificação final, obrigatória e em Rust, confere afirmações, autoridade, citações, consistência com os motores, limites, política e cobertura factual antes de publicar a resposta citada e não autoritativa. O caminho directo utilizador para modelo para resposta é rejeitado por construção: o modelo nunca responde sem a verificação.</desc>
  <defs>
    <linearGradient id="hg-P101" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P101" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#B98A3E"/></marker>
    <marker id="arrx-P101" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#B0332C"/></marker>
  </defs>

  <rect width="1320" height="748" fill="#F8F4EC"/>

  <!-- Header -->
  <rect x="0" y="0" width="1320" height="70" fill="url(#hg-P101)" rx="14"/>
  <rect x="0" y="52" width="1320" height="18" fill="#8E1326"/>
  <text x="28" y="30" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#FECACA" letter-spacing="2">SVG-P-101 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="28" y="54" font-size="20" font-weight="800" fill="white">Processamento cognitivo de uma solicitação</text>
  <text x="1292" y="54" text-anchor="end" font-size="11" fill="#FECACA">o motor cognitivo do BanzAI, passo a passo</text>

  <!-- Principle band -->
