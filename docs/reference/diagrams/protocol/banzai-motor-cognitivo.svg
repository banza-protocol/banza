    <text x="960" y="206" text-anchor="middle" font-size="8.5" fill="#6D5F86">autoridade · política</text>
    <text x="960" y="222" text-anchor="middle" font-size="8.5" fill="#6D5F86">privacidade · escopo</text>
    <text x="960" y="238" text-anchor="middle" font-size="8.5" fill="#6D5F86">segurança · fronteiras</text>

    <rect x="1070" y="150" width="180" height="104" rx="10" fill="#F4F6F9" stroke="#3C4654" stroke-width="1.5"/>
    <text x="1160" y="182" text-anchor="middle" font-size="11.5" font-weight="800" fill="#2A2E35">Planeamento</text>
    <text x="1160" y="206" text-anchor="middle" font-size="8.5" fill="#54595F">fontes · ferramentas</text>
    <text x="1160" y="222" text-anchor="middle" font-size="8.5" fill="#54595F">sequência · modo</text>
    <text x="1160" y="238" text-anchor="middle" font-size="8.5" fill="#54595F">precisa de modelo?</text>
  </g>

  <!-- row1 arrows -->
  <line x1="250" y1="202" x2="270" y2="202" stroke="#B98A3E" stroke-width="2.2" marker-end="url(#arr-P101)"/>
  <line x1="450" y1="202" x2="470" y2="202" stroke="#B98A3E" stroke-width="2.2" marker-end="url(#arr-P101)"/>
