  <text x="948" y="406" text-anchor="middle" font-size="8.5" fill="#54595F">afirmações · autoridade</text>
  <text x="948" y="424" text-anchor="middle" font-size="8.5" fill="#54595F">citações · consistência</text>
  <text x="948" y="442" text-anchor="middle" font-size="8.5" fill="#54595F">limites · política · cobertura</text>
  <text x="948" y="466" text-anchor="middle" font-size="8" fill="#6B6265">obrigatória, em Rust · ADR-036</text>

