    <text x="160" y="222" text-anchor="middle" font-size="8.5" fill="#8A6A1E">sessão · operador</text>
    <text x="160" y="238" text-anchor="middle" font-size="8.5" fill="#8A6A1E">implementação</text>

    <rect x="270" y="150" width="180" height="104" rx="10" fill="#F4F6F9" stroke="#3C4654" stroke-width="1.5"/>
    <text x="360" y="182" text-anchor="middle" font-size="11.5" font-weight="800" fill="#2A2E35">Normalização</text>
    <text x="360" y="206" text-anchor="middle" font-size="8.5" fill="#54595F">idioma · intenção</text>
    <text x="360" y="222" text-anchor="middle" font-size="8.5" fill="#54595F">referências · escopo</text>
    <text x="360" y="238" text-anchor="middle" font-size="8.5" fill="#54595F">comandos · adversarial</text>

    <rect x="470" y="150" width="180" height="104" rx="10" fill="#F4F6F9" stroke="#3C4654" stroke-width="1.5"/>
