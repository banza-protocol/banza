    <text x="560" y="222" text-anchor="middle" font-size="8.5" fill="#54595F">perfil · ambiente</text>
    <text x="560" y="238" text-anchor="middle" font-size="8.5" fill="#54595F">resultado em análise</text>

    <rect x="670" y="150" width="180" height="104" rx="10" fill="#F4F6F9" stroke="#3C4654" stroke-width="1.5"/>
