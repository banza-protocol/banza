  <rect x="826" y="556" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#8E1326" stroke-width="1.4"/>
  <text x="886" y="582" text-anchor="middle" font-size="10" font-weight="700" fill="#8E1326">Resposta</text>
  <text x="1120" y="582" text-anchor="middle" font-size="9" fill="#8E1326">rejeitado por construção</text>

  <!-- Note -->
  <text x="660" y="656" text-anchor="middle" font-size="9.5" fill="#6B6265">O modelo é opcional e subordinado; a resposta final é sempre fundamentada e verificada em Rust. O primeiro diagrama mostra a posição; este, o motor cognitivo.</text>

