    <text x="760" y="206" text-anchor="middle" font-size="8.5" fill="#54595F">operador seleccionado</text>
    <text x="760" y="222" text-anchor="middle" font-size="8.5" fill="#54595F">implementação</text>
    <text x="760" y="238" text-anchor="middle" font-size="8.5" fill="#54595F">seleccionada</text>

