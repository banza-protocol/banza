<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P067 desc-P067"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P067">Protocolo Aberto — Visão Geral</title>
  <desc id="desc-P067">Visão geral do modelo aberto do protocolo BANZA numa cadeia horizontal de quatro etapas. Protocolo: o protocolo financeiro aberto define specs, contratos e invariantes. Operadores: operadores independentes implementam o protocolo na sua própria infraestrutura e publicam manifests. Evidência: a conformidade é demonstrada por conformance evidence e um evidence bundle verificável por máquina. Avaliação de Trust: o trust é avaliado por signed protocol metadata, delegated signing keys, public protocol registry e revocation/fail-closed. Humanos mantêm e evoluem o protocolo; não autorizam, aceitam, aprovam ou certificam operadores.</desc>
  <defs>
    <linearGradient id="hg-P067" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P067" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6B7280"/>
    </marker>
    <filter id="sh-P067">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000014"/>
    </filter>
  </defs>

  <rect width="1000" height="470" fill="#F4F1EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#hg-P067)" rx="14"/>
  <rect x="0" y="48" width="1000" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-067 · OPEN FINANCIAL PROTOCOL</text>
  <text x="24" y="47" font-size="18" font-weight="800" fill="white">Protocolo Aberto — Visão Geral</text>
  <text x="976" y="47" text-anchor="end" font-size="10.5" fill="#FECACA">Protocolo · Operadores · Evidência · Trust</text>

  <!-- Lead -->
  <text x="500" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">BANZA é um protocolo financeiro aberto para interoperabilidade, conformidade e evidência verificável em pagamentos.</text>
  <text x="500" y="112" text-anchor="middle" font-size="10.5" fill="#6B6265">Quatro camadas, um sentido: o protocolo é implementado por operadores, demonstrado por evidência e avaliado por trust verificável.</text>

  <!-- Stage 1 — Protocolo -->
  <rect x="40" y="150" width="200" height="150" fill="white" rx="12" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh-P067)"/>
  <rect x="40" y="150" width="200" height="32" fill="#8E1326" rx="12"/><rect x="40" y="166" width="200" height="16" fill="#8E1326"/>
  <text x="140" y="171" text-anchor="middle" font-size="12" font-weight="800" fill="white">Protocolo</text>
  <text x="140" y="206" text-anchor="middle" font-size="10" fill="#374151">protocolo financeiro aberto</text>
  <text x="140" y="228" text-anchor="middle" font-size="9.5" fill="#6B6265">specs · contratos OpenAPI</text>
  <text x="140" y="244" text-anchor="middle" font-size="9.5" fill="#6B6265">invariantes financeiros</text>
  <text x="140" y="260" text-anchor="middle" font-size="9.5" fill="#6B6265">conjunto de conformidade</text>
  <text x="140" y="285" text-anchor="middle" font-size="9" font-style="italic" fill="#8E1326">define as regras</text>

  <!-- Stage 2 — Operadores -->
  <rect x="280" y="150" width="200" height="150" fill="white" rx="12" stroke="#BFDBFE" stroke-width="1.5" filter="url(#sh-P067)"/>
  <rect x="280" y="150" width="200" height="32" fill="#1E40AF" rx="12"/><rect x="280" y="166" width="200" height="16" fill="#1E40AF"/>
  <text x="380" y="171" text-anchor="middle" font-size="12" font-weight="800" fill="white">Operadores</text>
  <text x="380" y="206" text-anchor="middle" font-size="10" fill="#374151">operadores independentes</text>
  <text x="380" y="228" text-anchor="middle" font-size="9.5" fill="#6B6265">implementam na própria infra</text>
  <text x="380" y="244" text-anchor="middle" font-size="9.5" fill="#6B6265">publicam manifests</text>
  <text x="380" y="260" text-anchor="middle" font-size="9.5" fill="#6B6265">sem pedir permissão</text>
  <text x="380" y="285" text-anchor="middle" font-size="9" font-style="italic" fill="#1E40AF">operator self-publication</text>

  <!-- Stage 3 — Evidência -->
  <rect x="520" y="150" width="200" height="150" fill="white" rx="12" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh-P067)"/>
  <rect x="520" y="150" width="200" height="32" fill="#166534" rx="12"/><rect x="520" y="166" width="200" height="16" fill="#166534"/>
  <text x="620" y="171" text-anchor="middle" font-size="12" font-weight="800" fill="white">Evidência</text>
  <text x="620" y="206" text-anchor="middle" font-size="10" fill="#374151">evidência verificável</text>
  <text x="620" y="228" text-anchor="middle" font-size="9.5" fill="#6B6265">conformance evidence</text>
  <text x="620" y="244" text-anchor="middle" font-size="9.5" fill="#6B6265">evidence bundle</text>
  <text x="620" y="260" text-anchor="middle" font-size="9.5" fill="#6B6265">verificável por máquina</text>
  <text x="620" y="285" text-anchor="middle" font-size="9" font-style="italic" fill="#166534">reproduzível por qualquer um</text>

  <!-- Stage 4 — Avaliação de Trust -->
  <rect x="760" y="150" width="200" height="150" fill="white" rx="12" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh-P067)"/>
  <rect x="760" y="150" width="200" height="32" fill="#1F2937" rx="12"/><rect x="760" y="166" width="200" height="16" fill="#1F2937"/>
  <text x="860" y="171" text-anchor="middle" font-size="12" font-weight="800" fill="white">Avaliação de Trust</text>
  <text x="860" y="206" text-anchor="middle" font-size="10" fill="#374151">avaliada por evidência</text>
  <text x="860" y="228" text-anchor="middle" font-size="9.5" fill="#6B6265">signed protocol metadata</text>
  <text x="860" y="244" text-anchor="middle" font-size="9.5" fill="#6B6265">delegated keys · registry</text>
  <text x="860" y="260" text-anchor="middle" font-size="9.5" fill="#6B6265">revocation · fail-closed</text>
  <text x="860" y="285" text-anchor="middle" font-size="9" font-style="italic" fill="#1F2937">status em Rust</text>

  <!-- Arrows -->
  <line x1="240" y1="225" x2="278" y2="225" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr-P067)"/>
  <line x1="480" y1="225" x2="518" y2="225" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr-P067)"/>
  <line x1="720" y1="225" x2="758" y2="225" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr-P067)"/>

  <!-- Boundary note -->
  <rect x="40" y="330" width="920" height="82" rx="10" fill="#FEF2F2" stroke="#991B1B" stroke-width="2"/>
  <text x="500" y="356" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1F2937">O trust do protocolo é avaliado por signed protocol metadata, delegated signing keys, public protocol registry e revocation/fail-closed.</text>
  <text x="500" y="378" text-anchor="middle" font-size="10.5" fill="#374151">Humanos mantêm e evoluem o protocolo; não autorizam, aceitam, aprovam ou certificam operadores.</text>
  <text x="500" y="398" text-anchor="middle" font-size="10" fill="#6B6265">Um PASS técnico é evidência verificável de conformidade, não aprovação humana, licença ou certificação.</text>

  <!-- Footer -->
  <text x="500" y="450" text-anchor="middle" font-size="9.5" fill="#9CA3AF">SVG-P-067 · Protocolo Aberto — Visão Geral · BANZA Protocol · M2.5 · 2026-07-18</text>
</svg>
