<svg viewBox="0 0 1320 812" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P100 desc-P100"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P100">BanzAI no protocolo</title>
  <desc id="desc-P100">Perspectiva externa do BanzAI no protocolo BANZA. Os utilizadores humanos falam com o BanzAI, a interface humana e o motor cognitivo não autoritativo, cuja mediação está delimitada por uma fronteira: dentro ficam a interface, o motor cognitivo, o modelo de linguagem local opcional e a verificação da resposta. O BanzAI lê e cita as fontes do protocolo, invoca por contrato tipado as ferramentas e motores do protocolo — que executam, decidem e devolvem resultados e códigos — e apresenta a evidência formal que esses motores produzem e selam. Fora da sua autoridade ficam as fontes, os motores, a evidência e os destinos externos: a publicação opcional no Registo Técnico pelo operador, a verificação pelos pares, a federação, a admissão a esquemas e a autorização pelos reguladores. Em paralelo, um consumidor automático acede directamente às interfaces públicas, aos motores e à evidência, sem passar pelo BanzAI — o protocolo é verificável sem ele.</desc>
  <defs>
    <linearGradient id="hg-P100" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P100" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#B98A3E"/></marker>
    <marker id="arrs-P100" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#3C4654"/></marker>
    <marker id="arrt-P100" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0F766E"/></marker>
    <marker id="arrx-P100" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8E1326"/></marker>
  </defs>

  <rect width="1320" height="812" fill="#F8F4EC"/>

  <!-- Header -->
  <rect x="0" y="0" width="1320" height="70" fill="url(#hg-P100)" rx="14"/>
  <rect x="0" y="52" width="1320" height="18" fill="#8E1326"/>
  <text x="28" y="30" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#FECACA" letter-spacing="2">SVG-P-100 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="28" y="54" font-size="20" font-weight="800" fill="white">BanzAI no protocolo</text>
  <text x="1292" y="54" text-anchor="end" font-size="11" fill="#FECACA">onde está · com quem comunica · o que fica fora</text>

  <!-- Principle band -->
  <rect x="0" y="72" width="1320" height="26" fill="#EAEFF4"/>
  <text x="660" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#2E4054">O BanzAI guia · os motores verificam · a evidência prova · a autoridade competente decide.</text>

  <!-- Fontes do protocolo (top) -->
  <rect x="380" y="110" width="560" height="78" rx="11" fill="#EAF3EC" stroke="#2E6A4E" stroke-width="1.6"/>
  <text x="660" y="136" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1D4A34">Fontes do protocolo</text>
  <text x="660" y="155" text-anchor="middle" font-size="9.5" fill="#2E6A4E">Referência · perfis · contratos · esquemas · ADRs · RFCs · releases</text>
  <text x="660" y="174" text-anchor="middle" font-size="8.5" fill="#2E6A4E">três níveis de autoridade: normativas · governação e racional · informativas</text>

  <!-- BanzAI → Fontes -->
  <line x1="520" y1="232" x2="520" y2="190" stroke="#B98A3E" stroke-width="2.2" marker-end="url(#arr-P100)"/>
  <text x="560" y="214" font-size="8.5" fill="#7A5212">lê e cita</text>

  <!-- Utilizadores humanos (left) -->
  <rect x="40" y="250" width="210" height="210" rx="11" fill="#F6EBD8" stroke="#E6D29A" stroke-width="1.6"/>
  <text x="145" y="282" text-anchor="middle" font-size="12" font-weight="800" fill="#7A5212">Utilizadores humanos</text>
  <text x="145" y="308" text-anchor="middle" font-size="9.5" fill="#8A6A1E">utilizador</text>
  <text x="145" y="328" text-anchor="middle" font-size="9.5" fill="#8A6A1E">operador</text>
  <text x="145" y="348" text-anchor="middle" font-size="9.5" fill="#8A6A1E">implementador</text>
  <text x="145" y="368" text-anchor="middle" font-size="9.5" fill="#8A6A1E">auditor</text>
  <text x="145" y="388" text-anchor="middle" font-size="9.5" fill="#8A6A1E">regulador — consumidor</text>
  <text x="145" y="408" text-anchor="middle" font-size="9.5" fill="#8A6A1E">par</text>
  <text x="145" y="440" text-anchor="middle" font-size="8.5" fill="#9A6B1E">iniciam · interpretam</text>

  <!-- Utilizador ↔ BanzAI -->
  <line x1="250" y1="332" x2="298" y2="332" stroke="#B98A3E" stroke-width="2.2" marker-end="url(#arr-P100)"/>
  <text x="274" y="324" text-anchor="middle" font-size="8" fill="#7A5212">pergunta</text>
  <line x1="298" y1="392" x2="250" y2="392" stroke="#3C4654" stroke-width="2.2" marker-end="url(#arrs-P100)"/>
  <text x="274" y="384" text-anchor="middle" font-size="8" fill="#3C4654">explica</text>

  <!-- BanzAI mediation boundary (center) -->
  <rect x="300" y="232" width="356" height="292" rx="12" fill="#EEEBF2" stroke="#8E1326" stroke-width="2"/>
  <text x="316" y="252" font-family="ui-monospace,'Courier New',monospace" font-size="9.5" fill="#8E1326" letter-spacing="0.5">MEDIAÇÃO DO BanzAI — não autoritativa</text>
  <text x="316" y="278" font-size="15" font-weight="800" fill="#2E4054">BanzAI</text>
  <text x="316" y="294" font-size="9" fill="#54595F">interface humana · motor cognitivo próprio</text>

  <rect x="314" y="304" width="164" height="94" rx="8" fill="#F4F6F9" stroke="#3C4654" stroke-width="1.2"/>
  <text x="396" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#2A2E35">interface humana</text>
  <text x="396" y="352" text-anchor="middle" font-size="8.5" fill="#54595F">consultar · validar</text>
  <text x="396" y="366" text-anchor="middle" font-size="8.5" fill="#54595F">num só lugar</text>

  <rect x="486" y="304" width="164" height="94" rx="8" fill="#F4F6F9" stroke="#3C4654" stroke-width="1.2"/>
  <text x="568" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#2A2E35">motor cognitivo</text>
  <text x="568" y="352" text-anchor="middle" font-size="8.5" fill="#54595F">determinístico, em Rust</text>
  <text x="568" y="366" text-anchor="middle" font-size="8.5" fill="#54595F">intenção → verificação</text>

  <rect x="314" y="406" width="164" height="94" rx="8" fill="#E3EAF1" stroke="#2E4054" stroke-width="1.2"/>
  <text x="396" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#2E4054">modelo local</text>
  <text x="396" y="454" text-anchor="middle" font-size="8.5" fill="#54595F">opcional · redige</text>
  <text x="396" y="468" text-anchor="middle" font-size="8.5" fill="#54595F">não decide</text>

  <rect x="486" y="406" width="164" height="94" rx="8" fill="#F4F6F9" stroke="#3C4654" stroke-width="1.2"/>
  <text x="568" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#2A2E35">verificação</text>
  <text x="568" y="454" text-anchor="middle" font-size="8.5" fill="#54595F">afirmações · autoridade</text>
  <text x="568" y="468" text-anchor="middle" font-size="8.5" fill="#54595F">citações</text>

  <!-- BanzAI ↔ Ferramentas -->
  <line x1="656" y1="298" x2="718" y2="298" stroke="#B98A3E" stroke-width="2.2" marker-end="url(#arr-P100)"/>
  <text x="687" y="290" text-anchor="middle" font-size="8" fill="#7A5212">invoca</text>
  <line x1="718" y1="338" x2="656" y2="338" stroke="#3C4654" stroke-width="2.2" marker-end="url(#arrs-P100)"/>
  <text x="687" y="352" text-anchor="middle" font-size="8" fill="#3C4654">resultados</text>

  <!-- Evidência → BanzAI -->
  <line x1="718" y1="452" x2="656" y2="452" stroke="#3C4654" stroke-width="2.2" marker-end="url(#arrs-P100)"/>
  <text x="687" y="444" text-anchor="middle" font-size="8" fill="#3C4654">apresenta</text>

  <!-- Ferramentas e motores (right of center) -->
  <rect x="720" y="250" width="292" height="118" rx="11" fill="#EEECEA" stroke="#3C4654" stroke-width="1.8"/>
  <text x="866" y="278" text-anchor="middle" font-size="11" font-weight="800" fill="#2A2E35">Ferramentas e motores do protocolo</text>
  <text x="866" y="298" text-anchor="middle" font-size="9" fill="#54595F">obtenção segura · motores Rust/WASM</text>
  <text x="866" y="315" text-anchor="middle" font-size="9" fill="#54595F">verificadores · resultados técnicos</text>
  <text x="866" y="338" text-anchor="middle" font-size="8.5" fill="#6B6265">executam e decidem · fora da autoridade do BanzAI</text>
  <text x="866" y="354" text-anchor="middle" font-size="8.5" fill="#6B6265">invocados por contrato tipado</text>

  <!-- Ferramentas → Evidência -->
  <line x1="866" y1="368" x2="866" y2="396" stroke="#3C4654" stroke-width="2.2" marker-end="url(#arrs-P100)"/>
  <text x="908" y="386" font-size="8" fill="#3C4654">selam</text>

  <!-- Evidência formal -->
  <rect x="720" y="398" width="292" height="110" rx="11" fill="#EAF3EC" stroke="#2E6A4E" stroke-width="1.8"/>
  <text x="866" y="426" text-anchor="middle" font-size="12" font-weight="800" fill="#1D4A34">Evidência formal</text>
  <text x="866" y="446" text-anchor="middle" font-size="9" fill="#2E6A4E">resultados · veredictos · reason codes</text>
  <text x="866" y="463" text-anchor="middle" font-size="9" fill="#2E6A4E">recibos · Pacote de Evidências</text>
  <text x="866" y="485" text-anchor="middle" font-size="8.5" fill="#2E6A4E">produzida pelos motores — nunca pelo modelo</text>
  <text x="866" y="500" text-anchor="middle" font-size="8.5" fill="#2E6A4E">verificável de forma independente</text>

  <!-- Evidência → Destinos externos (teal to Registo Técnico row; wine to reguladores row) -->
  <path d="M1012 414 L1032 414 L1032 304 L1058 304" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrt-P100)"/>
  <line x1="1012" y1="486" x2="1058" y2="486" stroke="#8E1326" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrx-P100)"/>

  <!-- Destinos externos (far right) -->
  <rect x="1048" y="232" width="244" height="292" rx="12" fill="#F4EFE6" stroke="#E6D29A" stroke-width="1.5"/>
  <text x="1170" y="252" text-anchor="middle" font-size="10.5" font-weight="800" fill="#7A5212">Destinos externos</text>
  <text x="1170" y="267" text-anchor="middle" font-size="8.5" fill="#9A6B1E">fora da autoridade do BanzAI</text>

  <rect x="1060" y="278" width="220" height="52" rx="8" fill="#EAF3EC" stroke="#2E6A4E" stroke-width="1.4"/>
  <text x="1170" y="300" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4A34">Registo Técnico</text>
  <text x="1170" y="317" text-anchor="middle" font-size="8" fill="#2E6A4E">publicação opcional · pelo operador</text>

  <rect x="1060" y="338" width="220" height="52" rx="8" fill="#E6F1F0" stroke="#0F766E" stroke-width="1.4"/>
  <text x="1170" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#115E59">pares · federação</text>
  <text x="1170" y="377" text-anchor="middle" font-size="8" fill="#0F766E">verificam · interoperam</text>

  <rect x="1060" y="398" width="220" height="52" rx="8" fill="#F6EBD8" stroke="#9A6B1E" stroke-width="1.4"/>
  <text x="1170" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#7A5212">esquemas operacionais</text>
  <text x="1170" y="437" text-anchor="middle" font-size="8" fill="#8A6A1E">admitem</text>

  <rect x="1060" y="458" width="220" height="54" rx="8" fill="#FBEFF0" stroke="#8E1326" stroke-width="1.4"/>
  <text x="1170" y="480" text-anchor="middle" font-size="10" font-weight="700" fill="#8E1326">reguladores</text>
  <text x="1170" y="497" text-anchor="middle" font-size="8" fill="#8E1326">autorizam · decidem</text>

  <!-- Consumidor automático lane -->
  <rect x="40" y="548" width="1252" height="66" rx="11" fill="#F4F6F9" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="7 5"/>
  <rect x="52" y="560" width="200" height="44" rx="8" fill="#EEECEA" stroke="#3C4654" stroke-width="1.4"/>
  <text x="152" y="580" text-anchor="middle" font-size="10" font-weight="800" fill="#2A2E35">Consumidor automático</text>
  <text x="152" y="596" text-anchor="middle" font-size="8" fill="#54595F">máquina · sem o BanzAI</text>
  <line x1="252" y1="582" x2="296" y2="582" stroke="#3C4654" stroke-width="2.2" marker-end="url(#arrs-P100)"/>
  <text x="306" y="578" font-size="10.5" font-weight="700" fill="#2A2E35">acede directamente às interfaces públicas · aos motores · à evidência verificável</text>
  <text x="306" y="596" font-size="9" fill="#6B6265">o protocolo é verificável sem o BanzAI — a interface humana nunca é um ponto obrigatório</text>

  <!-- Legend -->
  <rect x="40" y="632" width="1252" height="52" rx="10" fill="#FBFBFA" stroke="#CBD5E0" stroke-width="1.2"/>
  <text x="56" y="652" font-size="9" font-weight="800" fill="#2A2E35">Setas</text>
  <line x1="56" y1="668" x2="86" y2="668" stroke="#B98A3E" stroke-width="2.4" marker-end="url(#arr-P100)"/>
  <text x="94" y="671" font-size="8.5" fill="#54595F">consulta e invocação por contrato tipado</text>
  <line x1="360" y1="668" x2="390" y2="668" stroke="#3C4654" stroke-width="2.4" marker-end="url(#arrs-P100)"/>
  <text x="398" y="671" font-size="8.5" fill="#54595F">resultado técnico · evidência selada · apresentação</text>
  <line x1="730" y1="668" x2="760" y2="668" stroke="#0F766E" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrt-P100)"/>
  <text x="768" y="671" font-size="8.5" fill="#54595F">publicação opcional no Registo Técnico</text>
  <line x1="1030" y1="668" x2="1060" y2="668" stroke="#8E1326" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrx-P100)"/>
  <text x="1068" y="671" font-size="8.5" fill="#54595F">decisão externa (sob a sua autoridade)</text>

  <!-- Closing note -->
  <text x="660" y="710" text-anchor="middle" font-size="9.5" fill="#6B6265">O BanzAI medeia; não decide veredictos, não certifica, não admite e não autoriza — cada decisão pertence ao responsável fora da sua fronteira.</text>

  <text x="660" y="792" text-anchor="middle" font-size="9" fill="#9CA3AF">SVG-P-100 · BanzAI no protocolo · BANZA_REFERENCIA.md §12 · ADR-036 · ADR-004 · ADR-036 · v1.0 · 2026-08-03</text>
</svg>
