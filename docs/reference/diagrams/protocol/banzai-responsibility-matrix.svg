<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-075
  diagram:   Quem faz o quê no BANZA
  version:   1.0
  source:    BANZA_REFERENCIA.md §11 · ADR-035
  updated:   2026-07-19
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P075 desc-P075"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P075">Quem faz o quê no BANZA</title>
  <desc id="desc-P075">A matriz de responsabilidades do BANZA: reguladores e entidades competentes tratam da licença e autorização financeira, fora do protocolo; o operador implementa e publica manifesto, metadata e evidência; os motores Rust/WASM verificam; o BanzAI orienta; os pares verificam a evidência publicada e interoperam localmente; a governança aberta evolui o protocolo por RFC/ADR. Não existe autoridade central de admissão de operadores: a participação é demonstrada por evidência verificável, não aprovada.</desc>
  <defs>
    <linearGradient id="hg-P075" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" fill="#F8F4EC"/>

  <rect x="0" y="0" width="1000" height="66" fill="url(#hg-P075)" rx="14"/>
  <rect x="0" y="50" width="1000" height="16" fill="#8E1326"/>
  <text x="28" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#FECACA" letter-spacing="2">SVG-P-075 · PROTOCOLO FINANCEIRO ABERTO</text>
  <text x="28" y="51" font-size="19" font-weight="800" fill="white">Quem faz o quê no BANZA</text>

  <!-- 6 role rows -->
  <g font-size="11">
    <!-- Reguladores (gold) -->
    <rect x="24" y="90" width="952" height="52" rx="9" fill="#F6EBD8" stroke="#9A6B1E" stroke-width="1.2"/>
    <text x="40" y="114" font-size="12.5" font-weight="700" fill="#7A5212">Reguladores / entidades competentes</text>
    <text x="40" y="132" font-size="10.5" fill="#5A4A2E">Licença e autorização financeira — fora do protocolo.</text>
    <text x="960" y="120" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="9.5" fill="#9A6B1E">FORA DO BANZA</text>

    <!-- Operador (green) -->
    <rect x="24" y="150" width="952" height="52" rx="9" fill="#EAF3EC" stroke="#2E6A4E" stroke-width="1.2"/>
    <text x="40" y="174" font-size="12.5" font-weight="700" fill="#1D4A34">Operador</text>
    <text x="40" y="192" font-size="10.5" fill="#2E6A4E">Implementa e publica manifesto, metadata e evidência — por auto-publicação.</text>
    <text x="960" y="180" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="9.5" fill="#2E6A4E">PUBLICA</text>

    <!-- Motores (charcoal) -->
    <rect x="24" y="210" width="952" height="52" rx="9" fill="#EEECEA" stroke="#3C4654" stroke-width="1.2"/>
    <text x="40" y="234" font-size="12.5" font-weight="700" fill="#2A2E35">Motores Rust/WASM</text>
    <text x="40" y="252" font-size="10.5" fill="#6B6265">Verificam Manifest, Conformidade, Trust, Traces e Evidence Bundle — determinísticos.</text>
    <text x="960" y="240" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="9.5" fill="#3C4654">VERIFICAM</text>

    <!-- BanzAI (slate) -->
    <rect x="24" y="270" width="952" height="52" rx="9" fill="#EAEFF4" stroke="#2E4054" stroke-width="2"/>
    <text x="40" y="294" font-size="12.5" font-weight="700" fill="#2E4054">BanzAI</text>
    <text x="40" y="312" font-size="10.5" fill="#54595F">Guia, invoca ferramentas e explica — não decide, não certifica, não inventa regras.</text>
    <text x="960" y="300" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="9.5" fill="#2E4054">ORIENTA</text>

    <!-- Pares (teal) -->
    <rect x="24" y="330" width="952" height="52" rx="9" fill="#E6F1F0" stroke="#0F766E" stroke-width="1.2"/>
    <text x="40" y="354" font-size="12.5" font-weight="700" fill="#115E59">Pares / outros operadores</text>
    <text x="40" y="372" font-size="10.5" fill="#0F766E">Verificam a evidência publicada e decidem interoperar localmente — sem permissão central.</text>
    <text x="960" y="360" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="9.5" fill="#0F766E">INTEROPERAM</text>

    <!-- Governança (red) -->
    <rect x="24" y="390" width="952" height="52" rx="9" fill="#FBEFF0" stroke="#8E1326" stroke-width="1.2"/>
    <text x="40" y="414" font-size="12.5" font-weight="700" fill="#8E1326">Governança aberta</text>
    <text x="40" y="432" font-size="10.5" fill="#6B6265">Evolui o protocolo por RFC/ADR/spec/release — não aprova operadores individualmente.</text>
    <text x="960" y="420" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="9.5" fill="#8E1326">EVOLUI</text>
  </g>

  <text x="500" y="466" text-anchor="middle" font-size="9" fill="#9CA3AF">SVG-P-075 · Quem faz o quê no BANZA · BANZA_REFERENCIA.md §11 · ADR-035 · v1.0 · 2026-07-19</text>
</svg>
