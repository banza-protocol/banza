<?xml version="1.0" encoding="UTF-8"?>
<!--
  id:        SVG-P-070
  diagram:   Protocol Governance — Simple
  version:   1.0
  source:    M2.5 Product Surface Simplification · open protocol governance
  updated:   2026-07-18
  author:    BANZA Protocol
  style:     protocol
-->
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P070 desc-P070"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P070">Governação do Protocolo — Simples</title>
  <desc id="desc-P070">Três papéis no modelo aberto do protocolo BANZA. Maintainers mantêm e evoluem o protocolo: conduzem o processo de RFC, escrevem specs e contratos, cortam releases versionados e emitem security updates; não autorizam, aceitam, aprovam ou certificam operadores. Operadores implementam o protocolo na sua própria infraestrutura, publicam manifests e evidência, sem pedir permissão para começar. Ferramentas verificam a conformidade, o trust e a evidência em Rust/WASM; não decidem, não aprovam nem certificam. Humanos mantêm e evoluem o protocolo; não autorizam, aceitam, aprovam ou certificam operadores.</desc>
  <defs>
    <linearGradient id="hg-P070" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <filter id="sh-P070">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000014"/>
    </filter>
  </defs>

  <rect width="1000" height="460" fill="#F4F1EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#hg-P070)" rx="14"/>
  <rect x="0" y="48" width="1000" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-070 · OPEN FINANCIAL PROTOCOL</text>
  <text x="24" y="47" font-size="18" font-weight="800" fill="white">Governação do Protocolo — Simples</text>
  <text x="976" y="47" text-anchor="end" font-size="10.5" fill="#FECACA">Mantêm · Implementam · Verificam</text>

  <!-- Lead -->
  <text x="500" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">Três papéis, uma direção: os mantenedores mantêm o protocolo, os operadores implementam-no e as ferramentas verificam.</text>
  <text x="500" y="112" text-anchor="middle" font-size="10.5" fill="#6B6265">Nenhuma autoridade central admite operadores. A participação demonstra-se por evidência verificável de conformidade.</text>

  <!-- Role 1 — Maintainers -->
  <rect x="40" y="145" width="280" height="180" fill="white" rx="12" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh-P070)"/>
  <rect x="40" y="145" width="280" height="34" fill="#8E1326" rx="12"/><rect x="40" y="163" width="280" height="16" fill="#8E1326"/>
  <text x="180" y="167" text-anchor="middle" font-size="13" font-weight="800" fill="white">Maintainers</text>
  <text x="180" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#8E1326">mantêm e evoluem o protocolo</text>
  <text x="180" y="228" text-anchor="middle" font-size="10" fill="#374151">processo de RFC · specs · contratos</text>
  <text x="180" y="248" text-anchor="middle" font-size="10" fill="#374151">releases versionados · security updates</text>
  <text x="180" y="276" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6B6265">os únicos humanos no fluxo</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#991B1B">não autorizam nem aprovam operadores</text>

  <!-- Role 2 — Operadores -->
  <rect x="360" y="145" width="280" height="180" fill="white" rx="12" stroke="#BFDBFE" stroke-width="1.5" filter="url(#sh-P070)"/>
  <rect x="360" y="145" width="280" height="34" fill="#1E40AF" rx="12"/><rect x="360" y="163" width="280" height="16" fill="#1E40AF"/>
  <text x="500" y="167" text-anchor="middle" font-size="13" font-weight="800" fill="white">Operadores</text>
  <text x="500" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">implementam o protocolo</text>
  <text x="500" y="228" text-anchor="middle" font-size="10" fill="#374151">na sua própria infraestrutura</text>
  <text x="500" y="248" text-anchor="middle" font-size="10" fill="#374151">publicam manifests e evidência</text>
  <text x="500" y="276" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6B6265">independentes · operator self-publication</text>
  <text x="500" y="300" text-anchor="middle" font-size="9.5" fill="#1E3A8A">sem pedir permissão para começar</text>

  <!-- Role 3 — Ferramentas -->
  <rect x="680" y="145" width="280" height="180" fill="white" rx="12" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh-P070)"/>
  <rect x="680" y="145" width="280" height="34" fill="#166534" rx="12"/><rect x="680" y="163" width="280" height="16" fill="#166534"/>
  <text x="820" y="167" text-anchor="middle" font-size="13" font-weight="800" fill="white">Ferramentas</text>
  <text x="820" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">verificam</text>
  <text x="820" y="228" text-anchor="middle" font-size="10" fill="#374151">conformidade · trust · evidência</text>
  <text x="820" y="248" text-anchor="middle" font-size="10" fill="#374151">status calculado em Rust/WASM</text>
  <text x="820" y="276" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6B6265">determinísticas · reproduzíveis</text>
  <text x="820" y="300" text-anchor="middle" font-size="9.5" fill="#166534">não decidem, não aprovam, não certificam</text>

  <!-- Boundary note -->
  <rect x="40" y="345" width="920" height="58" rx="10" fill="#FEF2F2" stroke="#991B1B" stroke-width="2"/>
  <text x="500" y="371" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1F2937">Humanos mantêm e evoluem o protocolo; não autorizam, aceitam, aprovam ou certificam operadores.</text>
  <text x="500" y="391" text-anchor="middle" font-size="10" fill="#6B6265">Não existe passo de aprovação humana entre um operador publicar evidência e participar na rede.</text>

  <!-- Footer -->
  <text x="500" y="438" text-anchor="middle" font-size="9.5" fill="#9CA3AF">SVG-P-070 · Governação do Protocolo — Simples · BANZA Protocol · M2.5 · 2026-07-18</text>
</svg>
