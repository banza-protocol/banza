<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="tc-title tc-desc" font-family="system-ui,-apple-system,sans-serif">
  <title id="tc-title">Trust Hierarchy</title>
  <desc id="tc-desc">Trust flows top to bottom without a certificate authority: an offline Trust Root (threshold custody, pinned anchor) authorises delegated signing keys, which sign protocol metadata (protocol releases and a revocation list). Operators self-publish a manifest and verifiable evidence, pin the Trust Root once, and verify every signature back to it; unverifiable or revoked signatures fail closed. BanzAI never holds signing keys.</desc>
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#990011"/>
      <stop offset="100%" stop-color="#B11226"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="900" height="590" fill="#FCF6F5" rx="16"/>
  <rect x="0" y="0" width="900" height="64" fill="url(#hg)" rx="16"/>
  <rect x="0" y="48" width="900" height="16" fill="#B11226"/>
  <text x="32" y="28" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-PE-004 · OPEN FINANCIAL PROTOCOL</text>
  <text x="32" y="50" font-size="17" font-weight="800" fill="white">Trust Hierarchy</text>
  <text x="868" y="50" text-anchor="end" font-size="10.5" fill="#FECACA">Signed protocol metadata — offline Trust Root to operator evidence</text>
  <rect x="210" y="92" width="480" height="78" fill="url(#hg)" rx="12"/>
  <text x="450" y="125" text-anchor="middle" font-size="14.5" font-weight="700" fill="white">Trust Root</text>
  <text x="450" y="148" text-anchor="middle" font-size="9.5" fill="#FECACA">Offline · threshold custody · pinned anchor</text>
  <line x1="450" y1="170" x2="450" y2="194" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="210" y="200" width="480" height="78" fill="white" rx="12" stroke="#B11226" stroke-width="2"/>
  <text x="450" y="233" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991B1B">Delegated Signing Keys</text>
  <text x="450" y="256" text-anchor="middle" font-size="9.5" fill="#B91C1C">Authorised by the Trust Root · rotate independently</text>
  <line x1="450" y1="278" x2="450" y2="302" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="210" y="308" width="480" height="78" fill="white" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="450" y="341" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">Signed Protocol Metadata</text>
  <text x="450" y="364" text-anchor="middle" font-size="9.5" fill="#6B7280">Protocol releases and Revocation List — signed</text>
  <line x1="450" y1="386" x2="450" y2="410" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="210" y="416" width="480" height="78" fill="#1F2937" rx="12"/>
  <text x="450" y="449" text-anchor="middle" font-size="14.5" font-weight="700" fill="white">Operator Manifest + Evidence</text>
  <text x="450" y="472" text-anchor="middle" font-size="9.5" fill="#9CA3AF">Self-published · /.well-known/banza/operator.json</text>
  <text x="450" y="534" text-anchor="middle" font-size="10" font-weight="600" fill="#6B7280">Operators pin the Trust Root once and verify every signature from it. BanzAI never holds signing keys.</text>

  <line x1="32" y1="542" x2="868" y2="542" stroke="#E5E7EB" stroke-width="1"/>
  <text x="450" y="562" text-anchor="middle" font-size="8.5" fill="#9CA3AF">SVG-PE-004 · Trust Hierarchy · BANZA Open Financial Protocol · v1.0 · 2026-06-12</text>
</svg>
