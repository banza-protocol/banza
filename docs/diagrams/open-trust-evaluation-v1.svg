<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 908" role="img" aria-labelledby="title-SVG-P-063 desc-SVG-P-063" font-family="system-ui,-apple-system,sans-serif">
  <title id="title-SVG-P-063">Open Trust Evaluation</title>
  <desc id="desc-SVG-P-063">Five kinds of published, verifiable material — an operator manifest, conformance evidence, signed protocol metadata, a public registry entry and the revocation list — feed a single deterministic evaluation of ten checks; all ten passing allows federation routing, and anything missing, invalid, expired, revoked or incompatible fails closed. Trust is established from evidence that anyone can verify independently, never from central human approval.</desc>
  <!--
    id:        SVG-P-063
    diagram:   Open Trust Evaluation
    version:   1.0
    source:    ADR-034 Open Protocol Trust Model Without CA · ADR-030 Operator Self-Publication and Machine-Verifiable Conformance · ADR-037 Federation Trust Evaluation Without Certificates
    updated:   2026-07-17
    author:    BANZA Protocol
    style:     protocol
  -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#990011"/><stop offset="100%" stop-color="#B11226"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6B7280"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000014"/>
    </filter>
  </defs>

  <rect width="1120" height="908" fill="#FCF6F5" rx="16"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="72" fill="url(#hg)" rx="16"/>
  <rect x="0" y="56" width="1120" height="16" fill="#B11226"/>
  <text x="36" y="32" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#FECACA" letter-spacing="2">SVG-P-063 · OPEN FINANCIAL PROTOCOL</text>
  <text x="36" y="56" font-size="19" font-weight="800" fill="white">Open Trust Evaluation</text>
  <text x="1084" y="56" text-anchor="end" font-size="11" fill="#FECACA">Evidence Inputs · Ten Checks · Fail-Closed</text>

  <!-- Lead -->
  <text x="560" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Operator B evaluates Operator A from published evidence before routing federation traffic.</text>
  <text x="560" y="114" text-anchor="middle" font-size="11" fill="#6B7280">Either operator runs the same evaluation independently, offline and deterministically. There is no central arbiter and no human in the path.</text>

  <!-- ── EVIDENCE INPUTS ── -->
  <text x="56" y="140" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="1.5">EVIDENCE INPUTS — PUBLISHED MATERIAL, VERIFIABLE BY ANYONE</text>

  <!-- Input 1 — Operator Manifest -->
  <rect x="56" y="150" width="188" height="128" fill="white" rx="12" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="56" y="150" width="188" height="30" fill="#166534" rx="12"/><rect x="56" y="166" width="188" height="14" fill="#166534"/>
  <text x="150" y="170" text-anchor="middle" font-size="11" font-weight="800" fill="white">Operator Manifest</text>
  <text x="150" y="200" text-anchor="middle" font-size="10" fill="#374151">published by the operator</text>
  <text x="150" y="215" text-anchor="middle" font-size="10" fill="#6B7280">version · capabilities</text>
  <text x="150" y="230" text-anchor="middle" font-size="10" fill="#6B7280">endpoints · public keys</text>
  <text x="150" y="252" text-anchor="middle" font-size="8.5" font-family="ui-monospace,monospace" fill="#9CA3AF">operator.json</text>
  <text x="150" y="269" text-anchor="middle" font-size="9" font-style="italic" fill="#166534">self-published</text>

  <!-- Input 2 — Conformance Evidence -->
  <rect x="261" y="150" width="188" height="128" fill="white" rx="12" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="261" y="150" width="188" height="30" fill="#166534" rx="12"/><rect x="261" y="166" width="188" height="14" fill="#166534"/>
  <text x="355" y="170" text-anchor="middle" font-size="11" font-weight="800" fill="white">Conformance Evidence</text>
  <text x="355" y="200" text-anchor="middle" font-size="10" fill="#374151">machine-verifiable results</text>
  <text x="355" y="215" text-anchor="middle" font-size="10" fill="#6B7280">of the conformance suite</text>
  <text x="355" y="230" text-anchor="middle" font-size="10" fill="#6B7280">signed by the operator</text>
  <text x="355" y="252" text-anchor="middle" font-size="8.5" font-family="ui-monospace,monospace" fill="#9CA3AF">evidence-bundle.json</text>
  <text x="355" y="269" text-anchor="middle" font-size="9" font-style="italic" fill="#166534">self-published</text>

  <!-- Input 3 — Signed Protocol Metadata -->
  <rect x="466" y="150" width="188" height="128" fill="white" rx="12" stroke="#BFDBFE" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="466" y="150" width="188" height="30" fill="#1E40AF" rx="12"/><rect x="466" y="166" width="188" height="14" fill="#1E40AF"/>
  <text x="560" y="170" text-anchor="middle" font-size="11" font-weight="800" fill="white">Signed Protocol Metadata</text>
  <text x="560" y="200" text-anchor="middle" font-size="10" fill="#374151">specs · contracts · keys</text>
  <text x="560" y="215" text-anchor="middle" font-size="10" fill="#6B7280">signed under the Trust Root</text>
  <text x="560" y="230" text-anchor="middle" font-size="10" fill="#6B7280">verifiable offline</text>
  <text x="560" y="252" text-anchor="middle" font-size="8.5" font-family="ui-monospace,monospace" fill="#9CA3AF">signed-protocol-metadata.json</text>
  <text x="560" y="269" text-anchor="middle" font-size="9" font-style="italic" fill="#1E40AF">protocol-signed</text>

  <!-- Input 4 — Public Registry Entry -->
  <rect x="671" y="150" width="188" height="128" fill="white" rx="12" stroke="#BFDBFE" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="671" y="150" width="188" height="30" fill="#1E40AF" rx="12"/><rect x="671" y="166" width="188" height="14" fill="#1E40AF"/>
  <text x="765" y="170" text-anchor="middle" font-size="11" font-weight="800" fill="white">Public Registry Entry</text>
  <text x="765" y="200" text-anchor="middle" font-size="10" fill="#374151">index of metadata and</text>
  <text x="765" y="215" text-anchor="middle" font-size="10" fill="#6B7280">verifiable evidence</text>
  <text x="765" y="230" text-anchor="middle" font-size="10" fill="#6B7280">discovery, not permission</text>
  <text x="765" y="252" text-anchor="middle" font-size="8.5" font-family="ui-monospace,monospace" fill="#9CA3AF">public-registry.json</text>
  <text x="765" y="269" text-anchor="middle" font-size="9" font-style="italic" fill="#1E40AF">protocol-signed</text>

  <!-- Input 5 — Revocation List -->
  <rect x="876" y="150" width="188" height="128" fill="white" rx="12" stroke="#FDE68A" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="876" y="150" width="188" height="30" fill="#854D0E" rx="12"/><rect x="876" y="166" width="188" height="14" fill="#854D0E"/>
  <text x="970" y="170" text-anchor="middle" font-size="11" font-weight="800" fill="white">Revocation List</text>
  <text x="970" y="200" text-anchor="middle" font-size="10" fill="#374151">withdraws cryptographic</text>
  <text x="970" y="215" text-anchor="middle" font-size="10" fill="#6B7280">trust from key material</text>
  <text x="970" y="230" text-anchor="middle" font-size="10" fill="#6B7280">read on every evaluation</text>
  <text x="970" y="252" text-anchor="middle" font-size="8.5" font-family="ui-monospace,monospace" fill="#9CA3AF">revocation-list.json</text>
  <text x="970" y="269" text-anchor="middle" font-size="9" font-style="italic" fill="#854D0E">security signal</text>

  <!-- Arrows into the evaluation -->
  <line x1="150" y1="278" x2="150" y2="304" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="355" y1="278" x2="355" y2="304" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="560" y1="278" x2="560" y2="304" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="765" y1="278" x2="765" y2="304" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="970" y1="278" x2="970" y2="304" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ── TRUST EVALUATION ── -->
  <rect x="40" y="308" width="1040" height="246" fill="white" rx="12" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="308" width="1040" height="32" fill="#1F2937" rx="12"/><rect x="40" y="326" width="1040" height="14" fill="#1F2937"/>
  <text x="560" y="329" text-anchor="middle" font-size="13" font-weight="800" fill="white">Trust Evaluation — Ten Deterministic Checks</text>
  <text x="560" y="358" text-anchor="middle" font-size="11" fill="#374151">Every check reads published material only. Any party can run the same evaluation on the same inputs and reach the same result.</text>

  <!-- Check 1 -->
  <rect x="56" y="372" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="72" cy="388" r="11" fill="#990011"/>
  <text x="72" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="white">1</text>
  <text x="150" y="412" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Operator Manifest</text>
  <text x="150" y="428" text-anchor="middle" font-size="9" fill="#6B7280">present · well-formed · resolves</text>
  <text x="150" y="441" text-anchor="middle" font-size="9" fill="#6B7280">declares version, keys, endpoints</text>

  <!-- Check 2 -->
  <rect x="261" y="372" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="277" cy="388" r="11" fill="#990011"/>
  <text x="277" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="white">2</text>
  <text x="355" y="412" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Protocol Version</text>
  <text x="355" y="428" text-anchor="middle" font-size="9" fill="#6B7280">declared version compatible</text>
  <text x="355" y="441" text-anchor="middle" font-size="9" fill="#6B7280">with the evaluating operator</text>

  <!-- Check 3 -->
  <rect x="466" y="372" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="482" cy="388" r="11" fill="#990011"/>
  <text x="482" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="white">3</text>
  <text x="560" y="412" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Signed Protocol Metadata</text>
  <text x="560" y="428" text-anchor="middle" font-size="9" fill="#6B7280">signature verifies against</text>
  <text x="560" y="441" text-anchor="middle" font-size="9" fill="#6B7280">the published key manifest</text>

  <!-- Check 4 -->
  <rect x="671" y="372" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="687" cy="388" r="11" fill="#990011"/>
  <text x="687" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="white">4</text>
  <text x="765" y="412" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Conformance Evidence</text>
  <text x="765" y="428" text-anchor="middle" font-size="9" fill="#6B7280">present, valid and bound</text>
  <text x="765" y="441" text-anchor="middle" font-size="9" fill="#6B7280">to this manifest</text>

  <!-- Check 5 -->
  <rect x="876" y="372" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="892" cy="388" r="11" fill="#990011"/>
  <text x="892" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="white">5</text>
  <text x="970" y="412" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Trust Root Signature</text>
  <text x="970" y="428" text-anchor="middle" font-size="9" fill="#6B7280">chains to the Trust Root or a</text>
  <text x="970" y="441" text-anchor="middle" font-size="9" fill="#6B7280">valid delegated signing key</text>

  <!-- Check 6 -->
  <rect x="56" y="460" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="72" cy="476" r="11" fill="#990011"/>
  <text x="72" y="480" text-anchor="middle" font-size="11" font-weight="800" fill="white">6</text>
  <text x="150" y="500" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Revocation Status</text>
  <text x="150" y="516" text-anchor="middle" font-size="9" fill="#6B7280">key material absent from</text>
  <text x="150" y="529" text-anchor="middle" font-size="9" fill="#6B7280">the Revocation List</text>

  <!-- Check 7 -->
  <rect x="261" y="460" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="277" cy="476" r="11" fill="#990011"/>
  <text x="277" y="480" text-anchor="middle" font-size="11" font-weight="800" fill="white">7</text>
  <text x="355" y="500" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Capabilities</text>
  <text x="355" y="516" text-anchor="middle" font-size="9" fill="#6B7280">declared capabilities compatible</text>
  <text x="355" y="529" text-anchor="middle" font-size="9" fill="#6B7280">with the requested operation</text>

  <!-- Check 8 -->
  <rect x="466" y="460" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="482" cy="476" r="11" fill="#990011"/>
  <text x="482" y="480" text-anchor="middle" font-size="11" font-weight="800" fill="white">8</text>
  <text x="560" y="500" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Endpoint Contract</text>
  <text x="560" y="516" text-anchor="middle" font-size="9" fill="#6B7280">endpoints match the shape</text>
  <text x="560" y="529" text-anchor="middle" font-size="9" fill="#6B7280">the contract requires</text>

  <!-- Check 9 -->
  <rect x="671" y="460" width="188" height="78" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="687" cy="476" r="11" fill="#990011"/>
  <text x="687" y="480" text-anchor="middle" font-size="11" font-weight="800" fill="white">9</text>
  <text x="765" y="500" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1F2937">Evidence Freshness</text>
  <text x="765" y="516" text-anchor="middle" font-size="9" fill="#6B7280">evidence age within the</text>
  <text x="765" y="529" text-anchor="middle" font-size="9" fill="#6B7280">evaluator's policy window</text>

  <!-- Check 10 — fail-closed default -->
  <rect x="876" y="460" width="188" height="78" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <circle cx="892" cy="476" r="11" fill="#991B1B"/>
  <text x="892" y="480" text-anchor="middle" font-size="11" font-weight="800" fill="white">10</text>
  <text x="970" y="500" text-anchor="middle" font-size="10.5" font-weight="800" fill="#991B1B">Fail-Closed Default</text>
  <text x="970" y="516" text-anchor="middle" font-size="9" fill="#6B7280">missing · invalid · expired</text>
  <text x="970" y="529" text-anchor="middle" font-size="9" fill="#6B7280">revoked · incompatible → stop</text>

  <!-- Split to outcomes -->
  <path d="M560,554 L560,570 L304,570 L304,588" fill="none" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M560,554 L560,570 L816,570 L816,588" fill="none" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Outcome — routing allowed -->
  <rect x="56" y="588" width="496" height="92" fill="white" rx="12" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="56" y="588" width="496" height="32" fill="#166534" rx="12"/><rect x="56" y="606" width="496" height="14" fill="#166534"/>
  <text x="304" y="609" text-anchor="middle" font-size="13" font-weight="800" fill="white">Routing Allowed</text>
  <text x="304" y="640" text-anchor="middle" font-size="11.5" fill="#374151">All ten checks pass on published, verifiable material.</text>
  <text x="304" y="657" text-anchor="middle" font-size="10.5" fill="#6B7280">The evaluating operator may route federation traffic to this operator.</text>
  <text x="304" y="672" text-anchor="middle" font-size="10" font-style="italic" fill="#9CA3AF">a conclusion drawn from evidence — not an approval, a licence or an endorsement</text>

  <!-- Outcome — fail-closed -->
  <rect x="568" y="588" width="496" height="92" fill="white" rx="12" stroke="#FECACA" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="568" y="588" width="496" height="32" fill="#991B1B" rx="12"/><rect x="568" y="606" width="496" height="14" fill="#991B1B"/>
  <text x="816" y="609" text-anchor="middle" font-size="13" font-weight="800" fill="white">Fail-Closed — No Routing</text>
  <text x="816" y="640" text-anchor="middle" font-size="11.5" fill="#374151">Any check missing, invalid, expired, revoked or incompatible.</text>
  <text x="816" y="657" text-anchor="middle" font-size="10.5" fill="#6B7280">Traffic is not routed. The default is to stop, never to assume trust.</text>
  <text x="816" y="672" text-anchor="middle" font-size="10" font-style="italic" fill="#991B1B">a protocol security outcome — not a regulatory sanction</text>

  <!-- Caption -->
  <rect x="56" y="694" width="1008" height="44" rx="10" fill="#1F2937"/>
  <text x="560" y="722" text-anchor="middle" font-size="15" font-weight="800" fill="white">Trust is verified by evidence, not human approval.</text>

  <!-- Boundary band -->
  <rect x="56" y="750" width="1008" height="118" rx="12" fill="#FEF2F2" stroke="#991B1B" stroke-width="2"/>
  <text x="560" y="770" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B" letter-spacing="1.5">BOUNDARY — PERMANENT AND NOT ADJUSTABLE FOR IMPLEMENTATION CONVENIENCE</text>
  <text x="560" y="792" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1F2937">BANZA is an open financial protocol. Operator participation is demonstrated by verifiable protocol conformance, not by central human approval.</text>
  <text x="560" y="810" text-anchor="middle" font-size="10.5" fill="#374151">The Public Protocol Registry is an index of metadata and verifiable evidence. It is not a list of operators licensed, approved or certified by BANZA — and absence from it is not a regulatory prohibition.</text>
  <text x="560" y="826" text-anchor="middle" font-size="10.5" fill="#374151">The Revocation List is a protocol security and trust mechanism. It is not a licence, a regulatory sanction or a financial authorisation.</text>
  <text x="560" y="842" text-anchor="middle" font-size="10.5" fill="#374151">The Trust Root signs only the Key Manifest; delegated keys sign protocol metadata, releases and the revocation list. It does not authorise operators, issue licences or authorise payments.</text>
  <text x="560" y="858" text-anchor="middle" font-size="10" fill="#6B7280">Operators are independent and carry their own legal, regulatory and financial responsibility. Any authorisation comes from the competent regulator — never from BANZA.</text>

  <!-- Footer -->
  <text x="560" y="890" text-anchor="middle" font-size="9.5" fill="#9CA3AF">SVG-P-063 · Open Trust Evaluation · ADR-034 · ADR-030 · ADR-037 · 2026-07-17</text>
</svg>
