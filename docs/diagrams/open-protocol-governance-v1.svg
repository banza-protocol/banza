<svg viewBox="0 0 980 820" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title-P058 desc-P058"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title-P058">Open Protocol Governance</title>
  <desc id="desc-P058">How the BANZA protocol is governed in the open. At the top, Protocol Maintainers are the only humans in the flow: they run the RFC process, write specifications and contracts, cut versioned releases and issue security updates. They debate, review and merge protocol changes; they do not evaluate, admit, authorise or approve any operator. On the left, the Trust Root signs only the Key Manifest, which endorses the delegated signing keys; the delegated keys sign protocol metadata, releases and the revocation list within their domains, and nothing else: it does not authorise payments, operators, licences or funds, and revocation is a security signal, not a regulatory act. The Trust Root signs into the Public Protocol Registry, which publishes signed protocol metadata, delegated signing keys, the revocation list, conformance test vectors, protocol releases and operator manifests; anyone may read it and verify the signatures independently, with no account and no gate. Independent Operators A, B and C read the registry and implement the protocol without asking permission to start, then self-publish an operator manifest and conformance evidence. Conformance Automation verifies that published evidence by machine, using deterministic test vectors, signature verification and invariant checks, and emits a machine-readable evidence bundle that anyone can reproduce. Between an operator publishing its evidence and that operator participating in the network there is a position where a central human approval would sit; that position is drawn as an empty dashed slot and is intentionally empty. No human decides who may participate.</desc>
  <defs>
    <linearGradient id="hg-P058" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E0F1A"/><stop offset="100%" stop-color="#8E1326"/>
    </linearGradient>
    <marker id="arr-P058" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="980" height="820" fill="#F4F1EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="64" fill="url(#hg-P058)" rx="14"/>
  <rect x="0" y="48" width="980" height="16" fill="#8E1326"/>
  <text x="24" y="26" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#FECACA" letter-spacing="2">SVG-P-058 · OPEN FINANCIAL PROTOCOL</text>
  <text x="24" y="50" font-size="18" font-weight="800" fill="white">Open Protocol Governance</text>
  <text x="956" y="50" text-anchor="end" font-size="11" fill="#FECACA">Maintained by humans · verified by machines</text>

  <!-- ── Protocol Maintainers ── -->
  <rect x="24" y="88" width="932" height="124" rx="11" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="24" y="88" width="932" height="28" fill="#1F2937" rx="11"/>
  <rect x="24" y="102" width="932" height="14" fill="#1F2937"/>
  <text x="44" y="107" font-size="9" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">HUMAN LAYER</text>
  <text x="490" y="107" text-anchor="middle" font-size="12.5" font-weight="800" fill="white">Protocol Maintainers</text>
  <text x="490" y="132" text-anchor="middle" font-size="10" fill="#6B6265">the only humans in this flow · they maintain the protocol in the open</text>

  <rect x="44" y="142" width="214" height="38" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="151" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">RFC Process — open to all</text>
  <rect x="270" y="142" width="214" height="38" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="377" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">Specifications &amp; Contracts</text>
  <rect x="496" y="142" width="214" height="38" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="603" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">Versioned Releases</text>
  <rect x="722" y="142" width="214" height="38" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="829" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">Security Updates</text>

  <text x="490" y="200" text-anchor="middle" font-size="10" fill="#6B6265">Maintainers debate, review and merge protocol changes in the open. They do not evaluate, admit, authorise or approve any operator.</text>

  <!-- Maintainers → Trust Root / Registry -->
  <line x1="150" y1="212" x2="150" y2="244" stroke="#6B7280" stroke-width="2" marker-end="url(#arr-P058)"/>
  <text x="158" y="232" font-size="9" fill="#6B7280">release metadata</text>
  <line x1="640" y1="212" x2="640" y2="244" stroke="#6B7280" stroke-width="2" marker-end="url(#arr-P058)"/>
  <text x="648" y="232" font-size="9" fill="#6B7280">specs · RFC outcomes · test vectors</text>

  <!-- ── Trust Root ── -->
  <rect x="24" y="248" width="280" height="192" rx="11" fill="white" stroke="#FDE68A" stroke-width="1.5"/>
  <rect x="24" y="248" width="280" height="28" fill="#854D0E" rx="11"/>
  <rect x="24" y="262" width="280" height="14" fill="#854D0E"/>
  <text x="164" y="267" text-anchor="middle" font-size="12.5" font-weight="800" fill="white">Trust Root</text>
  <text x="164" y="292" text-anchor="middle" font-size="10" fill="#6B6265">signs · never authorises</text>

  <rect x="40" y="300" width="248" height="24" rx="7" fill="#FEFCE8" stroke="#FDE68A"/>
  <text x="164" y="316" text-anchor="middle" font-size="10" font-weight="600" fill="#854D0E">Key Manifest — and nothing else</text>
  <rect x="40" y="328" width="248" height="24" rx="7" fill="#FEFCE8" stroke="#FDE68A"/>
  <text x="164" y="344" text-anchor="middle" font-size="10" font-weight="600" fill="#854D0E">Delegated keys: Metadata + Releases</text>
  <rect x="40" y="356" width="248" height="24" rx="7" fill="#FEFCE8" stroke="#FDE68A"/>
  <text x="164" y="372" text-anchor="middle" font-size="10" font-weight="600" fill="#854D0E">Revocation-domain key: the BRL</text>

  <rect x="40" y="384" width="248" height="48" rx="7" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="164" y="399" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">Does not authorise payments, operators,</text>
  <text x="164" y="412" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">licences or funds. Revocation is a</text>
  <text x="164" y="425" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">security signal, not a regulatory act.</text>

  <line x1="304" y1="344" x2="344" y2="344" stroke="#6B7280" stroke-width="2" marker-end="url(#arr-P058)"/>
  <text x="324" y="336" text-anchor="middle" font-size="9" fill="#6B7280">signs</text>

  <!-- ── Public Protocol Registry ── -->
  <rect x="352" y="248" width="604" height="192" rx="11" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="352" y="248" width="604" height="28" fill="#1E40AF" rx="11"/>
  <rect x="352" y="262" width="604" height="14" fill="#1E40AF"/>
  <text x="372" y="267" font-size="9" font-weight="700" fill="#BFDBFE" letter-spacing="1.5">PUBLIC</text>
  <text x="654" y="267" text-anchor="middle" font-size="12.5" font-weight="800" fill="white">Public Protocol Registry</text>
  <text x="654" y="292" text-anchor="middle" font-size="10" fill="#6B6265">openly readable · independently verifiable · no account, no gate</text>

  <rect x="368" y="302" width="182" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="459" y="322" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Signed Protocol Metadata</text>
  <rect x="562" y="302" width="182" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="653" y="322" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Delegated Signing Keys</text>
  <rect x="756" y="302" width="184" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="848" y="322" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Revocation List</text>

  <rect x="368" y="340" width="182" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="459" y="360" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Conformance Test Vectors</text>
  <rect x="562" y="340" width="182" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="653" y="360" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Protocol Releases</text>
  <rect x="756" y="340" width="184" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="848" y="360" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Operator Manifests</text>

  <rect x="368" y="384" width="572" height="48" rx="7" fill="#F3F4F6"/>
  <text x="654" y="402" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">Everything the protocol asserts is published and signed.</text>
  <text x="654" y="417" text-anchor="middle" font-size="10" fill="#6B6265">Any operator, auditor or member of the public may fetch it and verify the signatures</text>
  <text x="654" y="430" text-anchor="middle" font-size="10" fill="#6B6265">independently — without asking anyone for permission.</text>

  <!-- Registry → Operators -->
  <line x1="414" y1="440" x2="414" y2="466" stroke="#6B7280" stroke-width="2" marker-end="url(#arr-P058)"/>
  <text x="422" y="458" font-size="9" fill="#6B7280">read · implement</text>

  <!-- ── Independent Operators ── -->
  <rect x="24" y="470" width="452" height="140" rx="11" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="24" y="470" width="452" height="28" fill="#1F2937" rx="11"/>
  <rect x="24" y="484" width="452" height="14" fill="#1F2937"/>
  <text x="250" y="489" text-anchor="middle" font-size="12.5" font-weight="800" fill="white">Independent Operators</text>
  <text x="250" y="514" text-anchor="middle" font-size="10" fill="#6B6265">implement the protocol · no permission required to start</text>

  <rect x="40" y="522" width="133" height="28" rx="7" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="106" y="540" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">Operator A</text>
  <rect x="183" y="522" width="133" height="28" rx="7" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="249" y="540" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">Operator B</text>
  <rect x="326" y="522" width="134" height="28" rx="7" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="393" y="540" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">Operator C</text>

  <rect x="40" y="556" width="205" height="28" rx="7" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="142" y="574" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">publishes: Operator Manifest</text>
  <rect x="255" y="556" width="205" height="28" rx="7" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="357" y="574" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">publishes: Conformance Evidence</text>

  <text x="250" y="598" text-anchor="middle" font-size="9.5" fill="#6B6265">Each operator implements and self-publishes independently.</text>

  <line x1="476" y1="540" x2="504" y2="540" stroke="#6B7280" stroke-width="2" marker-end="url(#arr-P058)"/>

  <!-- ── Conformance Automation ── -->
  <rect x="504" y="470" width="452" height="140" rx="11" fill="white" stroke="#BBF7D0" stroke-width="1.5"/>
  <rect x="504" y="470" width="452" height="28" fill="#166534" rx="11"/>
  <rect x="504" y="484" width="452" height="14" fill="#166534"/>
  <text x="730" y="489" text-anchor="middle" font-size="12.5" font-weight="800" fill="white">Conformance Automation</text>
  <text x="730" y="514" text-anchor="middle" font-size="10" fill="#6B6265">verifies published evidence · machine-verifiable · no human in the loop</text>

  <rect x="520" y="522" width="205" height="28" rx="7" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="622" y="540" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Deterministic Test Vectors</text>
  <rect x="735" y="522" width="205" height="28" rx="7" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="837" y="540" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Signature Verification</text>
  <rect x="520" y="556" width="205" height="28" rx="7" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="622" y="574" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Invariant Checks</text>
  <rect x="735" y="556" width="205" height="28" rx="7" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="837" y="574" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Evidence Bundle (machine-readable)</text>

  <text x="730" y="598" text-anchor="middle" font-size="9.5" fill="#6B6265">Anyone may re-run the same checks and reproduce the same result.</text>

  <!-- ── The marked absence ── -->
  <rect x="24" y="624" width="932" height="104" rx="10" fill="white" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="490" y="646" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="1.5">WHERE A CENTRAL HUMAN APPROVAL WOULD SIT — INTENTIONALLY EMPTY</text>

  <rect x="56" y="662" width="280" height="40" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="196" y="678" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Operator publishes manifest + evidence</text>
  <text x="196" y="692" text-anchor="middle" font-size="10" fill="#166534">automation verifies it</text>

  <line x1="336" y1="682" x2="376" y2="682" stroke="#6B7280" stroke-width="2" marker-end="url(#arr-P058)"/>

  <rect x="384" y="662" width="212" height="40" rx="8" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="490" y="678" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">no approval step</text>
  <text x="490" y="692" text-anchor="middle" font-size="9.5" fill="#9CA3AF">this slot is empty by design</text>

  <line x1="604" y1="682" x2="644" y2="682" stroke="#6B7280" stroke-width="2" marker-end="url(#arr-P058)"/>

  <rect x="652" y="662" width="272" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="788" y="678" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Operator participates</text>
  <text x="788" y="692" text-anchor="middle" font-size="10" fill="#1E40AF">in the network</text>

  <text x="490" y="720" text-anchor="middle" font-size="10" fill="#6B6265">Nothing in this diagram admits, accepts, authorises or approves an operator. No human decides who may participate, and no single party may grant or withhold access.</text>

  <!-- ── Caption ── -->
  <rect x="24" y="740" width="932" height="44" rx="10" fill="#1F2937"/>
  <text x="490" y="768" text-anchor="middle" font-size="14" font-weight="800" fill="white">Humans maintain the protocol; they do not approve operators.</text>

  <!-- Footer -->
  <text x="490" y="806" text-anchor="middle" font-size="9.5" fill="#9CA3AF">SVG-P-058 · Open Protocol Governance · BANZA Protocol · ADR-001 · ADR-003 · M2.2 · 2026-07-17</text>
</svg>
