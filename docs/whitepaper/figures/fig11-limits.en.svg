<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" role="img" aria-label="BANZA evaluates observable technical conditions; regulatory authorisation, internal controls, commercial agreements, scheme admission and access to external networks are out of scope." font-family="Georgia, 'Times New Roman', serif">
<title>Boundary of what BANZA evaluates</title><desc>BANZA evaluates observable technical conditions; regulatory authorisation, internal controls, commercial agreements, scheme admission and access to external networks are out of scope.</desc>
<rect x="0" y="0" width="760" height="214" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="d" x="30" y="18" width="700" height="178" rx="4"/><text x="54" y="42" text-anchor="start" font-size="11.5" class="n">out of observed scope</text><text x="54" y="70" text-anchor="start" font-size="9.5" class="m">· regulatory authorisation</text><text x="54" y="91" text-anchor="start" font-size="9.5" class="m">· operator internal controls</text><text x="54" y="112" text-anchor="start" font-size="9.5" class="m">· off-protocol behaviour</text><text x="54" y="133" text-anchor="start" font-size="9.5" class="m">· commercial agreements and scheme admission</text><text x="54" y="154" text-anchor="start" font-size="9.5" class="m">· effective access to external infrastructures or networks</text><rect class="b" x="398" y="56" width="308" height="118" rx="4"/><text x="552" y="84" text-anchor="middle" font-size="11.5" class="n">BANZA evaluates</text><text x="552" y="110" text-anchor="middle" font-size="9.5" class="m">conformance against a public profile</text><text x="552" y="131" text-anchor="middle" font-size="9.5" class="m">declared artifacts, at the observed instant</text><text x="552" y="158" text-anchor="middle" font-size="9.5" class="m">a technical result does not represent authorisation</text>
</svg>
