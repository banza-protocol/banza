<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="Uma versão actual recebe alterações aditivas sem ruptura; uma alteração incompatível passa por depreciação, coexistência, migração e fim de suporte." font-family="Georgia, 'Times New Roman', serif">
<title>Ciclo de evolução de uma versão</title><desc>Uma versão actual recebe alterações aditivas sem ruptura; uma alteração incompatível passa por depreciação, coexistência, migração e fim de suporte.</desc>
<rect x="0" y="0" width="760" height="230" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="24" y="90" width="130" height="50" rx="4"/><text x="89" y="112" text-anchor="middle" font-size="12">versão actual</text><text x="89" y="129" text-anchor="middle" font-size="9" class="m">1.0</text><line class="l" x1="89" y1="90" x2="89" y2="46" marker-end="url(#a)"/><rect class="d" x="24" y="12" width="200" height="34" rx="4"/><text x="124" y="33" text-anchor="middle" font-size="10.5">alteração aditiva (compatível)</text><line class="l" x1="154" y1="115" x2="182" y2="115" marker-end="url(#a)"/><rect class="b" x="184" y="90" width="120" height="50" rx="4"/><text x="244" y="112" text-anchor="middle" font-size="11">depreciação</text><text x="244" y="129" text-anchor="middle" font-size="9" class="m">anúncio</text><line class="l" x1="304" y1="115" x2="330" y2="115" marker-end="url(#a)"/><rect class="b" x="332" y="90" width="120" height="50" rx="4"/><text x="392" y="112" text-anchor="middle" font-size="11">coexistência</text><text x="392" y="129" text-anchor="middle" font-size="9" class="m">janela de transição</text><line class="l" x1="452" y1="115" x2="478" y2="115" marker-end="url(#a)"/><rect class="b" x="480" y="90" width="120" height="50" rx="4"/><text x="540" y="116" text-anchor="middle" font-size="11">migração</text><line class="l" x1="600" y1="115" x2="626" y2="115" marker-end="url(#a)"/><rect class="b" x="628" y="90" width="120" height="50" rx="4"/><text x="688" y="112" text-anchor="middle" font-size="11">fim de suporte</text><text x="688" y="129" text-anchor="middle" font-size="9" class="m">versão maior</text><text x="380" y="200" text-anchor="middle" font-size="9.5" class="m">aditivo: versão menor · incompatível: versão maior anunciada com antecedência</text>
</svg>
