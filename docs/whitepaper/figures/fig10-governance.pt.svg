<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 152" role="img" aria-label="A evolução do protocolo separa proposta e discussão (RFC), decisão registada (ADR) e publicação versionada, com coexistência e migração quando aplicável." font-family="Georgia, 'Times New Roman', serif">
<title>Evolução do protocolo: proposta, decisão e publicação</title><desc>A evolução do protocolo separa proposta e discussão (RFC), decisão registada (ADR) e publicação versionada, com coexistência e migração quando aplicável.</desc>
<rect x="0" y="0" width="760" height="152" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="16" y="40" width="128" height="50" rx="4"/><text x="80.0" y="61" text-anchor="middle" font-size="10.5">versão</text><text x="80.0" y="77" text-anchor="middle" font-size="9" class="m">publicada</text><rect class="b" x="166" y="40" width="128" height="50" rx="4"/><text x="230.0" y="61" text-anchor="middle" font-size="10.5">proposta e</text><text x="230.0" y="77" text-anchor="middle" font-size="9" class="m">discussão (RFC)</text><rect class="b" x="316" y="40" width="128" height="50" rx="4"/><text x="380.0" y="61" text-anchor="middle" font-size="10.5">decisão registada</text><text x="380.0" y="77" text-anchor="middle" font-size="9" class="m">(ADR)</text><rect class="b" x="466" y="40" width="128" height="50" rx="4"/><text x="530.0" y="61" text-anchor="middle" font-size="10.5">nova versão</text><text x="530.0" y="77" text-anchor="middle" font-size="9" class="m">publicada</text><rect class="b" x="616" y="40" width="128" height="50" rx="4"/><text x="680.0" y="61" text-anchor="middle" font-size="10.5">coexistência e migração</text><text x="680.0" y="77" text-anchor="middle" font-size="9" class="m">quando aplicável</text><line class="l" x1="144" y1="65" x2="166" y2="65" marker-end="url(#a)"/><line class="l" x1="294" y1="65" x2="316" y2="65" marker-end="url(#a)"/><line class="l" x1="444" y1="65" x2="466" y2="65" marker-end="url(#a)"/><line class="l" x1="594" y1="65" x2="616" y2="65" marker-end="url(#a)"/><text x="380" y="126" text-anchor="middle" font-size="9.5" class="m">governar as regras ≠ operar transacções ≠ autorizar participantes</text>
</svg>
