<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Os artefactos entram nos motores, que produzem resultados, recibos e um Pacote de Evidências; a publicação no Registo Técnico é opcional; o BanzAI apenas apresenta e explica." font-family="Georgia, 'Times New Roman', serif">
<title>Da validação à evidência e ao Registo Técnico</title><desc>Os artefactos entram nos motores, que produzem resultados, recibos e um Pacote de Evidências; a publicação no Registo Técnico é opcional; o BanzAI apenas apresenta e explica.</desc>
<rect x="0" y="0" width="760" height="320" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="24" y="46" width="168" height="58" rx="4"/><text x="108" y="72" text-anchor="middle" font-size="12.5">artefactos</text><text x="108" y="90" text-anchor="middle" font-size="9.5" class="m">obtidos da origem</text><line class="l" x1="192" y1="75" x2="210" y2="75" marker-end="url(#a)"/><rect class="b" x="212" y="46" width="176" height="58" rx="4"/><text x="300" y="72" text-anchor="middle" font-size="12.5">motores Rust</text><text x="300" y="90" text-anchor="middle" font-size="9.5" class="m">decidem</text><line class="l" x1="388" y1="75" x2="406" y2="75" marker-end="url(#a)"/><rect class="b" x="408" y="46" width="150" height="58" rx="4"/><text x="483" y="72" text-anchor="middle" font-size="12.5">resultados</text><text x="483" y="90" text-anchor="middle" font-size="9.5" class="m">e recibos</text><line class="l" x1="558" y1="75" x2="576" y2="75" marker-end="url(#a)"/><rect class="b" x="578" y="46" width="158" height="58" rx="4"/><text x="657" y="72" text-anchor="middle" font-size="12.5">Pacote de</text><text x="657" y="90" text-anchor="middle" font-size="12.5">Evidências</text><line class="d" x1="657" y1="104" x2="657" y2="170" marker-end="url(#a)"/><text x="669" y="141" text-anchor="start" font-size="9.5" class="m">opcional</text><rect class="d" x="578" y="170" width="158" height="52" rx="4"/><text x="657" y="192" text-anchor="middle" font-size="12">Registo Técnico</text><text x="657" y="209" text-anchor="middle" font-size="9.5" class="m">opcional e separado</text><rect class="d" x="24" y="252" width="712" height="42" rx="4"/><text x="380" y="278" text-anchor="middle" font-size="12">BanzAI — apenas apresenta e explica (não decide nem publica)</text>
</svg>
