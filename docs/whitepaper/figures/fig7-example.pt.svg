<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226" role="img" aria-label="A implementação B publica material verificável; a implementação ou avaliador A inicia a jornada, obtém os artefactos, avalia e verifica o resultado sob a sua política local." font-family="Georgia, 'Times New Roman', serif">
<title>Avaliação direccional A→B</title><desc>A implementação B publica material verificável; a implementação ou avaliador A inicia a jornada, obtém os artefactos, avalia e verifica o resultado sob a sua política local.</desc>
<rect x="0" y="0" width="760" height="226" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<text x="24" y="30" text-anchor="start" font-size="11" class="n">Implementação B</text><rect class="b" x="60" y="40" width="200" height="44" rx="4"/><text x="160" y="59" text-anchor="middle" font-size="10.5">1. publica</text><text x="160" y="75" text-anchor="middle" font-size="9" class="m">manifesto, chaves, artefactos</text><line class="l" x1="260" y1="62" x2="298" y2="62" marker-end="url(#a)"/><rect class="b" x="300" y="40" width="168" height="44" rx="4"/><text x="384" y="59" text-anchor="middle" font-size="10.5">origem canónica</text><text x="384" y="75" text-anchor="middle" font-size="9" class="m">artefactos assinados</text><line class="d" x1="16" y1="100" x2="744" y2="100"/><text x="24" y="126" text-anchor="start" font-size="11" class="n">Implementação A / avaliador</text><rect class="b" x="24" y="138" width="160" height="44" rx="4"/><text x="104.0" y="157" text-anchor="middle" font-size="10">2. inicia</text><text x="104.0" y="173" text-anchor="middle" font-size="8.5" class="m">a jornada</text><rect class="b" x="208" y="138" width="160" height="44" rx="4"/><text x="288.0" y="157" text-anchor="middle" font-size="10">3. obtém artefactos</text><text x="288.0" y="173" text-anchor="middle" font-size="8.5" class="m">via módulo de obtenção segura</text><rect class="b" x="392" y="138" width="160" height="44" rx="4"/><text x="472.0" y="157" text-anchor="middle" font-size="10">4. avalia</text><text x="472.0" y="173" text-anchor="middle" font-size="8.5" class="m">motores · nove passos</text><rect class="b" x="576" y="138" width="160" height="44" rx="4"/><text x="656.0" y="157" text-anchor="middle" font-size="10">5. verifica o resultado</text><text x="656.0" y="173" text-anchor="middle" font-size="8.5" class="m">e aplica política local</text><line class="l" x1="184" y1="160" x2="208" y2="160" marker-end="url(#a)"/><line class="l" x1="368" y1="160" x2="392" y2="160" marker-end="url(#a)"/><line class="l" x1="552" y1="160" x2="576" y2="160" marker-end="url(#a)"/><line class="l" x1="384" y1="84" x2="384" y2="100"/><line class="l" x1="384" y1="100" x2="288" y2="100"/><line class="l" x1="288" y1="100" x2="288" y2="138" marker-end="url(#a)"/><text x="380" y="214" text-anchor="middle" font-size="9.5" class="m">BANZA não determina acordos, admissão, liquidação nem autorização; a utilização do resultado é local</text>
</svg>
