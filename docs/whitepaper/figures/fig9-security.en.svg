<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Each threat maps to a protection mechanism and an expected outcome; absent inputs lead to non-passing." font-family="Georgia, 'Times New Roman', serif">
<title>Threat, mechanism and expected outcome</title><desc>Each threat maps to a protection mechanism and an expected outcome; absent inputs lead to non-passing.</desc>
<rect x="0" y="0" width="760" height="300" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<text x="140" y="34" text-anchor="middle" font-size="11.5" class="n">threat</text><text x="400" y="34" text-anchor="middle" font-size="11.5" class="n">mechanism</text><text x="640" y="34" text-anchor="middle" font-size="11.5" class="n">expected outcome</text><line class="l" x1="16" y1="44" x2="744" y2="44"/><text x="140" y="66" text-anchor="middle" font-size="10.5">artifact tampering</text><line class="l" x1="250" y1="62" x2="286" y2="62" marker-end="url(#a)"/><text x="400" y="66" text-anchor="middle" font-size="10.5">signatures</text><line class="l" x1="514" y1="62" x2="550" y2="62" marker-end="url(#a)"/><text x="640" y="66" text-anchor="middle" font-size="10.5">detection</text><text x="140" y="106" text-anchor="middle" font-size="10.5">false origin</text><line class="l" x1="250" y1="102" x2="286" y2="102" marker-end="url(#a)"/><text x="400" y="106" text-anchor="middle" font-size="10.5">resolved canonical origin</text><line class="l" x1="514" y1="102" x2="550" y2="102" marker-end="url(#a)"/><text x="640" y="106" text-anchor="middle" font-size="10.5">rejection</text><text x="140" y="146" text-anchor="middle" font-size="10.5">revoked/expired key</text><line class="l" x1="250" y1="142" x2="286" y2="142" marker-end="url(#a)"/><text x="400" y="146" text-anchor="middle" font-size="10.5">revocation and expiry</text><line class="l" x1="514" y1="142" x2="550" y2="142" marker-end="url(#a)"/><text x="640" y="146" text-anchor="middle" font-size="10.5">non-passing</text><text x="140" y="186" text-anchor="middle" font-size="10.5">challenge replay</text><line class="l" x1="250" y1="182" x2="286" y2="182" marker-end="url(#a)"/><text x="400" y="186" text-anchor="middle" font-size="10.5">single-use challenge</text><line class="l" x1="514" y1="182" x2="550" y2="182" marker-end="url(#a)"/><text x="640" y="186" text-anchor="middle" font-size="10.5">refusal</text><text x="140" y="226" text-anchor="middle" font-size="10.5">SSRF · DNS rebinding</text><line class="l" x1="250" y1="222" x2="286" y2="222" marker-end="url(#a)"/><text x="400" y="226" text-anchor="middle" font-size="10.5">hardened retrieval</text><line class="l" x1="514" y1="222" x2="550" y2="222" marker-end="url(#a)"/><text x="640" y="226" text-anchor="middle" font-size="10.5">blocking</text><line class="d" x1="16" y1="270" x2="744" y2="270"/><text x="380" y="288" text-anchor="middle" font-size="9.5" class="m">when evidence is missing or inconsistent, evaluation fails closed</text>
</svg>
