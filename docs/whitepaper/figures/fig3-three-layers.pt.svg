<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-label="Camada 1, protocolo aberto; implementações distintas; Camada 2, certificação de conformidade e interoperabilidade; Camada 3, esquemas operacionais independentes; BanzAI transversal." font-family="Georgia, 'Times New Roman', serif">
<title>As três camadas institucionais e o BanzAI transversal</title><desc>Camada 1, protocolo aberto; implementações distintas; Camada 2, certificação de conformidade e interoperabilidade; Camada 3, esquemas operacionais independentes; BanzAI transversal.</desc>
<rect x="0" y="0" width="760" height="296" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="40" y="12" width="680" height="40" rx="4"/><text x="380" y="31" text-anchor="middle" font-size="12" class="n">Camada 1 — Protocolo aberto</text><text x="380" y="46" text-anchor="middle" font-size="9.5" class="m">especificações · contratos · perfis · descoberta · confiança</text><rect class="b" x="70" y="70" width="160" height="30" rx="4"/><text x="150" y="90" text-anchor="middle" font-size="10.5">Implementação A</text><line class="d" x1="150" y1="52" x2="150" y2="70" marker-end="url(#a)"/><rect class="b" x="300" y="70" width="160" height="30" rx="4"/><text x="380" y="90" text-anchor="middle" font-size="10.5">Implementação B</text><line class="d" x1="380" y1="52" x2="380" y2="70" marker-end="url(#a)"/><rect class="b" x="530" y="70" width="160" height="30" rx="4"/><text x="610" y="90" text-anchor="middle" font-size="10.5">Implementação C</text><line class="d" x1="610" y1="52" x2="610" y2="70" marker-end="url(#a)"/><rect class="b" x="40" y="118" width="680" height="40" rx="4"/><text x="380" y="137" text-anchor="middle" font-size="12" class="n">Camada 2 — Certificação de Conformidade e Interoperabilidade</text><text x="380" y="152" text-anchor="middle" font-size="9" class="m">avalia a conformidade de cada implementação por perfil, versão e evidência</text><line class="d" x1="150" y1="100" x2="150" y2="118" marker-end="url(#a)"/><line class="d" x1="380" y1="100" x2="380" y2="118" marker-end="url(#a)"/><line class="d" x1="610" y1="100" x2="610" y2="118" marker-end="url(#a)"/><rect class="b" x="40" y="176" width="680" height="80" rx="4"/><text x="380" y="196" text-anchor="middle" font-size="12" class="n">Camada 3 — Esquemas operacionais independentes</text><rect class="b" x="70" y="212" width="160" height="32" rx="4"/><text x="150" y="233" text-anchor="middle" font-size="10.5">Esquema X</text><rect class="b" x="300" y="212" width="160" height="32" rx="4"/><text x="380" y="233" text-anchor="middle" font-size="10.5">Infraestrutura Y</text><rect class="b" x="530" y="212" width="160" height="32" rx="4"/><text x="610" y="233" text-anchor="middle" font-size="10.5">Rede Z</text><line class="d" x1="380" y1="158" x2="380" y2="176" marker-end="url(#a)"/><rect class="d" x="40" y="268" width="680" height="22" rx="4"/><text x="380" y="283" text-anchor="middle" font-size="9.5" class="m">BanzAI — interface transversal e não autoritativa; o protocolo funciona sem esta interface</text>
</svg>
