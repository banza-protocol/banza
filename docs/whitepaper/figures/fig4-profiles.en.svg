<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Each level includes all lower ones and adds capabilities; L3 is the federation threshold and L4 is profile-defined." font-family="Georgia, 'Times New Roman', serif">
<title>The cumulative conformance levels L0–L4</title><desc>Each level includes all lower ones and adds capabilities; L3 is the federation threshold and L4 is profile-defined.</desc>
<rect x="0" y="0" width="760" height="300" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="b" x="80" y="30" width="640" height="42" rx="4"/><text x="112" y="56" text-anchor="middle" font-size="13" class="n">L4</text><text x="150" y="48" text-anchor="start" font-size="11">External Interoperability</text><text x="150" y="64" text-anchor="start" font-size="9" class="m">integration with external networks · profile-defined</text><rect class="b" x="80" y="78" width="640" height="42" rx="4"/><text x="112" y="104" text-anchor="middle" font-size="13" class="n">L3</text><text x="150" y="96" text-anchor="start" font-size="11">Inter-Operator Interoperability</text><text x="150" y="112" text-anchor="start" font-size="9" class="m">routing, settlement · federation threshold</text><rect class="b" x="80" y="126" width="640" height="42" rx="4"/><text x="112" y="152" text-anchor="middle" font-size="13" class="n">L2</text><text x="150" y="144" text-anchor="start" font-size="11">Payment Initiation Capability</text><text x="150" y="160" text-anchor="start" font-size="9" class="m">requests and dynamic QR, instant execution</text><rect class="b" x="80" y="174" width="640" height="42" rx="4"/><text x="112" y="200" text-anchor="middle" font-size="13" class="n">L1</text><text x="150" y="192" text-anchor="start" font-size="11">Core Payment Capability</text><text x="150" y="208" text-anchor="start" font-size="9" class="m">payment, transfer, double-entry ledger</text><rect class="b" x="80" y="222" width="640" height="42" rx="4"/><text x="112" y="248" text-anchor="middle" font-size="13" class="n">L0</text><text x="150" y="240" text-anchor="start" font-size="11">Protocol Sandbox</text><text x="150" y="256" text-anchor="start" font-size="9" class="m">secure configuration · MON-001</text><line class="l" x1="52" y1="256" x2="52" y2="34" marker-end="url(#a)"/><text x="46" y="150" text-anchor="middle" font-size="9.5" class="m" transform="rotate(-90 46 150)">includes lower levels</text><text x="400" y="292" text-anchor="middle" font-size="9.5" class="m">cumulative levels · technical evidence, not certification</text>
</svg>
