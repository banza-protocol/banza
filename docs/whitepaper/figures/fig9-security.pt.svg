<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Cada ameaça corresponde a um mecanismo de protecção e a um resultado esperado; entradas ausentes conduzem à não aprovação." font-family="Georgia, 'Times New Roman', serif">
<title>Ameaça, mecanismo e resultado esperado</title><desc>Cada ameaça corresponde a um mecanismo de protecção e a um resultado esperado; entradas ausentes conduzem à não aprovação.</desc>
<rect x="0" y="0" width="760" height="300" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<text x="140" y="34" text-anchor="middle" font-size="11.5" class="n">ameaça</text><text x="400" y="34" text-anchor="middle" font-size="11.5" class="n">mecanismo</text><text x="640" y="34" text-anchor="middle" font-size="11.5" class="n">resultado esperado</text><line class="l" x1="16" y1="44" x2="744" y2="44"/><text x="140" y="66" text-anchor="middle" font-size="10.5">adulteração de artefactos</text><line class="l" x1="250" y1="62" x2="286" y2="62" marker-end="url(#a)"/><text x="400" y="66" text-anchor="middle" font-size="10.5">assinaturas</text><line class="l" x1="514" y1="62" x2="550" y2="62" marker-end="url(#a)"/><text x="640" y="66" text-anchor="middle" font-size="10.5">detecção</text><text x="140" y="106" text-anchor="middle" font-size="10.5">origem falsa</text><line class="l" x1="250" y1="102" x2="286" y2="102" marker-end="url(#a)"/><text x="400" y="106" text-anchor="middle" font-size="10.5">origem canónica resolvida</text><line class="l" x1="514" y1="102" x2="550" y2="102" marker-end="url(#a)"/><text x="640" y="106" text-anchor="middle" font-size="10.5">rejeição</text><text x="140" y="146" text-anchor="middle" font-size="10.5">chave revogada/expirada</text><line class="l" x1="250" y1="142" x2="286" y2="142" marker-end="url(#a)"/><text x="400" y="146" text-anchor="middle" font-size="10.5">revogação e expiração</text><line class="l" x1="514" y1="142" x2="550" y2="142" marker-end="url(#a)"/><text x="640" y="146" text-anchor="middle" font-size="10.5">não aprovado</text><text x="140" y="186" text-anchor="middle" font-size="10.5">repetição de desafio</text><line class="l" x1="250" y1="182" x2="286" y2="182" marker-end="url(#a)"/><text x="400" y="186" text-anchor="middle" font-size="10.5">desafio de uso único</text><line class="l" x1="514" y1="182" x2="550" y2="182" marker-end="url(#a)"/><text x="640" y="186" text-anchor="middle" font-size="10.5">recusa</text><text x="140" y="226" text-anchor="middle" font-size="10.5">SSRF · reassociação DNS</text><line class="l" x1="250" y1="222" x2="286" y2="222" marker-end="url(#a)"/><text x="400" y="226" text-anchor="middle" font-size="10.5">obtenção endurecida</text><line class="l" x1="514" y1="222" x2="550" y2="222" marker-end="url(#a)"/><text x="640" y="226" text-anchor="middle" font-size="10.5">bloqueio</text><line class="d" x1="16" y1="270" x2="744" y2="270"/><text x="380" y="288" text-anchor="middle" font-size="9.5" class="m">quando a evidência falta ou é inconsistente, a avaliação fecha por omissão</text>
</svg>
