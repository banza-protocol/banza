<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-label="Cada ameaça considerada corresponde a um mecanismo de protecção e a um resultado esperado; entradas ausentes ou inconsistentes conduzem ao fecho por omissão." font-family="Georgia, 'Times New Roman', serif">
<title>Ameaças, mecanismos e resultados esperados</title><desc>Cada ameaça considerada corresponde a um mecanismo de protecção e a um resultado esperado; entradas ausentes ou inconsistentes conduzem ao fecho por omissão.</desc>
<rect x="0" y="0" width="760" height="268" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
