<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="O BANZA avalia a conformidade e observa os artefactos declarados; a autorização regulatória, os controlos internos e o comportamento fora do protocolo ficam fora do âmbito." font-family="Georgia, 'Times New Roman', serif">
<title>Fronteira do que o BANZA avalia</title><desc>O BANZA avalia a conformidade e observa os artefactos declarados; a autorização regulatória, os controlos internos e o comportamento fora do protocolo ficam fora do âmbito.</desc>
<rect x="0" y="0" width="760" height="300" fill="none"/>
<style>text{fill:#000} .m{font-family:ui-monospace,Menlo,Consolas,monospace} .b{fill:none;stroke:#000;stroke-width:1.4} .l{stroke:#000;stroke-width:1.2;fill:none} .d{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none} .n{font-weight:bold}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#000"/></marker></defs>
<rect class="d" x="40" y="30" width="680" height="240" rx="4"/><text x="60" y="52" text-anchor="start" font-size="11" class="n">fora do âmbito</text><text x="60" y="74" text-anchor="start" font-size="9.5" class="m">· autorização regulatória</text><text x="60" y="92" text-anchor="start" font-size="9.5" class="m">· controlos internos do operador</text><text x="60" y="110" text-anchor="start" font-size="9.5" class="m">· comportamento fora do protocolo</text><rect class="b" x="200" y="140" width="360" height="110" rx="4"/><text x="380" y="168" text-anchor="middle" font-size="11.5" class="n">o BANZA avalia e observa</text><text x="380" y="192" text-anchor="middle" font-size="10" class="m">conformidade face a um perfil público</text><text x="380" y="210" text-anchor="middle" font-size="10" class="m">artefactos declarados, no instante observado</text><text x="380" y="234" text-anchor="middle" font-size="9.5" class="m">um resultado técnico não representa autorização</text>
</svg>
