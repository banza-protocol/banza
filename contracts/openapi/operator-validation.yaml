openapi: "3.1.0"
info:
  title: BANZA Endpoint-Originated Operator Validation — BanzAI Validation Surface
  version: "1.0"
  description: |
    Reference/documentary contract for BanzAI's **endpoint-originated** operator
    validation surface (ADR-034). It is not a new financial
    invariant — it documents the request/response shapes of the two validation
    routes and the artifact/record schemas the journey resolves and fetches.

    ## The model

    **The operator publishes; BanzAI obtains; Rust verifies; the receipt fixes
    the result; the Technical Registry publishes the verifiable state.**

    - The **operator** is the responsible entity; the **implementation** is the
      technical system evaluated (ADR-034). Validating an operator
      always means evaluating one of its published implementations — never the
      entity in the abstract.
    - Official validation is **endpoint-originated**: every evaluated artifact is
      obtained exclusively from the **public endpoints** of the selected
      implementation. No pasted content, uploaded file, user-supplied URL, local
      fixture, frontend mock or pre-computed result may enter the official
      journey (ADR-034). Upload/paste lives only in a local, non-authoritative
      **draft** tool (ADR-034).
    - The target is resolved from the closed **BANZA Technical Registry**
      (`operator_id → implementation_id → canonical_origin → discovery`), the only
      source of validation targets (ADR-034).
    - The official fetch is performed by a **secure Rust artifact fetcher**
      (`engines/banza-artifact-fetcher`), never by the browser: it pins the host
      to the registry, enforces HTTPS, blocks private/loopback/link-local ranges
      and cloud metadata, forbids cross-host redirects, bounds size and time,
      validates media type and TLS, and binds each response to a hash, timestamp
      and (where applicable) signature (ADR-034). The no-network decision
      engines receive already-fetched content and decide the verdict.

    ## Authority boundary

    **Rust decides every verdict; Qwen only explains; TypeScript never decides.**
    In validation mode `qwen_calls` and `external_model_calls` are always 0;
    protocol fetches are counted as `protocol_fetch_count`. The Certification
    Readiness step aggregates the technical verdicts (READY or BLOCKED) — it is
    **never** a Certification Record and **never** returns `CERTIFIED`.

    **Technical validation is not an issued certification; technical
    certification is not scheme admission nor regulatory authorisation**
    (ADR-005). See ADR-034, ADR-033 (technical registry), ADR-032 (closed
    certification-state machine), ADR-038 (Rust-first engines) and
    `docs/reports/SECURE_ARTIFACT_FETCHER_REPORT.md`.

    ## What this surface is NOT

    - It performs **no financial action** and holds no funds.
    - It never fetches a caller-supplied URL and never reads pasted/uploaded
      content in the official journey.
    - A receipt is **not** a certificate, a licence, a scheme admission, or a
      regulatory authorisation.

servers:
  - url: https://banza.network
    description: BANZA public surface. The browser calls these routes under `/banzai/validate/*`, same-origin; the internal `banzai-api` service exposes them at `/validate/*`.

tags:
  - name: Validation
    description: Endpoint-originated operator/implementation validation (BanzAI validation mode).

paths:
  /banzai/validate/step:
    post:
      operationId: validateStep
      summary: Run a single validation step against a published implementation
      description: |
        Resolves the target from the closed Technical Registry
        (`operator_id → implementation_id → canonical_origin → discovery`), fetches
        the step's artifact(s) from the implementation's public endpoints via the
        secure Rust fetcher, runs the matching no-network Rust decision engine on
        the fetched content, and returns a single §30 `OperationReceipt` bound to
        the exact origin of the inputs.

        For `step: "certification"`, the eight technical steps run first so the
        Certification Readiness is derived from real endpoint evidence, never from
        a client claim.
      tags: [Validation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateStepRequest"
      responses:
        "200":
          description: The step ran; the receipt carries the Rust verdict.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, receipt]
                properties:
                  ok:
                    type: boolean
                    const: true
                  receipt:
                    $ref: "#/components/schemas/OperationReceipt"
        "400":
          description: Malformed request, missing target, or unknown step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Target could not be resolved (not an eligible operator/implementation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetNotResolved"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ValidationError502"

  /banzai/validate/journey:
    post:
      operationId: validateJourney
      summary: Run the full nine-step validation journey against a published implementation
      description: |
        Runs the eight technical steps (each fetching from the implementation's
        public endpoints) plus the Certification Readiness aggregation, and returns
        a §31 `JourneyReceipt` sealing the ordered `OperationReceipt`s. The journey
        never issues a Certification Record and never returns `CERTIFIED`.
      tags: [Validation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateJourneyRequest"
      responses:
        "200":
          description: The journey ran; the journey receipt carries the aggregated Rust verdicts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, journey_receipt]
                properties:
                  ok:
                    type: boolean
                    const: true
                  journey_receipt:
                    $ref: "#/components/schemas/JourneyReceipt"
        "400":
          description: Malformed request or missing target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Target could not be resolved (not an eligible operator/implementation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetNotResolved"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ValidationError502"

components:
  responses:
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    ValidationError502:
      description: The validation could not complete (upstream/engine error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

  schemas:
    ValidationStep:
      type: string
      description: The canonical nine-step spine (ADR-034). The first eight are technical; `certification` aggregates.
      enum:
        - discovery
        - manifest
        - keys
        - conformance
        - interoperability
        - trust
        - federation
        - evidence
        - certification

    ResolutionReason:
      type: string
      description: |
        Typed ineligibility / resolution-failure reason (ADR-034). Presence in
        the registry is not admission; a non-published / revoked / origin-less /
        incompatible / wrong-environment record is simply not an eligible target.
      enum:
        - unknown_operator
        - duplicate_operator
        - operator_unpublished
        - operator_removed
        - operator_revoked
        - unknown_implementation
        - duplicate_implementation
        - implementation_operator_mismatch
        - implementation_unpublished
        - implementation_removed
        - implementation_revoked
        - origin_missing
        - incompatible_protocol_version
        - unsupported_environment
        - incompatible_profile

    ValidateStepRequest:
      type: object
      additionalProperties: false
      required: [operator_id, implementation_id, step]
      properties:
        operator_id:
          type: string
          description: The responsible operator's id (a closed-set slug). Never a URL.
        implementation_id:
          type: string
          description: One of the operator's published implementations. Never a URL.
        step:
          $ref: "#/components/schemas/ValidationStep"

    ValidateJourneyRequest:
      type: object
      additionalProperties: false
      required: [operator_id, implementation_id]
      properties:
        operator_id:
          type: string
          description: The responsible operator's id (a closed-set slug). Never a URL.
        implementation_id:
          type: string
          description: One of the operator's published implementations. Never a URL.

    TargetNotResolved:
      type: object
      additionalProperties: false
      required: [error, eligible, reason, operator_id, implementation_id]
      properties:
        error:
          type: string
          const: target_not_resolved
        eligible:
          type: boolean
          const: false
        reason:
          $ref: "#/components/schemas/ResolutionReason"
        operator_id:
          type: string
        implementation_id:
          type: string

    ValidationError:
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code (e.g. bad_request, missing_target, unknown_step, rate_limited, validation_error).
        detail:
          type: string

    OperatorRecord:
      description: |
        Registry record for the responsible entity. Mirrors
        `contracts/production/operator-record.production.schema.json`.
      allOf:
        - $ref: "../production/operator-record.production.schema.json"

    ImplementationRecord:
      description: |
        Registry record for the technical system evaluated. Mirrors
        `contracts/production/implementation-record.production.schema.json`.
      allOf:
        - $ref: "../production/implementation-record.production.schema.json"

    DiscoveryDocument:
      description: |
        The implementation's discovery document (step 1). Mirrors
        `contracts/production/discovery-document.production.schema.json`.
      allOf:
        - $ref: "../production/discovery-document.production.schema.json"

    CapabilitiesDocument:
      description: |
        The implementation's declared capabilities. Mirrors
        `contracts/production/capabilities-document.production.schema.json`.
      allOf:
        - $ref: "../production/capabilities-document.production.schema.json"

    SignedProtocolMetadata:
      description: |
        The implementation's signed protocol metadata (keys/trust steps). Mirrors
        `contracts/production/signed-protocol-metadata.production.schema.json`.
      allOf:
        - $ref: "../production/signed-protocol-metadata.production.schema.json"

    FederationManifest:
      description: |
        The implementation's federation manifest/metadata (federation step). Mirrors
        `contracts/federation/federation-manifest.json`.
      allOf:
        - $ref: "../federation/federation-manifest.json"

    OperationReceipt:
      description: |
        Per-step receipt bound to the exact origin of the inputs (§30). Mirrors
        `contracts/production/operation-receipt.production.schema.json`.
      allOf:
        - $ref: "../production/operation-receipt.production.schema.json"

    JourneyReceipt:
      description: |
        Aggregate nine-step receipt (§31). Mirrors
        `contracts/production/journey-receipt.production.schema.json`.
      allOf:
        - $ref: "../production/journey-receipt.production.schema.json"
