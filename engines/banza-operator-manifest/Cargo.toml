[package]
name = "banza-operator-manifest"
version = "0.1.0"
edition = "2021"
description = "banza-operator-manifest (BX1.6): local, no-network technical validation of a candidate operator manifest. It validates the canonical OperatorManifest (per contracts/openapi + conformance vectors MAN-001..004) plus a DRAFT candidate-submission extension, and computes status/readiness/hashes IN RUST. A valid manifest is technical evidence — it NEVER certifies, approves, creates an operator, or changes /operators."
license = "Apache-2.0"

[lib]
name = "banza_operator_manifest"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# BCJ/1 is the single canonical byte form (spec/canonicalization.md, ADR-011).
banza-trust = { path = "../banza-trust", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"                 # default Map = BTreeMap (sorted keys) → canonical JSON for hashing
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }

[features]
# Enabled only for the standalone `wasm-pack build --features wasm`; keeps the WASM exports leak-free.
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 2
