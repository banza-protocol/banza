[package]
name = "rust-rule-guard"
version = "0.1.0"
edition = "2021"
description = "Rust-first policy enforcement (ADR-043): blocks new non-Rust engines in official BANZA/BanzAI code; allows UI/glue, wrappers and R0-allowlisted legacy. No network."
license = "Apache-2.0"

[lib]
name = "rust_rule_guard"
path = "src/lib.rs"

[[bin]]
name = "rust-rule-guard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
