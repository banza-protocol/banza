[package]
name = "banza-security-assurance"
version = "0.1.0"
edition = "2021"
description = "banza-security-assurance (BX2.0): local, no-network validation of the BANZA security & risk assurance baseline. It reads a risk register summary, threat model summary, controls matrix summary, the L0–L4 readiness reports, the Evidence Bundle report, the trust/BRL report and a regulatory-boundary confirmation, and computes the assurance status IN RUST. Security & Risk Assurance is an internal security/risk evaluation — NOT production, NOT an external audit, NOT certification, NOT a licence; it does not create an operator, does not move funds, and does not make BANZA a payment service provider."
license = "Apache-2.0"

[lib]
name = "banza_security_assurance"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"                 # default Map = BTreeMap (sorted keys) → canonical JSON for hashing
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }

[features]
# Enabled only for the standalone `wasm-pack build --features wasm`; keeps the WASM exports leak-free.
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 2
