[package]
name = "banza-open-governance"
version = "0.1.0"
edition = "2021"
description = "banza-open-governance (M2.2): local, no-network validation of the BANZA OPEN PROTOCOL GOVERNANCE package — governance model, layered architecture, operator self-publication, conformance automation, trust root, revocation model, protocol maintainers, succession model, deprecated-authority inventory and a regulatory-boundary confirmation. It computes the status IN RUST and detects any dependency on a central human operator authority, on human operator approval, or on operator-certificate semantics. BANZA is an open financial protocol: humans maintain the protocol; they do not authorise, certify, accept or approve operators."
license = "Apache-2.0"

[lib]
name = "banza_open_governance"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# BCJ/1 is the single canonical byte form (spec/canonicalization.md, ADR-082).
banza-trust = { path = "../banza-trust", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"                 # default Map = BTreeMap (sorted keys) → canonical JSON for hashing
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }

[features]
# Enabled only for the standalone `wasm-pack build --features wasm`; keeps the WASM exports leak-free.
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 2
