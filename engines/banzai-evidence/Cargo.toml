[package]
name = "banzai-evidence"
version = "0.2.0"
edition = "2021"
description = "BanzAI deterministic evidence engine (ADR-043, R2): normalization, intent routing, decision library, guardrails, citation + evidence-bundle composition, and a static local retrieval index over the BANZA corpus. No LLM, no network, no GPU. Compiles native (CLI/tests) and to WASM (website)."
license = "Apache-2.0"

[lib]
name = "banzai_evidence"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "banzai-evidence"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
