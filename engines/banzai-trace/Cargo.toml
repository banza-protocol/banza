[package]
name = "banzai-trace"
version = "0.1.0"
edition = "2021"
description = "banzai-trace (ADR-038, M2.19G.6): the deterministic BanzAI financial-trace verifier — INV-TRACE-001 / INV-LEDGER-001 / INV-STL-001 over a payment-flow trace JSON. Extracted into the monorepo from the former banza-protocol/banzai engines/banzai-core so the shipped trace WASM has buildable in-tree source. Deterministic, no network, no LLM, no provider. Technical evidence, never certification."
license = "Apache-2.0"

[lib]
name = "banzai_trace"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[features]
# Enabled only for the standalone `wasm-pack build --features wasm`. Exports only trace_explain_json.
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 2
