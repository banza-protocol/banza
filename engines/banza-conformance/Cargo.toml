[package]
name = "banza-conformance"
version = "0.1.0"
edition = "2021"
description = "banza-conformance-rs (ADR-043, R4): the Rust BANZA conformance runner. Offline vector-integrity + invariant-consistency + certification-level + schema-compatible report generation, with golden parity. PASS is technical conformance evidence, never production certification. No network by default, no crypto (R5), no operator activation."
license = "Apache-2.0"

[lib]
name = "banza_conformance"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "banza-conformance-rs"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
banza-simb = { path = "../banza-simb" }
banza-trust = { path = "../banza-trust" }
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }

[features]
# Enabled only for the standalone `wasm-pack build --features wasm`. Does NOT enable the deps'
# `wasm` features, so the conformance bundle exports only conformance_* (no simb_*/trust_* leakage).
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 2
