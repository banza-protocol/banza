[package]
name = "banza-repo-guards"
version = "0.1.0"
edition = "2021"
description = "banza-repo-guards (ADR-037, R10): the Rust repository-hygiene gates — repository purity, operator-brand contamination, invariant-registry integrity, and OpenAPI compatibility. Rust owns the logic; git is a data source; the old shell scripts become thin RUST_WRAPPER_ONLY wrappers."
license = "Apache-2.0"

[lib]
name = "banza_repo_guards"
path = "src/lib.rs"

[[bin]]
name = "banza-repo-guards"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
opt-level = 2
