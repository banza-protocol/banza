[package]
name = "banzai-api-kb"
version = "0.1.0"
edition = "2021"
description = "banzai-api-kb (ADR-037, R6): the Rust retrieval engine for the live banzai-api. Faithful port of knowledge.js normalize/scoreEntry/retrieveTopK over the embedded entry keyword index. Deterministic; no LLM, no network. Compiles native (parity tests) and to Node WASM (the live service loads it)."
license = "Apache-2.0"

[lib]
name = "banzai_api_kb"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# M2.18B.7 — the single Rust authority for the query logic. banzai-api-kb owns only the WASM adaptation
# surface and delegates every business decision to this crate (no duplicated authority, no cycle).
banzai-query-core = { path = "../banzai-query-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
